<script>
// ═══════════════════════════════════════════════
// AUDIO SYSTEM — Wheat field atmospheric ambient
// Layered: wind drone + rain texture + distant thunder + wheat rustle
// ═══════════════════════════════════════════════
let audioCtx = null;
let audioPlaying = false;
let audioNodes = [];
let audioGains = {};

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function createNoiseBuffer(duration) {
  const sampleRate = audioCtx.sampleRate;
  const length = sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, length, sampleRate);
  const data = buffer.getChannelData(0);
  let lastOut = 0;
  for (let i = 0; i < length; i++) {
    const white = Math.random() * 2 - 1;
    lastOut = (lastOut + (0.02 * white)) / 1.02;
    data[i] = lastOut * 3.5;
  }
  return buffer;
}

function startMusic() {
  if (!audioCtx) initAudio();
  if (audioPlaying) return;
  audioPlaying = true;
  const now = audioCtx.currentTime;

  // Master chain: compressor → master gain → destination
  const compressor = audioCtx.createDynamicsCompressor();
  compressor.threshold.value = -24;
  compressor.knee.value = 30;
  compressor.ratio.value = 12;
  compressor.attack.value = 0.003;
  compressor.release.value = 0.25;

  const masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.gain.linearRampToValueAtTime(0.06, now + 2.5);
  compressor.connect(masterGain);
  masterGain.connect(audioCtx.destination);
  audioNodes.push(compressor, masterGain);
  audioGains.master = masterGain;

  // ── Layer 1: Wind drone (low D, slow vibrato) ──
  const windOsc = audioCtx.createOscillator();
  windOsc.type = 'sine';
  windOsc.frequency.value = 73.42; // D2
  const windGain = audioCtx.createGain();
  windGain.gain.value = 0;
  windGain.gain.linearRampToValueAtTime(0.3, now + 2);
  windOsc.connect(windGain).connect(compressor);
  windOsc.start(now);
  audioNodes.push(windOsc, windGain);
  audioGains.wind = windGain;

  // Wind LFO for swaying effect
  const windLfo = audioCtx.createOscillator();
  windLfo.type = 'sine';
  windLfo.frequency.value = 0.12;
  const windLfoGain = audioCtx.createGain();
  windLfoGain.gain.value = 0.12;
  windLfo.connect(windLfoGain).connect(windGain.gain);
  windLfo.start(now);
  audioNodes.push(windLfo, windLfoGain);

  // ── Layer 2: Fifth harmonic (A2, warm pad) ──
  const fifthOsc = audioCtx.createOscillator();
  fifthOsc.type = 'triangle';
  fifthOsc.frequency.value = 110.00; // A2
  const fifthGain = audioCtx.createGain();
  fifthGain.gain.value = 0;
  fifthGain.gain.linearRampToValueAtTime(0.1, now + 2.5);
  fifthOsc.connect(fifthGain).connect(compressor);
  fifthOsc.start(now);
  audioNodes.push(fifthOsc, fifthGain);
  audioGains.fifth = fifthGain;

  // ── Layer 3: Rain texture (brown noise filtered) ──
  const noiseBuffer = createNoiseBuffer(2);
  const noiseSrc = audioCtx.createBufferSource();
  noiseSrc.buffer = noiseBuffer;
  noiseSrc.loop = true;
  const noiseFilter = audioCtx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 180;
  noiseFilter.Q.value = 0.5;
  const noiseGain = audioCtx.createGain();
  noiseGain.gain.value = 0;
  noiseGain.gain.linearRampToValueAtTime(0.012, now + 5);
  noiseSrc.connect(noiseFilter).connect(noiseGain).connect(compressor);
  noiseSrc.start(now);
  audioNodes.push(noiseSrc, noiseFilter, noiseGain);
  audioGains.noise = noiseGain;

  // ── Layer 4: Wheat rustle (high-pass noise, very subtle) ──
  const rustleBuffer = createNoiseBuffer(2);
  const rustleSrc = audioCtx.createBufferSource();
  rustleSrc.buffer = rustleBuffer;
  rustleSrc.loop = true;
  const rustleFilter = audioCtx.createBiquadFilter();
  rustleFilter.type = 'highpass';
  rustleFilter.frequency.value = 800;
  rustleFilter.Q.value = 0.3;
  const rustleGain = audioCtx.createGain();
  rustleGain.gain.value = 0;
  rustleGain.gain.linearRampToValueAtTime(0.008, now + 6);
  rustleSrc.connect(rustleFilter).connect(rustleGain).connect(compressor);
  rustleSrc.start(now);
  audioNodes.push(rustleSrc, rustleFilter, rustleGain);
  audioGains.rustle = rustleGain;

  // ── Layer 5: Distant low drone (soil, deep earth feel) ──
  const soilOsc = audioCtx.createOscillator();
  soilOsc.type = 'sine';
  soilOsc.frequency.value = 36.71; // D1
  const soilGain = audioCtx.createGain();
  soilGain.gain.value = 0;
  soilGain.gain.linearRampToValueAtTime(0.08, now + 3);
  soilOsc.connect(soilGain).connect(compressor);
  soilOsc.start(now);
  audioNodes.push(soilOsc, soilGain);
  audioGains.soil = soilGain;

  document.getElementById('audioBtn').classList.remove('muted');
}

function stopMusic() {
  audioPlaying = false;
  audioNodes.forEach(n => { try { n.stop?.(); n.disconnect?.(); } catch(e){} });
  audioNodes = [];
  audioGains = {};
  document.getElementById('audioBtn').classList.add('muted');
}

function toggleMusic() {
  if (audioPlaying) stopMusic();
  else startMusic();
}

document.getElementById('audioBtn').addEventListener('click', toggleMusic);

// Start music on first user interaction
document.addEventListener('click', function startOnce() {
  if (!audioPlaying) startMusic();
}, { once: true });

// ═══════════════════════════════════════════════
// GAME ENGINE
// ═══════════════════════════════════════════════
const app = document.getElementById('app');
let currentPerspective = null;
let currentScene = null;
let meters = {};

function setMeter(name, val) {
  meters[name] = Math.max(0, Math.min(100, val));
}

function renderMeters() {
  if (!currentPerspective || !currentPerspective.meters) return '';
  const names = { trust: '信任值', greed: '贪念值', authority: '威信值', justice: '正义值' };
  const fills = { trust: 'trust', greed: 'greed', authority: 'authority', justice: 'justice' };
  return '<div class="meters">' + Object.entries(currentPerspective.meters).map(([k, v]) => {
    const pct = ((meters[k] || v) / 100 * 100);
    return '<div class="meter-item"><span class="meter-name">' + (names[k]||k) + '</span><span class="meter-val">' + (meters[k]||v) + '</span><div class="meter-bar"><div class="meter-fill ' + (fills[k]||'') + '" style="width:' + pct + '%"></div></div></div>';
  }).join('') + '</div>';
}

function renderMenu() {
  currentPerspective = null;
  currentScene = null;
  meters = {};
  app.innerHTML =
    '<div class="menu-container fade-in">' +
      '<div class="menu-title">割四赔五</div>' +
      '<div class="menu-subtitle">一亩麦田，五百块钱，四个视角的命运交错。<br>选择你的身份，走进这场关于信任、贪婪与救赎的故事。</div>' +
      '<div class="persp-grid">' +
        '<button class="persp-btn" onclick="startGame(\'farmer\')">' +
          '<span class="icon">🚜</span><span class="name">农机手夫妇 · 李佳宇 & 阿迪</span>' +
          '<span class="desc">从五百公里的奔赴到五百块的倒贴，信任被碾碎在麦田里。</span>' +
          '<span class="tag">信任值系统 · 8种结局</span>' +
        '</button>' +
        '<button class="persp-btn" onclick="startGame(\'villager\')">' +
          '<span class="icon">👵</span><span class="name">村民 · 张姓大妈</span>' +
          '<span class="desc">一个人的贪念，如何毁掉一座城的信用。</span>' +
          '<span class="tag">贪念值系统 · 8种结局</span>' +
        '</button>' +
        '<button class="persp-btn" onclick="startGame(\'official\')">' +
          '<span class="icon">🏛️</span><span class="name">当地干部 · 村支书/镇书记</span>' +
          '<span class="desc">自掏腰包垫付两百，驱车五百公里道歉。</span>' +
          '<span class="tag">威信值系统 · 6种结局</span>' +
        '</button>' +
        '<button class="persp-btn" onclick="startGame(\'bystander\')">' +
          '<span class="icon">📱</span><span class="name">旁观者 · 路人/网友</span>' +
          '<span class="desc">一个视频，百亿阅读，每个人都可以是改变世界的手。</span>' +
          '<span class="tag">正义值系统 · 6种结局</span>' +
        '</button>' +
      '</div>' +
    '</div>';
}

function renderGame(scene) {
  currentScene = scene;
  const isEnding = scene.isEnding;
  let html =
    '<div class="game-header">' +
      '<span class="persp-label">' + currentPerspective.icon + ' ' + currentPerspective.name + '</span>' +
      '<button class="back-btn" onclick="renderMenu()">← 返回主菜单</button>' +
    '</div>' +
    renderMeters() +
    '<div class="scene-box fade-in">';

  if (isEnding) {
    html +=
      '<div class="ending-box">' +
        '<div class="ending-label">✦ 结局 ✦</div>' +
        '<div class="ending-icon">' + (scene.endingIcon || '🌾') + '</div>' +
        '<div class="ending-title">' + scene.title + '</div>' +
        '<div class="ending-text">' + (scene.endingText || scene.text) + '</div>' +
        (scene.philosophy ? '<div class="ending-philosophy">' + scene.philosophy + '</div>' : '') +
      '</div>' +
      '<button class="restart-btn" onclick="startGame(\'' + currentPerspective.id + '\')">🔄 重新开始</button>' +
      '<button class="restart-btn" style="background:var(--card);color:var(--ink);border:1px solid var(--rule);margin-left:0.5rem;" onclick="renderMenu()">🏠 返回主菜单</button>';
  } else {
    html +=
      '<div class="scene-header">' +
        '<div class="scene-title">' + (scene.sceneNum || '') + '</div>' +
        '<div class="scene-name">' + scene.title + '</div>' +
      '</div>' +
      '<div class="scene-text">' + scene.text + '</div>';

    if (scene.bridge) {
      html += '<div class="narr-bridge">' + scene.bridge + '</div>';
    }

    if (scene.choices && scene.choices.length > 0) {
      html += '<div class="choices-box">';
      scene.choices.forEach(function(c, i) {
        var letter = String.fromCharCode(65 + i);
        var isBad = c.meterChange && Object.values(c.meterChange).some(function(v) { return v < 0; });
        html += '<button class="choice-btn" onclick="makeChoice(' + i + ')">' +
          '<span class="letter' + (isBad ? ' bad' : '') + '">' + letter + '</span>' +
          '<span class="choice-body">' + c.text +
            (c.hint ? '<span class="choice-val">' + c.hint + '</span>' : '') +
          '</span>' +
        '</button>';
      });
      html += '</div>';
    } else if (scene.bridge && scene._nextScene) {
      html += '<div class="choices-box"></div>';
    }
  }

  html += '</div>';
  app.innerHTML = html;
  app.scrollTop = 0;
  window.scrollTo(0, 0);
}

function makeChoice(idx) {
  if (!currentScene || !currentScene.choices) return;
  var choice = currentScene.choices[idx];
  if (!choice) return;

  // Apply meter changes
  if (choice.meterChange) {
    Object.entries(choice.meterChange).forEach(function(entry) {
      setMeter(entry[0], (meters[entry[0]] || 0) + entry[1]);
    });
  }

  // Show bridge if exists
  if (choice.bridge) {
    currentScene.bridge = choice.bridge;
    currentScene.choices = [];
    currentScene._nextScene = choice.nextScene;
    renderGame(currentScene);
    // Add continue button
    setTimeout(function() {
      var box = document.querySelector('.choices-box');
      if (box) {
        box.innerHTML = '<button class="choice-btn" onclick="continueFromBridge()"><span class="letter">▶</span><span class="choice-body">继续</span></button>';
      }
    }, 100);
    return;
  }

  goToScene(choice.nextScene);
}

function continueFromBridge() {
  if (currentScene && currentScene._nextScene) {
    goToScene(currentScene._nextScene);
  }
}

function goToScene(sceneId) {
  if (!currentPerspective) return;
  var scene = currentPerspective.scenes[sceneId];
  if (!scene) { console.error('Scene not found:', sceneId); return; }

  // Check meter-gated scenes
  if (scene.requireMeter) {
    var min = scene.requireMeter[1];
    var key = scene.requireMeter[0];
    if ((meters[key] || 0) < min) {
      if (scene.fallback) {
        return goToScene(scene.fallback);
      }
    }
  }

  renderGame(scene);
}

function startGame(perspId) {
  var perspectives = {
    farmer: {
      id: 'farmer', name: '农机手夫妇 · 李佳宇 & 阿迪', icon: '🚜',
      meters: { trust: 80 },
      scenes: buildFarmerScenes()
    },
    villager: {
      id: 'villager', name: '村民 · 张姓大妈', icon: '👵',
      meters: { greed: 30 },
      scenes: buildVillagerScenes()
    },
    official: {
      id: 'official', name: '当地干部 · 村支书/镇书记', icon: '🏛️',
      meters: { authority: 60 },
      scenes: buildOfficialScenes()
    },
    bystander: {
      id: 'bystander', name: '旁观者 · 路人/网友', icon: '📱',
      meters: { justice: 50 },
      scenes: buildBystanderScenes()
    }
  };

  currentPerspective = perspectives[perspId];
  if (!currentPerspective) return;
  meters = {};
  Object.entries(currentPerspective.meters).forEach(function(entry) {
    setMeter(entry[0], entry[1]);
  });
  goToScene('s0');
}

// ═══════════════════════════════════════════════
// PERSPECTIVE 1: FARMER (农机手夫妇)
// ═══════════════════════════════════════════════
function buildFarmerScenes() {
  return {
    // ── Opening ──
    's0': { sceneNum: '第零幕', title: '五百公里的奔赴',
      text: '<p>河南商丘，五月。</p><p>你叫李佳宇，二十一岁。你媳妇阿迪，也是二十一岁。你们有一台三十多万的收割机，有一个四个月大的闺女，有一张皱巴巴的"麦客驰援"号召令。</p><p>天气预报说襄阳的雨还要下。那边的麦子全倒了，再不收就烂在地里。你看着手机里的闺女百天照——她笑得露出两颗小牙。你转头跟阿迪说："走。"</p><p>阿迪什么都没问，把孩子托付给老人，收拾了两件换洗衣服。雨夜，你们发动了收割机，发动机的轰鸣盖过了雨声。五百公里，从商丘到襄阳，从你们家到别人的田。</p><p>天快亮的时候，你们到了古驿镇。麦田在雨中倒成一片，像绿色的海浪被拍碎在沙滩上。</p>',
      choices: [
        { text: '趁天没亮，先找农户', hint: '信任值不变', meterChange: { trust: 0 }, nextScene: 'c1', bridge: '<strong>你把收割机停在路边，打着伞走进了村子。</strong>天还没亮，雨还在下。你敲了第一户人家的门。你相信，只要手脚勤快，总能挣到钱。' },
        { text: '先歇一会儿，天亮再说', hint: '信任值+3', meterChange: { trust: 3 }, nextScene: 'c1', bridge: '<strong>你和阿迪在收割机里眯了一会儿。</strong>你听着雨打在车顶的声音，想起闺女。你对自己说：等这趟活干完，回去给她买个新玩具。' }
      ] },
    // ── Chapter 1 ──
    'c1': { sceneNum: '第一幕', title: '古驿镇的雨',
      text: '<p>天亮了。古驿镇的麦田在雨中沉默着。你看到倒伏的麦子——有的已经泡在水里，有的快要发芽。你心里一紧：这些麦子，再不收就真的来不及了。</p><p>你听到旁边有人在议论："河南来的收割机！""太好了，终于有人来收了。"你心里涌起一股暖意——你们是来帮忙的，是被需要的。</p><p>但你不知道的是，这场雨，不仅淹了麦田，也淹了人心。</p>',
      choices: [
        { text: '主动找农户，问问谁家要收麦', hint: '信任值+5', meterChange: { trust: 5 }, nextScene: 'c2', bridge: '<strong>你主动朝村里走去。</strong>你相信，凭本事吃饭，凭良心做事。你走到村口，看到一群人围着一个上了年纪的妇女——她正朝你走来。' },
        { text: '先歇一晚，明天再说', hint: '信任值-3', meterChange: { trust: -3 }, nextScene: 'c2', bridge: '<strong>你和阿迪在镇上找了家旅馆。</strong>但第二天一早，一个头发花白的大妈就找上门来了。她说她家有麦子要收，不多，就三亩多。' }
      ] },
    // ── Chapter 2 ──
    'c2': { sceneNum: '第二幕', title: '大妈的田',
      text: '<p>张姓大妈找上门来。她看起来六十多岁，头发花白，脸上刻着风吹日晒的皱纹。她说："小伙子，我家地不大，就三亩多。"</p><p>你看了看田——目测至少五亩。你说："大妈，这不止三亩吧？"大妈摆摆手："我种了一辈子地，还能不知道？就三亩多。"</p><p>你犹豫了一下。你想请人丈量，但大妈说："哎呀，丈什么量，费那个事干啥？"阿迪在后面拉了拉你的袖子——她不想惹麻烦。</p><p>最后，你们谈了个折中：按四亩算，400块。</p>',
      choices: [
        { text: '答应，按四亩算', hint: '信任值-5', meterChange: { trust: -5 }, nextScene: 'c3', bridge: '<strong>你点了点头。</strong>你心想：少算一亩就少算一亩吧，出门在外，和气生财。你发动了收割机，开进了大妈的田。' },
        { text: '坚持丈量，该多少是多少', hint: '信任值+5', meterChange: { trust: 5 }, nextScene: 'c3', bridge: '<strong>你坚持要丈量。</strong>大妈不情愿地答应了。丈量结果：五亩二。但大妈说："就按四亩算，我说了算。"你叹了口气，不想再争——下雨天，你只想赶紧把活干完。' }
      ] },
    // ── Chapter 3 ──
    'c3': { sceneNum: '第三幕', title: '泥泞中的三个小时',
      text: '<p>倒伏的湿麦，是收割机手的噩梦。麦秆湿漉漉地缠在刀片上，每割几米就要停下来清理。阿迪蹲在泥里，用手去抠刀片上的麦秆——她的手指被割破了，血混着泥，分不清哪是泥哪是血。</p><p>你从驾驶舱里探出头，看到阿迪跪在泥里的背影，心里像被什么东西狠狠揪了一下。你喊她："阿迪，上来！"她摇摇头，继续清理。</p><p>三个小时。平时二十分钟就能收完的田，你们用了三个小时。收割机吐出的麦粒，有些撒在了地上——这是倒伏湿麦没法避免的损耗。但你心里清楚：每一粒麦子，都是大妈弯腰种的。</p>',
      choices: [
        { text: '继续干，把活干完', hint: '信任值不变', meterChange: { trust: 0 }, nextScene: 'c4', bridge: '<strong>你咬咬牙，踩下油门。</strong>收割机在泥里艰难地前进。你告诉自己：再难也要干完。这是你的工作，也是你的信用。' }
      ] },
    // ── Chapter 4 ──
    'c4': { sceneNum: '第四幕', title: '割四赔五',
      text: '<p>收割完毕。你擦了擦汗，准备收钱走人。但大妈拦在了收割机前。</p><p>她指着地上的麦粒，声音尖利起来："你看看！你看看！撒了多少麦子！这得多少斤！"你解释这是倒伏湿麦的正常损耗，但她不听。她的话越来越离谱——"三亩多"变成了"四亩"，"四亩"又变成了"五亩二"。最后她说："你们不仅不能收工钱，还要赔我五百块！"</p><p>你看着地上的麦粒，又看着大妈的脸。你干了这么多年收割机，从来没见过这种事。阿迪站在你旁边，她的手还在流血。</p>',
      choices: [
        { text: '报警，让警察来处理', hint: '信任值-10', meterChange: { trust: -10 }, nextScene: 'c5', bridge: '<strong>你拨了110。</strong>等待警察的时候，大妈还在不停地数落。你看着阿迪——她的手在发抖。你握住她的手，但你的手也在抖。' },
        { text: '跟大妈理论，讲道理', hint: '信任值-5', meterChange: { trust: -5 }, nextScene: 'c5', bridge: '<strong>你试着跟大妈讲道理。</strong>你说："大妈，这是倒伏湿麦，撒点麦粒是正常的。"但大妈根本不听——她越说越激动，声音越来越大，引来了越来越多的围观者。' },
        { text: '忍气吞声，赔钱了事', hint: '信任值-15', meterChange: { trust: -15 }, nextScene: 'c5', bridge: '<strong>你攥紧了拳头，又松开了。</strong>你告诉自己：出门在外，多一事不如少一事。你从口袋里掏出钱——但你没有五百块，你连四百块工钱都还没拿到。' }
      ] },
    // ── Chapter 5 ──
    'c5': { sceneNum: '第五幕', title: '阿迪的眼泪',
      text: '<p>警察和村干部来了。村支书判定：麦粒撒落是正常损耗，大妈的要求不合理。</p><p>但大妈不依不饶。她拦在收割机前，不给钱不让走。围观的人越来越多——有人摇头，有人叹气，有人掏出手机。</p><p>村支书叹了口气，从自己口袋里掏出两百块，递给大妈。他说："我垫两百，你们再补三百，这事就算了。"</p><p>你愣住了。你不仅没拿到四百块工钱，还要倒贴三百块。阿迪从口袋里摸出钱——她的手还在流血——把钱递过去的时候，她的手在抖。然后她哭了。不是嚎啕大哭，是那种压着声音的、无声的流泪。你活了二十一年，第一次觉得心碎。</p>',
      choices: [
        { text: '默默收完剩下的活，干完走人', hint: '信任值-10', meterChange: { trust: -10 }, nextScene: 'c6', bridge: '<strong>你什么都没说。</strong>你把阿迪扶上车，继续去下一家。你的手在方向盘上发抖。你告诉自己：算了，算了。但你知道，有些东西，算了不了。' },
        { text: '直接离开，不干了', hint: '信任值-20', meterChange: { trust: -20 }, nextScene: 'c6', bridge: '<strong>你发动了收割机，想直接走。</strong>但村支书拦住了你——他说："小伙子，还有好几家等着收呢。别因为一个人，就否定所有人。"你犹豫了。' }
      ] },
    // ── Chapter 6 ──
    'c6': { sceneNum: '第六幕', title: '第二单',
      text: '<p>你接了第二单。十八亩——你心想，这单干完，至少能把第一单的亏空补上。</p><p>你们又干了三个小时。收割完毕，你去找农户结账。农户从屋里拿出一张泛黄的地契，说："你看，我家的地只有十三亩，不是十八亩。"</p><p>你看着那张地契，又看了看眼前这片田——你干了一辈子收割机，你目测不出来十八亩还是十三亩？你心里清楚，你又被坑了。又是一个五百块。</p><p>阿迪坐在收割机里，不哭了。她只是看着窗外，一句话也不说。</p>',
      choices: [
        { text: '认栽，拿了钱走人', hint: '信任值-15', meterChange: { trust: -15 }, nextScene: 'c7', bridge: '<strong>你拿了十三亩的钱。</strong>你算了一下——两单活，你们不仅没挣到钱，还倒贴了将近一千块。你发动了收割机，准备离开襄阳。但在离开之前，你打开了手机上的农机手群。' },
        { text: '再次找人调解', hint: '信任值-5', meterChange: { trust: -5 }, nextScene: 'c7', bridge: '<strong>你又找了村支书。</strong>村支书摇摇头——他也没办法。地契摆在那里，白纸黑字。你看着村支书头上的白发，心里说不清是同情还是愤怒。' }
      ] },
    // ── Chapter 7 (Decision) ──
    'c7': { sceneNum: '第七幕', title: '抉择时刻',
      text: '<p>你坐在收割机里，阿迪靠在你肩上睡着了。你打开了手机上的农机手群。</p><p>群里正在讨论各地的小麦行情。有人在问襄阳还有没有麦子要收，有人已经在来的路上了。你的手指悬在屏幕上。</p><p>你可以把你今天经历的事发出去，让全国农机手都知道——古驿镇，不，整个襄阳，有人坑农机手。你也可以选择沉默，毕竟"多一事不如少一事"。你还可以选择接受这个事实，毕竟人生在世，谁还没吃过亏？</p><p>但你想起了阿迪的眼泪，想起大妈那张脸，想起村支书掏出的两百块，想起那张泛黄的地契。</p><p>你该怎么做？</p>',
      choices: [
        { text: '在群里发出警告', hint: '信任值-20', meterChange: { trust: -20 }, nextScene: 'end2', bridge: '<strong>你打了一段话，又删了。又打了一段，又删了。</strong>最后，你发了一句话："兄弟们，来襄阳古驿镇收麦的，一定要先签合同，先丈量。别问为什么，照做就行。"你不知道这句话会改变什么。但你知道，你必须说。' },
        { text: '保持沉默', hint: '信任值+5', meterChange: { trust: 5 }, nextScene: 'end1', bridge: '<strong>你把手机收起来了。</strong>你什么都没说。但你不知道的是——你的沉默，被其他农机手感知到了。他们看到你发的朋友圈——只有一张图：阿迪的手，缠着创可贴，上面有泥。' },
        { text: '接受事实，继续干活', hint: '信任值+10', meterChange: { trust: 10 }, nextScene: 'end4', bridge: '<strong>你发动了收割机，继续下一家。</strong>你告诉自己：不是所有人都像大妈那样。你还要挣钱，还要养家，还要给闺女买玩具。你不能因为一个坏人，就放弃所有好人。' },
        { text: '心寒，离开这个行业', hint: '信任值-30', meterChange: { trust: -30 }, nextScene: 'end5', bridge: '<strong>你看着三十万的收割机，做了一个决定。</strong>你卖掉了它。你带着阿迪和闺女，去了深圳。你进了一家电子厂，每天十二个小时，流水线。你不再看麦田，不再闻麦香，不再想襄阳。' },
        { text: '推动制度，让改变发生', hint: '信任值+15', meterChange: { trust: 15 }, nextScene: 'end6', bridge: '<strong>你不仅发了警告，你还联系了记者。</strong>你把你经历的事，原原本本地讲了一遍。你没想到的是，这条视频，会改变一座城。' }
      ] },
    // ── Endings ──
    'end1': { isEnding: true, endingIcon: '🌾', title: '沉默的离开',
      endingText: '<p>你没在群里说话。但你的沉默，被其他农机手感知到了。</p><p>后来有记者找到你，你只说了一句："算了。"然后你转过头，看着窗外——窗外是麦田，金黄的，一望无际的。</p><p>但你不知道的是，你的朋友圈被截图传了出去。阿迪的手，缠着创可贴，上面有泥——那张照片，比任何文字都更有力量。</p><p>后来，襄阳的农机手越来越少了。不是因为你的警告——是因为你的沉默。沉默，有时候，是最响亮的控诉。</p>',
      philosophy: '<strong>哲学反思：</strong>沉默有时是最响亮的控诉。不是所有的真相都需要大声说出来——有些真相，沉默本身就足够了。' },
    'end2': { isEnding: true, endingIcon: '⚡', title: '一声警告',
      endingText: '<p>你在群里发的那段话，被截图传遍了全网。</p><p>你成了"割四赔五"的命名者。记者联系你，你说了你的经历。你说的时候很平静——但听的人，眼泪都下来了。</p><p>全国农机手开始声援你。襄阳出现了"机荒"——没人愿意来收麦了。一座城的信用，因为一个人，垮了。</p><p>你看着手机里不断刷新的消息，心里五味杂陈。你不想成为英雄，你只是想讨个公道。但你做到了——你的一句话，改变了襄阳。</p>',
      philosophy: '<strong>哲学反思：</strong>一句话可以改变一座城的命运。不要低估你的声音——在这个时代，每个人都可以是历史的书写者。' },
    'end3': { isEnding: true, endingIcon: '🔥', title: '全网为你发声',
      endingText: '<p>视频上传后，阅读量破百亿。</p><p>全国农机手声援襄阳——不，是"拉黑"襄阳。襄阳出现了严重的"机荒"，麦子收不完了，有的农户急得哭了。</p><p>你被邀请去参加各种座谈会。你坐在台上，台下是各路记者和官员。你说了很多话——但有一句话，你重复了最多遍："我们不是要赔偿，我们只是想要一个公平。"</p><p>正义也许会迟到，但在这个网络时代，它不会缺席。</p>',
      philosophy: '<strong>哲学反思：</strong>正义也许会迟到，但网络时代，它不会缺席。当千万人发出同一个声音，再顽固的墙也会被推倒。' },
    'end4': { isEnding: true, endingIcon: '🤝', title: '格局与和解',
      endingText: '<p>镇书记驱车五百公里，到了商丘，找到了你。</p><p>他当着你的面，道歉。他说："是我们\'襄阳\'对不起你。"他补上了四百块钱——不多，但那是四个小时的工钱。</p><p>你父亲在旁边说了一句话："不能因为一个人，就否定一座城。"</p><p>你看着镇书记——他头发白了，眼睛红了。你突然觉得，他不是坏人。他只是替别人来道歉的人。你收下了钱，也收下了道歉。</p>',
      philosophy: '<strong>哲学反思：</strong>真正的格局，是受了委屈之后还能看见更大的世界。原谅不是软弱——是选择不让仇恨占据你的心。' },
    'end5': { isEnding: true, endingIcon: '💔', title: '心寒的麦客',
      endingText: '<p>你卖掉了那台三十万的收割机。卖的时候，你摸了摸它的方向盘——它跟了你三年，跑遍了河南、湖北、安徽。你从来没想过，有一天，你会卖掉它。</p><p>你带着阿迪和闺女，去了深圳。你进了一家电子厂，每天十二小时，流水线。你的手，从摸方向盘变成了摸电路板。你的眼睛，从看麦田变成了看示波器。</p><p>有时候，你会做梦。梦到你开着收割机，在金黄的麦田里跑。风吹过来，麦香扑鼻。然后你醒了，发现自己躺在深圳的出租屋里。</p>',
      philosophy: '<strong>哲学反思：</strong>信任一旦碎了，比麦子还难收。一个人的恶，可以毁掉一个行业——但更多人的善，可以重建它。' },
    'end6': { isEnding: true, endingIcon: '🏗️', title: '制度推动者',
      endingText: '<p>你推动了襄阳出台《跨区机收服务保障十条》。</p><p>二十三个派出所启动了"麦客护航"行动。所有农机手到达襄阳后，先签合同，再下田。所有亩数，由第三方丈量。所有纠纷，24小时内处理完毕。</p><p>你看着那些新出台的规定，突然觉得——你受的委屈，没有白受。你一个人的经历，变成了所有人的保障。</p><p>后来，每到麦收季，你都会接到襄阳的电话。他们邀请你回去看看——看看新的麦田，新的制度，新的人。</p>',
      philosophy: '<strong>哲学反思：</strong>一个人受的委屈，可以变成所有人的保护。制度的进步，往往始于一次不公——但前提是，有人愿意站出来，把不公变成改变。' },
    'end7': { isEnding: true, endingIcon: '🕊️', title: '以德报怨',
      endingText: '<p>大妈被约谈后，退了款，道了歉。</p><p>她站在你面前，低着头，像个做错事的孩子。她说："对不起。我活了六十年，第一次跟人说对不起。"</p><p>你看着她的白发，看着她的皱纹，看着她粗糙的手。你突然觉得，她不是坏人。她只是太穷了，穷怕了。你收下了道歉，但婉拒了多余的钱。你说："够了。四百块就够了。"</p><p>你转身离开的时候，大妈在后面喊你——"小伙子，有空来吃面！"你没有回头。但你笑了。</p>',
