<body>
<div id="app"></div>
<div class="transition-overlay" id="transitionOverlay"></div>
<button class="audio-ctrl" id="audioBtn" title="音乐开关">♪</button>

<script>
// ═══════════════════════════════════════════════
// AUDIO SYSTEM — Atmospheric ambient soundtrack
// Layered: warm bass drone + chord pad + gentle melody fragments + texture
// ═══════════════════════════════════════════════
let audioCtx = null;
let audioPlaying = false;
let audioNodes = [];
let audioGains = {}; // named gain nodes for scene-specific dynamics

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function startMusic() {
  if (!audioCtx) initAudio();
  if (audioPlaying) return;
  audioPlaying = true;
  const now = audioCtx.currentTime;

  // Master chain: compressor → master gain → destination
  const compressor = audioCtx.createDynamicsCompressor();
  compressor.threshold.value = -24;
  compressor.knee.value = 30;
  compressor.ratio.value = 12;
  compressor.attack.value = 0.003;
  compressor.release.value = 0.25;

  const masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.gain.linearRampToValueAtTime(0.07, now + 2.5);
  compressor.connect(masterGain);
  masterGain.connect(audioCtx.destination);
  audioNodes.push(compressor, masterGain);
  audioGains.master = masterGain;

  // ── Layer 1: Deep bass drone (D minor feel) ──
  const bassFreq = 73.42; // D2
  const bassOsc = audioCtx.createOscillator();
  bassOsc.type = 'sine';
  bassOsc.frequency.value = bassFreq;
  const bassGain = audioCtx.createGain();
  bassGain.gain.value = 0;
  bassGain.gain.linearRampToValueAtTime(0.35, now + 2);
  bassOsc.connect(bassGain).connect(compressor);
  bassOsc.start(now);
  audioNodes.push(bassOsc, bassGain);
  audioGains.bass = bassGain;

  // ── Layer 2: Fifth harmonic (A2) ──
  const fifthOsc = audioCtx.createOscillator();
  fifthOsc.type = 'sine';
  fifthOsc.frequency.value = 110.00; // A2
  const fifthGain = audioCtx.createGain();
  fifthGain.gain.value = 0;
  fifthGain.gain.linearRampToValueAtTime(0.12, now + 2.5);
  fifthOsc.connect(fifthGain).connect(compressor);
  fifthOsc.start(now);
  audioNodes.push(fifthOsc, fifthGain);
  audioGains.fifth = fifthGain;

  // ── Layer 3: Octave pad (D3, triangle wave, softer) ──
  const padOsc = audioCtx.createOscillator();
  padOsc.type = 'triangle';
  padOsc.frequency.value = 146.83; // D3
  const padGain = audioCtx.createGain();
  padGain.gain.value = 0;
  padGain.gain.linearRampToValueAtTime(0.06, now + 3);
  padOsc.connect(padGain).connect(compressor);
  padOsc.start(now);
  audioNodes.push(padOsc, padGain);
  audioGains.pad = padGain;

  // ── Layer 4: Gentle high shimmer (F4, very quiet) ──
  const shimmerOsc = audioCtx.createOscillator();
  shimmerOsc.type = 'sine';
  shimmerOsc.frequency.value = 349.23; // F4
  const shimmerGain = audioCtx.createGain();
  shimmerGain.gain.value = 0;
  shimmerGain.gain.linearRampToValueAtTime(0.025, now + 4);
  shimmerOsc.connect(shimmerGain).connect(compressor);
  shimmerOsc.start(now);
  audioNodes.push(shimmerOsc, shimmerGain);
  audioGains.shimmer = shimmerGain;

  // ── Layer 5: Slow evolving LFO on bass ──
  const lfo1 = audioCtx.createOscillator();
  lfo1.type = 'sine';
  lfo1.frequency.value = 0.08;
  const lfo1Gain = audioCtx.createGain();
  lfo1Gain.gain.value = 0.15;
  lfo1.connect(lfo1Gain).connect(bassGain.gain);
  lfo1.start(now);
  audioNodes.push(lfo1, lfo1Gain);

  // ── Layer 6: Second LFO on pad for subtle movement ──
  const lfo2 = audioCtx.createOscillator();
  lfo2.type = 'triangle';
  lfo2.frequency.value = 0.06;
  const lfo2Gain = audioCtx.createGain();
  lfo2Gain.gain.value = 0.03;
  lfo2.connect(lfo2Gain).connect(padGain.gain);
  lfo2.start(now);
  audioNodes.push(lfo2, lfo2Gain);

  // ── Layer 7: Brown noise texture (very subtle) ──
  const noiseBuffer = createNoiseBuffer(2);
  const noiseSrc = audioCtx.createBufferSource();
  noiseSrc.buffer = noiseBuffer;
  noiseSrc.loop = true;
  const noiseFilter = audioCtx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 200;
  noiseFilter.Q.value = 0.5;
  const noiseGain = audioCtx.createGain();
  noiseGain.gain.value = 0;
  noiseGain.gain.linearRampToValueAtTime(0.015, now + 5);
  noiseSrc.connect(noiseFilter).connect(noiseGain).connect(compressor);
  noiseSrc.start(now);
  audioNodes.push(noiseSrc, noiseFilter, noiseGain);
  audioGains.noise = noiseGain;

  document.getElementById('audioBtn').classList.remove('muted');
}

function createNoiseBuffer(duration) {
  const sampleRate = audioCtx.sampleRate;
  const length = sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, length, sampleRate);
  const data = buffer.getChannelData(0);
  let lastOut = 0;
  for (let i = 0; i < length; i++) {
    const white = Math.random() * 2 - 1;
    // Brown noise: integrate white noise
    lastOut = (lastOut + (0.02 * white)) / 1.02;
    data[i] = lastOut * 3.5;
  }
  return buffer;
}

function stopMusic() {
  audioPlaying = false;
  audioNodes.forEach(n => { try { n.stop?.(); n.disconnect?.(); } catch(e){} });
  audioNodes = [];
  audioGains = {};
  document.getElementById('audioBtn').classList.add('muted');
}

function toggleMusic() {
  if (audioPlaying) stopMusic();
  else startMusic();
}

document.getElementById('audioBtn').addEventListener('click', toggleMusic);

// Start music on first user interaction
document.addEventListener('click', function startOnce() {
  if (!audioPlaying) startMusic();
}, { once: true });

// ═══════════════════════════════════════════════
// GAME ENGINE
// ═══════════════════════════════════════════════
const app = document.getElementById('app');
let currentPerspective = null;
let currentScene = null;
let meters = {};

function setMeter(name, val) {
  meters[name] = Math.max(0, Math.min(100, val));
  // Pulse animation on meter value change
  setTimeout(() => {
    const meterItems = document.querySelectorAll('.meter-item');
    meterItems.forEach(item => {
      const valEl = item.querySelector('.meter-val');
      if (valEl && valEl.textContent === String(val)) {
        valEl.classList.add('meter-pulse');
        setTimeout(() => valEl.classList.remove('meter-pulse'), 400);
      }
    });
  }, 50);
}

function renderMeters() {
  if (!currentPerspective || !currentPerspective.meters) return '';
  const names = { suspicion: '怀疑值', reputation: '声誉值', emotion: '情绪值', profit: '利益值', trust: '信任值', evidence: '证据值' };
  const fills = { suspicion: 'suspicion', reputation: 'reputation', emotion: 'emotion', profit: 'profit', trust: 'suspicion', evidence: 'suspicion' };
  return '<div class="meters">' + Object.entries(currentPerspective.meters).map(([k, v]) => {
    const pct = ((meters[k] || v) / 100 * 100);
    return `<div class="meter-item"><span class="meter-name">${names[k]||k}</span><span class="meter-val">${meters[k]||v}</span><div class="meter-bar"><div class="meter-fill ${fills[k]||''}" style="width:${pct}%"></div></div></div>`;
  }).join('') + '</div>';
}

function renderMenu() {
  currentPerspective = null;
  currentScene = null;
  meters = {};
  app.innerHTML = `
    <div class="menu-container fade-in">
      <div class="menu-title">指鸭为鹅</div>
      <div class="menu-subtitle">一只鸭腿，八年的谎言，四个视角的命运交错。<br>选择你的身份，走进这场关于谎言、信任与救赎的故事。</div>
      <div class="persp-grid">
        <button class="persp-btn" onclick="startGame('student')">
          <span class="icon">🎓</span><span class="name">清北学生</span>
          <span class="desc">从第一次排队到真相大白，信任与质疑的拉锯战。</span>
          <span class="tag">怀疑值系统 · 12种结局</span>
        </button>
        <button class="persp-btn" onclick="startGame('auntie')">
          <span class="icon">👩‍🍳</span><span class="name">鹅腿阿姨 · 陈秀凤</span>
          <span class="desc">凌晨四点的北京，八年谎言的开端。你用什么守护秘密？</span>
          <span class="tag">声誉值系统 · 10种结局</span>
        </button>
        <button class="persp-btn" onclick="startGame('son')">
          <span class="icon">👦</span><span class="name">阿姨的儿子 · 小梁</span>
          <span class="desc">"不吃滚出去"——群聊里的名场面，你是守护者还是纵火者？</span>
          <span class="tag">情绪值系统 · 8种结局</span>
        </button>
        <button class="persp-btn" onclick="startGame('vendor')">
          <span class="icon">🛒</span><span class="name">同行摊贩 · 老周</span>
          <span class="desc">同一条街八年的邻居，竞争、合作、还是落井下石？</span>
          <span class="tag">利益值系统 · 7种结局</span>
        </button>
      </div>
    </div>`;
}

function renderGame(scene) {
  currentScene = scene;
  const isEnding = scene.isEnding;
  let html = `
    <div class="game-header">
      <span class="persp-label">${currentPerspective.icon} ${currentPerspective.name}</span>
      <button class="back-btn" onclick="renderMenu()">← 返回主菜单</button>
    </div>
    ${renderMeters()}
    ${renderSaveBar()}
    ${renderProgress()}
    <div class="scene-box fade-in">`;

  if (isEnding) {
    html += `
      <div class="ending-box">
        <div class="ending-label">✦ 结局 ✦</div>
        <div class="ending-icon">${scene.endingIcon || '📖'}</div>
        <div class="ending-title">${scene.title}</div>
        <div class="ending-text">${scene.endingText || scene.text}</div>
        ${scene.philosophy ? `<div class="ending-philosophy">${scene.philosophy}</div>` : ''}
      </div>
      <button class="restart-btn" onclick="startGame('${currentPerspective.id}')">🔄 重新开始</button>
      <button class="restart-btn" style="background:var(--card);color:var(--ink);border:1px solid var(--rule);margin-left:0.5rem;" onclick="renderMenu()">🏠 返回主菜单</button>`;
  } else {
    html += `
      <div class="scene-header">
        <div class="scene-title">${scene.sceneNum || ''}</div>
        <div class="scene-name">${scene.title}</div>
      </div>
      <div class="scene-text">${scene.text}</div>
      ${scene.image ? `<div class="scene-image"><img src="${scene.image}" alt="${scene.imageCaption || ''}">${scene.imageCaption ? `<div class="img-caption">${scene.imageCaption}</div>` : ''}</div>` : ''}`;

    if (scene.bridge) {
      html += `<div class="narr-bridge">${scene.bridge}</div>`;
    }

    if (scene.choices && scene.choices.length > 0) {
      html += '<div class="choices-box">';
      scene.choices.forEach((c, i) => {
        const letter = String.fromCharCode(65 + i);
        const isBad = c.meterChange && Object.values(c.meterChange).some(v => v < 0);
        html += `<button class="choice-btn" onclick="makeChoice(${i})">
          <span class="letter${isBad ? ' bad' : ''}">${letter}</span>
          <span class="choice-body">${c.text}
            ${c.hint ? `<span class="choice-val">${c.hint}</span>` : ''}
          </span>
        </button>`;
      });
      html += '</div>';
    } else if (scene.bridge && scene._nextScene) {
      // Bridge mode: render empty choices-box for continue button
      html += '<div class="choices-box"></div>';
    }
  }

  html += '</div>';
  app.innerHTML = html;
  setTimeout(() => {
    app.scrollTop = 0;
    window.scrollTo(0, 0);
  }, 50);
}

function makeChoice(idx) {
  if (!currentScene || !currentScene.choices) return;
  const choice = currentScene.choices[idx];
  if (!choice) return;

  // Apply meter changes
  if (choice.meterChange) {
    Object.entries(choice.meterChange).forEach(([k, v]) => {
      setMeter(k, (meters[k] || 0) + v);
    });
  }

  // Show bridge if exists
  if (choice.bridge) {
    currentScene.bridge = choice.bridge;
    currentScene.choices = [];
    currentScene._nextScene = choice.nextScene;
    renderGame(currentScene);
    // Add continue button
    setTimeout(() => {
      const box = document.querySelector('.choices-box');
      if (box) {
        box.innerHTML = '<button class="choice-btn" onclick="continueFromBridge()"><span class="letter">▶</span><span class="choice-body">继续</span></button>';
      }
    }, 100);
    return;
  }

  goToScene(choice.nextScene);
}

function continueFromBridge() {
  if (currentScene && currentScene._nextScene) {
    goToScene(currentScene._nextScene);
  }
}

function goToScene(sceneId) {
  if (!currentPerspective) return;
  const scene = currentPerspective.scenes[sceneId];
  if (!scene) { console.error('Scene not found:', sceneId); return; }

  // Check meter-gated scenes
  if (scene.requireMeter) {
    const [key, min] = scene.requireMeter;
    if ((meters[key] || 0) < min) {
      // Try fallback
      if (scene.fallback) {
        return goToScene(scene.fallback);
      }
    }
  }

  // Scene transition
  const overlay = document.getElementById('transitionOverlay');
  if (overlay) {
    overlay.classList.add('active');
    setTimeout(() => {
      renderGame(scene);
      overlay.classList.remove('active');
    }, 150);
  } else {
    renderGame(scene);
  }
}

function startGame(perspId) {
  const perspectives = {
    student: {
      id: 'student', name: '清北学生', icon: '🎓',
      meters: { suspicion: 0, trust: 70, evidence: 0 },
      scenes: buildStudentScenes()
    },
    auntie: {
      id: 'auntie', name: '鹅腿阿姨 · 陈秀凤', icon: '👩‍🍳',
      meters: { reputation: 70 },
      scenes: buildAuntieScenes()
    },
    son: {
      id: 'son', name: '阿姨的儿子 · 小梁', icon: '👦',
      meters: { emotion: 30 },
      scenes: buildSonScenes()
    },
    vendor: {
      id: 'vendor', name: '同行摊贩 · 老周', icon: '🛒',
      meters: { profit: 40 },
      scenes: buildVendorScenes()
    }
  };

  currentPerspective = perspectives[perspId];
  if (!currentPerspective) return;
  meters = {};
  Object.entries(currentPerspective.meters).forEach(([k, v]) => setMeter(k, v));
  // Auto-load if save exists
  if (localStorage.getItem('goose_leg_save')) {
    const saved = JSON.parse(localStorage.getItem('goose_leg_save'));
    if (saved.perspId === perspId) {
      meters = saved.meters || meters;
      return goToScene(saved.sceneId);
    }
  }
  goToScene('s0');
}

// ═══════════════════════════════════════════════
// SAVE / LOAD SYSTEM
// ═══════════════════════════════════════════════
function saveGame() {
  if (!currentPerspective || !currentScene) return;
  const saveData = {
    perspId: currentPerspective.id,
    sceneId: Object.keys(currentPerspective.scenes).find(k => currentPerspective.scenes[k] === currentScene),
    meters: { ...meters },
    timestamp: Date.now()
  };
  localStorage.setItem('goose_leg_save', JSON.stringify(saveData));
  const status = document.getElementById('saveStatus');
  if (status) { status.textContent = '✓ 已保存'; status.classList.add('show');
    setTimeout(() => status.classList.remove('show'), 2000); }
}

function loadGame() {
  const saved = localStorage.getItem('goose_leg_save');
  if (!saved) { alert('没有找到存档'); return; }
  const data = JSON.parse(saved);
  const perspectives = {
    student: { id:'student',name:'清北学生',icon:'🎓',meters:{suspicion:0,trust:70,evidence:0},scenes:buildStudentScenes()},
    auntie: { id:'auntie',name:'鹅腿阿姨·陈秀凤',icon:'👩‍🍳',meters:{reputation:70},scenes:buildAuntieScenes()},
    son: { id:'son',name:'阿姨的儿子·小梁',icon:'👦',meters:{emotion:30},scenes:buildSonScenes()},
    vendor: { id:'vendor',name:'同行摊贩·老周',icon:'🛒',meters:{profit:40},scenes:buildVendorScenes()}
  };
  currentPerspective = perspectives[data.perspId];
  if (!currentPerspective) return;
  meters = data.meters;
  goToScene(data.sceneId);
}

function deleteSave() {
  localStorage.removeItem('goose_leg_save');
  const status = document.getElementById('saveStatus');
  if (status) { status.textContent = '✗ 存档已删除'; status.classList.add('show');
    setTimeout(() => status.classList.remove('show'), 2000); }
}

function renderSaveBar() {
  if (!currentPerspective) return '';
  return `<div class="save-bar">
    <button class="save-btn" onclick="saveGame()">💾 保存进度</button>
    <button class="save-btn" onclick="loadGame()">📂 读取存档</button>
    <button class="save-btn" onclick="deleteSave()">🗑 删除存档</button>
    <span class="save-status" id="saveStatus"></span>
  </div>`;
}

function renderProgress() {
  if (!currentPerspective) return '';
  const sceneCounts = { student: 12, auntie: 10, son: 8, vendor: 7 };
  const total = sceneCounts[currentPerspective.id] || 10;
  const currentKey = Object.keys(currentPerspective.scenes).find(k => currentPerspective.scenes[k] === currentScene);
  const sceneNum = parseInt((currentKey || '').replace(/[^0-9]/g, '')) || 0;
  const isEnding = currentScene && currentScene.isEnding;
  const pct = isEnding ? 100 : Math.min(95, Math.max(5, (sceneNum / total) * 100));
  return `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
}

    's_ferment2': { sceneNum: '网络发酵', title: '真相与流量的拉锯战', text: '<p>你的调查还在进行中，但网络上的发酵速度远超你的想象。微博话题#鹅腿阿姨#已经连续三天霸占热搜榜第一名。抖音上关于鹅腿阿姨的视频播放量突破十亿——有人做了"鹅腿真假鉴定"的科普视频，有人做了"鹅腿阿姨八年编年史"，有人甚至做了AI换脸视频，把阿姨的脸P到了各种搞笑场景里。</p><p>你看到最离谱的谣言是——有人说阿姨的腿是"用福尔马林泡过的"，有人说"吃了鹅腿阿姨的腿会得癌症"。这些谣言没有任何证据，但转发量比你认真写的调查报告还高十倍。</p><p>更让你困惑的是，你发现同一条街的摊贩老周——那个你之前怀疑在背后推动舆论的人——正在利用这场风波炒作自己的生意。他在自己的摊位上挂了一条横幅："本店承诺：真鹅腿，假一赔十"。</p><p><strong>你突然意识到，在这场网络风暴中，真相可能不是最重要的——流量才是。而流量，从来不关心真相。</strong></p>',
    choices: [
      { text: '无论网络怎么发酵，坚持调查真相', hint: '证据值+10', meterChange: { evidence: 10 }, nextScene: 's5_skeptic' },
      { text: '先静观其变，看看舆论走向', hint: '怀疑值+5', meterChange: { suspicion: 5 }, nextScene: 's5_skeptic' }

    's5_skeptic': { sceneNum: '第六幕·疑', title: '证据浮现', text: '<p>深入调查中，你发现了一个意想不到的事实：最初在国贸群里引爆质疑的那个"顾客"，IP地址和同一条街的摊贩老周使用的是同一个网络。原来这不是一场纯粹的消费者维权——背后有同行竞争。</p><p>这个消息让你陷入两难：如果你曝光这个事实，可能会削弱公众对"质疑"本身的信任；如果你隐瞒，你就是在选择性报道真相。你站在真相的十字路口，发现真相本身也有真假之分。</p>',
      choices: [
        { text: '同时曝光爆料人的动机，追求完整真相', hint: '→ 结局7', meterChange: {}, nextScene: 'end7' },
        { text: '只聚焦阿姨的问题，忽略爆料人身份', hint: '→ 可能需要更多证据', meterChange: {}, nextScene: 's6_skeptic' },
        { text: '如果你有DNA检测报告，现在公开发布', hint: '→ 结局9', meterChange: {}, nextScene: 'end9' }
      ] },
    's6_skeptic': { sceneNum: '第七幕·疑', title: '最终选择', text: '<p>你掌握了足够的证据。现在面临的问题不是"是不是鸭肉"，而是"你要成为什么样的人"。你看着手机里那些照片、截图、检测报告——它们每一张都指向同一个事实。但事实被说出来之后，会发生什么？你会成为英雄，还是成为罪人？还是两者都是？</p>',
      choices: [
        { text: '把完整调查报告发给权威媒体', hint: '→ 结局7', meterChange: {}, nextScene: 'end7' },
        { text: '推动市场监管部门出台新规', hint: '→ 结局8', meterChange: {}, nextScene: 'end8' },
        { text: '私下找阿姨，帮她转型诚信经营', hint: '→ 结局10', meterChange: {}, nextScene: 'end10' },

    // STUDENT ENDINGS
    'end1': { isEnding: true, endingIcon: '🦆', title: '结局 1：永远的鹅腿信徒', endingText: '<p>你举办了一场"盲品测试"活动，证明了即使知道是鸭腿，大部分人也觉得好吃。阿姨的摊位重新开张，这次招牌上写的是"鸭腿阿姨"。你是第一个顾客。阿姨看到你，笑了。你知道有人说你傻，但你不在乎。</p><p><em>有些东西比"真假"更复杂，比如感情。这世上最贵的不是鹅腿，是有人在寒风中为你排队的心意。人这一生，能让你心甘情愿被"骗"的东西不多——也许那不是被骗，是你选择了相信。相信不是愚蠢，是一种胆量。</em></p>', philosophy: '<strong>核心哲理：</strong>信任不是交易——你给了，不一定能收回。但如果你从来不给，你就永远不知道被信任是什么感觉。鹅腿是假的，但排队时那种期待是真的；阿姨的招牌是假的，但她凌晨四点起来的手艺是真的。这世上很多事，真真假假掺在一起，你分不清，也不需要分清。你只需要知道，你愿意为什么排队。' },
    'end2': { isEnding: true, endingIcon: '✍️', title: '结局 2：一篇爆款反思文', endingText: '<p>你的文章被多家媒体转载，甚至有出版社联系你出书。你成了"情怀消费"话题的代表声音。但你每次路过小西门，看到那个空荡荡的摊位，心里都会一紧。阿姨的摊位再也没开过。</p><p><em>你写的最后一句话是："我们怀念的不是鹅腿，是那个在寒风中排队时还相信世界美好的自己。"人总要学会把记忆和真相分开——记忆归记忆，真相归真相。你不能因为真相丑，就否定记忆美；也不能因为记忆美，就假装真相不存在。</em></p>', philosophy: '<strong>核心哲理：</strong>情怀是这世上最贵的调味料——它能让鸭腿变成鹅腿，能让路边摊变成青春记忆。但情怀也是最危险的幻觉——它让你看不清真相。聪明的人学会分辨，智慧的人学会接受。接受"我曾经被骗了"，接受"那个在寒风中相信世界美好的自己，已经长大了"。' },
    'end3': { isEnding: true, endingIcon: '🌙', title: '结局 3：安静的告别', endingText: '<p>你默默退出所有群聊，删掉了相关的照片和聊天记录。生活继续，毕业、工作、搬家。多年后，有人在饭局上提起"鹅腿阿姨"，你夹了一筷子菜，笑了笑，什么都没说。只有你知道，那天晚上你回去后，翻出了三年前那只鹅腿的照片，看了很久。</p><p><em>有些告别不需要说出口，有些答案不需要知道。人生就是这样——你带着悬而未决的问题，继续往前走。</em></p>', philosophy: '<strong>核心哲理：</strong>沉默不是逃避，是选择。你选择不说，不是因为你没有话要说，是因为你明白有些话说了也没用。真正的成长，不是学会发声，而是学会在合适的时候沉默。风起时，树在摇；风停时，树还在。你经历了这场风波，你没有被打倒，你只是安静地走开了。' },
    'end4': { isEnding: true, endingIcon: '😔', title: '结局 4：共犯', endingText: '<p>你帮阿姨写了新的"声明"，把鸭腿说成"特殊品种的鹅腿"。谎言越滚越大。当真相最终被揭穿时，你的名字也出现在了热搜上——"那个帮鹅腿阿姨洗白的学生"。你的导师找你谈话，你的同学在背后议论你。你保住了阿姨，但失去了自己。</p><p><em>帮别人圆谎的人，最后往往也圆不了自己的谎。你保护的不是阿姨，是你自己对"善良"的幻觉。你害怕的不是阿姨的谎言被揭穿，是你心中的美好被打破。</em></p>', philosophy: '<strong>核心哲理：</strong>善良和包庇之间，隔着一层薄薄的纸。捅破了，你就知道——善良是帮人改错，包庇是帮人瞒错。你选择了后者，你就要承担后者的代价。这世上没有免费的善意——你的每一个"帮"，都标着价码。诚实不是对别人负责，是对自己负责。' },
    'end5': { isEnding: true, endingIcon: '💔', title: '结局 5：从信徒到举报者', endingText: '<p>阿姨的回避让你愤怒。你把自己三年来所有的购买记录、聊天截图和对比照片整理成一份报告，发给了媒体。报道出来后，你收到了两种截然不同的评价——有人说你是"吹哨人"，有人说你是"叛徒"。信仰崩塌的感觉，比被骗更痛。</p><p><em>但痛过之后，你会长出新的骨头。你不是叛徒——你只是不再信了。而"不再信"本身，就是一种信仰。你信仰的是真相，是证据，是不能再被糊弄的自己。</em></p>', philosophy: '<strong>核心哲理：</strong>从信徒到举报者，不是背叛，是成长。你发现你曾经信仰的东西是假的，这不悲哀——悲哀的是你发现之后，还假装不知道。你选择了不假装，这需要勇气。但勇气之后，还需要慈悲——对自己的慈悲。质疑让你看清了世界，但不要让质疑让你看不清自己。看清世界的能力叫聪明，看清自己的能力叫智慧。' },
    'end6': { isEnding: true, endingIcon: '⏳', title: '结局 6：无条件的等待', endingText: '<p>你一直等阿姨的回应。等了很久。群里安静了，热搜被新的热点覆盖了，摊位再也没有出现。你偶尔会翻出那个群聊，看看阿姨的头像。某天你发现群被解散了。你学会了"不期待"——但这也许不是一件坏事。</p><p><em>不期待不是放弃，是把力气留给值得的事。你等了那么久，不是为了等一个答案——你是为了等自己甘心。现在你甘心了。甘心不是认输，是放下。你发现，你等的不是阿姨的回应，你等的是自己不再需要回应的那一天。</em></p>', philosophy: '<strong>核心哲理：</strong>等待是最被低估的修行。你在等待中学会了耐心，学会了放下，学会了"不期待"。不期待不是冷漠，是把期待放回自己身上。你不再期待别人给你答案，你开始自己给自己答案。人生中很多问题，不需要被回答，只需要被放下。困扰你的，从来不是鸭腿，是你放不下的自己。' },
    'end7': { isEnding: true, endingIcon: '🔍', title: '结局 7：真相猎人', endingText: '<p>你的调查报告被《南方周末》全文刊发，完整呈现了事件的全貌——鸭腿事实、爆料人动机、行业生态、消费者心理。你毕业后成为了一名调查记者。多年后有人问你为什么选择这个职业，你说："因为有一只鹅腿，让我学会了质疑。"</p><p><em>质疑不是目的，是通往真相的桥。你从一只鸭腿开始，学会了如何提问、如何验证、如何不被情绪裹挟。真相往往不是非黑即白——它是一张复杂的光谱，上面有灰色、有阴影、有你看不清的角落。</em></p>', philosophy: '<strong>核心哲理：</strong>真相不是目的，是过程。你永远不可能知道全部的真相，但你可以一直走在接近真相的路上。质疑让你保持清醒，但也容易让你变得冷漠。最好的状态是：质疑世界，但不质疑自己的初心。从一只鹅腿到一个记者，你走了很远，但方向一直是对的。' },
    'end8': { isEnding: true, endingIcon: '⚖️', title: '结局 8：监管推动者', endingText: '<p>你联合法学院的同学，起草了一份关于校园周边流动摊贩食品标签规范的建议书，提交给了市场监管部门。三个月后，新规出台——所有流动摊贩必须在显著位置标注食品真实名称。你从一只鸭腿出发，推动了一项制度变革。</p><p><em>有时候，改变世界不需要改变一切——只需要改变一个标签。真正的力量不是揭发一个人，而是改变一个系统。揭发一个人，只能保护一些人；改变一个系统，可以保护所有人。</em></p>', philosophy: '<strong>核心哲理：</strong>制度比道德更可靠。你不能指望每个人都是好人，但你可以让每个人都不敢做坏人。一个好的规则，比一千次说教更有力量。与其指责一个人撒谎，不如让所有人都没法撒谎。你推动的不是一条规则，你推动的是让诚实变得更容易、让撒谎变得更困难。' },
    'end9': { isEnding: true, endingIcon: '🧬', title: '结局 9：铁证如山', endingText: '<p>DNA报告公开后，舆论彻底定论。阿姨被罚款，摊位被取缔。你赢了——从证据的角度。但那天晚上，你路过小西门，看到那个空荡荡的角落，想起三年前第一次排队时咬下第一口的温度，你发现自己并不开心。</p><p><em>正确和快乐，有时候是两回事。你选择了正确，但你没有选择快乐。你做了你认为对的事——在这世上，能选择正确的人已经不多了。</em></p>', philosophy: '<strong>核心哲理：</strong>正确是一件孤独的事。你站在正确的一边，但正确的一边有时候人很少。正确不保证快乐，但正确保证一件事——你晚上照镜子的时候，不用躲开自己的眼睛。你可以说：我做了该做的事。这就够了。人这一生，能说"我做了该做的事"的次数，屈指可数。' },
    'end10': { isEnding: true, endingIcon: '🤝', title: '结局 10：从举报者到合伙人', endingText: '<p>你私下找到阿姨，说："阿姨，我帮你重新开始。这次我们叫鸭腿阿姨，我帮你做品牌。"阿姨愣了很久，然后哭了。你们在学校旁边租了一个小门面，招牌上写着"鸭腿阿姨（原名鹅腿阿姨）"，生意比以前还好。</p><p><em>阿姨说你是她的贵人，你说她教会了你——有时候，真相和善意可以同时存在。你不需要在诚实和善良之间二选一——你可以两个都选。</em></p>', philosophy: '<strong>核心哲理：</strong>真相和善意，从来不是对立的。对立的是你的狭隘想象——你以为真相就是冷酷，善意就是软弱。但真相可以是温暖的，善意可以是坚定的。你需要同时拥有刺和手——刺，刺破谎言；手，扶起倒下的人。你做到了。你证明了，聪明可以善良，善良可以聪明。' },
    'end11': { isEnding: true, endingIcon: '🎙️', title: '结局 11：录音曝光', endingText: '<p>你偷偷录下了和阿姨的对话并公开。舆论炸了——阿姨彻底社死。但你也被很多人质疑"不道德取证"，有人说你"为了流量不择手段"。你拿到了真相，但失去了道义的制高点。</p><p><em>用错误的方式追求正确，最后得到的，往往也是错误。你拿到的"真相"是脏的——它沾着你的不诚实，你的偷偷摸摸，你的算计。你骗了阿姨，就像阿姨骗了顾客。</em></p>', philosophy: '<strong>核心哲理：</strong>正义不能以不正义的方式实现。你偷来的真相，不会让你变得正义——只会让你变成一个为了目的不择手段的人。真正的正义，不是赢了就行——是赢的方式也要经得起检验。干净的胜利，才是真正的胜利；脏的胜利，只是另一种失败。' },
    'end12': { isEnding: true, endingIcon: '🤫', title: '结局 12：沉默的知情者', endingText: '<p>你知道了真相，但选择了沉默。你没有发布任何东西，也没有再买过鹅腿。这件事成了你心里的一个结——你知道真相，但你没有说。有时候你会想，如果当时你说了，事情会不会不同？但你没有答案。</p><p><em>人生最大的遗憾，往往不是做错了什么，而是什么都没做。你选择了沉默，你就有资格在日后说"我早就知道"。但"早就知道"有什么意义呢？你知道了，但你什么都没做。</em></p>', philosophy: '<strong>核心哲理：</strong>沉默是一种选择，而每一个选择都有代价。你选择了沉默，你就选择了永远不知道"如果我说了会怎样"。这种"不知道"会跟着你一辈子——不是作为遗憾，而是作为一个未完成的句子。关于"鹅腿阿姨"的句子，你永远写不到结尾。因为你没有动笔。你只是看着那张空白的纸，看了很久。空白，但很重。' }
  };
}

function buildAuntieScenes() {
  return {
    's0': { sceneNum: '第零幕', title: '八年谎言的开端', text: '<p><strong>2000年，江苏连云港赣榆区城头镇。</strong>你叫陈秀凤，三十出头，和丈夫梁德才一起决定"北漂"。你抱着三岁的儿子小梁，在火车站犹豫了三天。最后你们买了去北京的火车票，硬座，三十六个小时。</p><p>到了北京，你们租了一间地下室，月租两百。你在工地附近做过饭，后来经老乡介绍在北大校园租了个水果摊，一卖就是将近十年。学生都叫你"水果阿姨"。后来你发现——卖小吃比卖水果利润高。你想起老家过年时做的腊鹅腿，那味道，吃过的人都忘不了。你咬咬牙，从二手市场淘了一辆三轮车，花了两百块。</p><p><strong>2018年，你开始卖真鹅腿。</strong>从河北白洋淀进的货，一只鹅两条腿，进货价八块，你卖十二。你凌晨四点起来腌制，用花椒、八角、桂皮，还有你从老家带来的秘方。你在北大西门外的巷子里支起摊子，第一个月，每天只卖出十几个。你站在寒风中，看着来来往往的学生，心里想：<em>他们会来的。只要我做的够好吃，他们会来的。</em></p><p>但鹅腿越来越贵了。第三年，进货价涨到了十五块，利润薄得像纸。你第一次买了一只鸭腿，回家腌了，烤了，尝了。你闭上眼睛，努力说服自己——<em>差不多。腌制之后，差不多。</em>但你知道，差很多。</p><p>那天晚上，你看着熟睡的小梁，翻来覆去睡不着。你跟自己说：<em>我只是想让他上好学。我只是想让他有饭吃。我不是在骗人——我只是在想办法活下去。</em></p><p>第二天，你去了批发市场，买了两箱鸭腿。你把招牌擦干净，但上面的"鹅腿"两个字，你没有改。你告诉自己：<em>改了还怎么卖？大家认的是"鹅腿阿姨"这个牌子。改了，就什么都没了。</em></p><p>第八年，你已经很少想起"这是鸭腿"这件事了。你甚至在自己的脑子里，也把它叫成了"鹅腿"。你不再是一个在撒谎的人——你变成了一个<strong>相信自己谎言的人</strong>。你开始涨价，开始觉得那些排队的学生是理所当然的。你开始飘飘然了。直到那天，儿子帮你建了微信群。一切开始改变。</p>',
      choices: [
        { text: '继续往下走，走进那场风暴', hint: '声誉值 70', meterChange: {}, nextScene: 'a1', bridge: '<strong>八年，足够一个谎言长成一棵大树。</strong>你站在树下，看着满树的果子，忘了树根是腐烂的。你忘了，树越高，倒下来的时候砸得越重。现在，你即将走进那场风暴——而你的儿子，会成为那个推倒第一块多米诺骨牌的人。' }
      ] },
    'a1': { sceneNum: '第一幕', title: '凌晨四点的北京', text: '<p>闹钟响了。你摸黑起床，窗外还是黑的。进货、腌制、穿串——八年了，你每天都在重复。你心里清楚这不是鹅腿。但你也清楚，如果八年前你就叫"鸭腿阿姨"，谁会来排队？你看着熟睡的儿子，想起他小时候问"妈妈我们为什么叫鹅腿阿姨"，你没有回答。你告诉自己：<em>我只是想让他上好学。</em></p>',
      choices: [
        { text: '默默继续，和往常一样', hint: '声誉值不变', meterChange: {}, nextScene: 'a2', bridge: '<strong>你推着三轮车出门，北京的冬天冷得刺骨。</strong>你告诉自己：这就是命。八年了你没想过改名字——改了还怎么卖？你熟练地生火、架锅、摆好调料。凌晨五点的北京，路灯还亮着，你看着自己呼出的白气，想起八年前第一次出摊的那天——也是这么冷，但那时候你心里踏实。现在你心里像压着一块石头，但你已经习惯了这块石头的重量。' },
        { text: '心里闪过一丝不安，但摇摇头算了', hint: '声誉值 +3', meterChange: { reputation: 3 }, nextScene: 'a2', bridge: '<strong>你在腌制的时候停了一下手。</strong>你想起刚来北京那年，你卖的是真鹅腿。后来鹅腿太贵了，你换成了鸭腿，但招牌没改。你告诉自己——"反正都是腿，味道差不多"。这个念头让你心安理得了八年，但今天，它突然不好用了。你想起儿子昨天在饭桌上说"妈，我们学校有人写了篇文章分析你的腿"。你摇摇头，把这个问题压了回去。' }
      ] },
    'a2': { sceneNum: '第二幕', title: '从清北到国贸', text: '<p>儿子小梁说："妈，建个微信群吧，让学生接龙下单，方便。"你觉得有道理，但你不怎么会用手机。儿子帮你建了群，把群昵称改成"鹅腿阿姨儿子兼助手"。生意越来越好，清北学生把你捧成了网红。有人建议你扩展到国贸CBD——"那边上班族消费力强"。你犹豫了。学生好说话，但上班族呢？你心里清楚——学生吃的是情怀，上班族吃的是性价比。情怀可以掩盖很多事，但性价比不行。</p>',
      choices: [
        { text: '接受建议，扩展国贸', hint: '声誉值 +5，风险增加', meterChange: { reputation: 5 }, nextScene: 'a3', bridge: '<strong>国贸群建起来了，第一周就爆满。</strong>儿子兴奋地跟你说"妈，一个人16块，一天500个，一个月能赚五万！"你看着他兴奋的样子，心里既高兴又不安。高兴的是生意好，不安的是——你知道国贸的上班族不是学生，他们不会因为"情怀"就原谅任何事。果然，第三周就有人开始质疑了。你晚上躺在床上，听着隔壁儿子敲键盘的声音，心里像是有一只小鼓在敲——<em>快了，快了，快要瞒不住了。</em>' },
        { text: '拒绝扩展，只做学生生意', hint: '声誉值 +3，更安全', meterChange: { reputation: 3 }, nextScene: 'a3', bridge: '<strong>你拒绝了国贸的邀请。</strong>你心里清楚，学生好说话，他们吃的不是鹅腿是情怀。你不想冒险。儿子有些失望，但你没解释——有些事，你没法跟儿子说。你继续在清北两个群之间奔忙，生意稳定，但你心里知道，你只是把问题推迟了。每天晚上收摊回来，你看着手机上群里的消息，看到有人发"阿姨今天辛苦了"，你心里会暖一下——然后暖意会迅速冷却，因为你知道，这些赞美是建立在谎言上的。' }
      ] },
    'a3': { sceneNum: '第三幕', title: '裂痕初现', text: '<p>国贸群建起来没几天，就有人质疑了。你不在群里——都是儿子在管。你只知道儿子说"没事，他们就是事多"。但你隐约感到不安。这天晚上，儿子兴奋地告诉你群里吵架了，他怼了顾客。你心里一沉。你让他把手机给你看，你看到那些聊天记录，手开始发抖。那些字一个个跳进你的眼睛里——"不吃滚出去""你上班上迷糊了""配料保密"。你看着这些字，仿佛看到了自己八年前在招牌上写下"鹅腿"两个字的那一刻。你突然意识到，你做的事，正在通过你儿子的手，以另一种方式重演。</p>',
      choices: [
        { text: '让儿子把群管理权交给你', hint: '声誉值 +10', meterChange: { reputation: 10 }, nextScene: 'a4', bridge: '<strong>你跟儿子说："群给我。你不懂，你这样会害了我们。"</strong>儿子不情愿地把管理员权限转给了你。你看着他的眼睛，里面有委屈，有愤怒，有不甘。你突然意识到——这个孩子是在保护你。他用他自己的方式保护你。但这种方式，正是你教给他的。你教会了他沉默，于是他学会了愤怒；你教会了他隐瞒，于是他学会了攻击。你接过手机，开始亲自回复顾客的消息，一个字一个字地打，态度温和。群里有人说"阿姨终于自己来了"，气氛缓和了一些。但你知道，这只是暂时的。' },
        { text: '相信儿子，让他继续管', hint: '声誉值 -5', meterChange: { reputation: -5 }, nextScene: 'a4', bridge: '<strong>你看着儿子愤怒的脸，心软了。</strong>他是在保护你，你知道。你说："行，你管吧，但别太冲。"儿子点点头，但你心里清楚——他控制不住。因为你自己也控制不住。你控制不住自己不去撒谎，凭什么要求他控制住自己不去愤怒？几天后，你看到群里又吵起来了，这次比上次更严重。你叹了口气，但什么都没说。你选择沉默，就像你选择了这个谎言——因为开口的代价，你承受不起。' },
        { text: '亲自在群里发一条温和的说明', hint: '声誉值 +8', meterChange: { reputation: 8 }, nextScene: 'a4', bridge: '<strong>你花了半个小时，在群里发了一段话：</strong>"各位顾客朋友，我是阿姨。我儿子年纪小，说话不懂事，大家别跟他计较。有什么问题可以直接跟我说，我尽量给大家一个交代。"这段话发出去后，群里安静了很多。有人回复"阿姨辛苦了"，有人说"理解"。你松了一口气——但随即，一种更深的恐惧涌上心头。你说"尽量给大家一个交代"——但你能给什么交代？你发现，你用一个温和的谎言，暂时掩盖了另一个更大的谎言。' }
      ] },
    'a4': { sceneNum: '第四幕', title: '儿子的回怼', text: '<p>你看到了完整的聊天记录——儿子在群里说的每一句话。你坐在出租屋的床上，手机屏幕的光映着你的脸。你想起儿子小时候，你推着三轮车带他去摆摊，他在车斗里睡着了。你想起他上小学第一天，你给他穿上最好的衣服，跟他说"好好学习，别像妈妈一样"。你想起他问你"妈妈我们为什么叫鹅腿阿姨"的时候，你转过头去假装没听见。现在他长大了，在用他自己的方式保护你——但这种方式，正在把你推向深渊。<strong>你突然意识到，你儿子变成今天这样，是因为你。你教会了他用谎言保护自己，他学会了。</strong></p>',
      choices: [
        { text: '严厉批评儿子，让他公开道歉', hint: '声誉值 +15', meterChange: { reputation: 15 }, nextScene: 'a5', bridge: '<strong>你第一次对儿子发了大火。</strong>"你知不知道你说的那些话，人家都截图了！网上几百万人看到了！"儿子愣住了，然后哭了。你看着儿子哭，自己也哭了。最后你说："发个道歉，在群里，就说你年纪小不懂事。"儿子照做了。群里有人接受，有人不接受，但至少，你们做了该做的事。那天晚上，你坐在儿子床边，看着他睡着的样子，想起了他小时候。你轻轻说了一声"对不起"，但你不确定——这声对不起，是给儿子的，还是给那些被你骗了八年的人的。' },
        { text: '理解儿子的出发点，但让他以后别管群了', hint: '声誉值 +5', meterChange: { reputation: 5 }, nextScene: 'a5', bridge: '<strong>你抱着儿子，说："妈知道你心疼我。但是以后群我来管，你好好读书。"</strong>儿子点点头，没说话。你把管理员权限收回来，在群里简单说了一句"以后我来管理"。没有道歉，但至少态度变了。有些顾客觉得不够，但大部分人选择了沉默。你看着儿子回房间的背影，心里想：<em>我是不是也在逃避？我是不是也在用"保护儿子"当借口，来逃避我该面对的事？</em>' },
        { text: '沉默，当作什么都没发生', hint: '声誉值 -10', meterChange: { reputation: -10 }, nextScene: 'a5', bridge: '<strong>你什么都没说。</strong>你告诉自己：儿子没错，他是在保护我。但那天晚上，你失眠了。你翻来覆去地想着群里那些话——"不吃滚出去"。你第一次觉得，也许不是顾客的问题。也许从一开始，就是你的问题。但你不敢往下想。因为一旦你承认问题在你，你就必须承认——<strong>你是一个骗子。你骗了八年。你骗了成千上万的人。你骗了你的儿子。你甚至骗了你自己。</strong>' }
      ] },
    'a5': { sceneNum: '第五幕', title: '群公告之夜', text: '<p>6月9日晚，你坐在出租屋里，手机屏幕的光映着你疲惫的脸。儿子在隔壁房间，门关着。你打了一行字，删掉，又打，又删。最后你发了群公告——承认原材料是鸭腿，鹅腿已断货八年有余。发完，你关掉了手机。但你知道，一切才刚开始。你坐在黑暗里，听着自己的心跳。八年了，你终于说了实话。你说实话不是因为勇敢，是因为你再也瞒不住了。你发现自己没有感到解脱——你感到的是恐惧。恐惧明天会怎样，恐惧儿子会怎样，恐惧那些曾经叫你"阿姨"的学生会怎样看你。</p>',
      choices: [
        { text: '第二天就出摊，当面跟大家解释', hint: '声誉值 +8', meterChange: { reputation: 8 }, nextScene: 'a_ferment', bridge: '<strong>第二天晚上，你照常推着三轮车来到小西门。</strong>排队的人少了一半，但还有人在。你看到人群中有人举着手机在拍你，有人在窃窃私语。你把招牌上的"鹅腿"改成了"烤腿"。有人问你"阿姨，这是鸭腿吧？"你点点头，说："是。以后都写清楚。"那个学生愣了一下，然后买了一份。你说"谢谢"，声音有点哽咽。那天晚上收摊的时候，你数了数——只卖了平时的一半。但你心里有一种奇怪的感觉——那不是失落，而是一种很久没有过的踏实。你终于不用再担心"被人发现"了。因为已经发现了。最坏的事情已经发生了，而你还在站着。' },
        { text: '暂停出摊，等风头过去', hint: '声誉值 -5', meterChange: { reputation: -5 }, nextScene: 'a_ferment', bridge: '<strong>你关了摊，把自己关在出租屋里。</strong>第一天，你睡了一整天。第二天，你开始收拾屋子——八年没好好收拾过，每个角落都堆满了东西。你翻出了儿子小时候的作业本，翻出了第一次摆摊时用的那块招牌，上面写着"鹅腿15元"。你看着那个"鹅"字，发了好一会儿呆。手机不停地震，但你不敢看。你把它翻过来扣在桌上，但屏幕的光还是透过缝隙漏出来，像一只不停眨的眼睛。你蜷缩在沙发上，想起八年前第一次出摊的那天——那时候你卖的是真鹅腿，那时候你心里踏实。那时候你告诉自己：我只是想活下去。但什么时候，"活下去"变成了"骗下去"？' }
      ] },
    'a_ferment': { sceneNum: '网络发酵', title: '全网的审判', text: '<p>你发完群公告的第二天，手机彻底炸了。你不敢打开手机，但你又忍不住去看。</p><p>微博热搜——#鹅腿阿姨承认鸭腿# #鹅腿阿姨八年骗局# #鹅腿阿姨儿子怼顾客#。三个话题同时在热搜前十。</p><p>抖音上，有人专门做了一期视频，标题是"鹅腿阿姨：一个底层妇女的八年骗局"。视频里放了你的照片、你的摊位照片、你儿子在群里骂人的截图。评论区三十万条，你不敢看。</p><p>最让你心疼的是，有人开始扒你儿子的信息——他的学校、他的班级、他的照片。你看到儿子同学的家长在群里说"凉与的妈妈就是那个骗子"。你儿子回家后一句话没说，把门关上，你听到他在里面哭。</p><p>你坐在出租屋里，看着墙上儿子小时候画的画——上面画着你和三轮车，旁边歪歪扭扭地写着"妈妈辛苦了"。你突然想：<strong>如果八年前我没有把鸭腿叫成鹅腿，这一切都不会发生。我的儿子不会被同学嘲笑，我的摊位不会被砸，我的生活不会被几百万人围观。但如果八年前我就叫"鸭腿阿姨"，我供得起儿子读书吗？</strong></p>',
    choices: [
      { text: '鼓起勇气面对，无论结果如何', hint: '声誉值+5', meterChange: { reputation: 5 }, nextScene: 'a6' },
      { text: '感到绝望，但为了儿子必须撑住', hint: '声誉值-3', meterChange: { reputation: -3 }, nextScene: 'a6' }
    ] },
    'a6': { sceneNum: '第六幕', title: '危机处理', text: '<p>记者来了，市监局来了，北大删除了关于你的推文。儿子在接受采访时说"一个鸭腿利润5元，每天500个，月入5万，不可能年入百万"。网络上有人骂你骗子，有人写长文为你辩护。你坐在家里，看着这些，心里五味杂陈。你打开手机，一条一条地看评论。有人骂你"骗子去死"，有人说"八年的信任就这么没了"，有人说"我也是底层人，但我不骗人"。你看着这些评论，手指在屏幕上滑来滑去，不知道该停在哪里。你突然想起你第一次来北京的时候——那个站在火车站门口、抱着三岁儿子、不知道往哪走的女人。那时候你什么都没有，但你至少没骗过人。现在你有了一个摊位，有了顾客，有了名声——但你骗了人。你用自己的双手建起了一座城堡，但城堡的地基是沙子。</p>',
      choices: [
        { text: '接受一位信任的记者做独家专访，讲出完整故事', hint: '→ 结局13/14', meterChange: { reputation: 15 }, nextScene: 'end13', bridge: '<strong>你选了一位态度温和的记者，在她的镜头前，你讲出了八年的全部——</strong>从农村来北京，从卖真鹅腿到换鸭腿，从一个人摆摊到儿子帮你建群。你讲到你第一次看到儿子在群里骂顾客时的心情，讲到你每天晚上睡不着，讲到你觉得对不起那些信任你的学生。讲到一半你哭了，记者也红了眼眶。采访发出去后，舆论出现了微妙的变化——有人开始说"她也是一个被生活逼到角落的人"。你收到了一条私信，是一个学生发的："阿姨，我吃了你五年的腿。说实话，我吃出来不是鹅肉了，但我没问。因为我觉得你做的真的很好吃。我希望你以后还能做。"你看着这条消息，哭了很久。' },
        { text: '录制道歉视频公开发布', hint: '→ 结局15', meterChange: { reputation: 10 }, nextScene: 'end15', bridge: '<strong>你用儿子的手机录了一段视频。</strong>你坐在出租屋里，对着镜头说："各位同学，各位顾客，我是鹅腿阿姨。我错了。八年来，我一直用鸭腿，但我叫它鹅腿。我骗了你们。我不敢说对不起，因为对不起不值钱。但我还是想说，对不起。"视频发出去后，评论区有人说"原谅你了"，有人说"太晚了"，有人说"八年的道歉，我要不要接受"。你不知道答案。你只知道，你说了你该说的话。你放下手机，走到厨房，看着那些腌制中的鸭腿，看了很久。你突然想：<em>也许我该换个名字了。也许我该叫"鸭腿阿姨"。也许，做一个诚实的鸭腿阿姨，比做一个说谎的鹅腿阿姨，要轻松得多。</em>' },
        { text: '继续保持沉默，什么都不做', hint: '→ 结局16', meterChange: { reputation: -10 }, nextScene: 'end16', bridge: '<strong>你什么都没做。</strong>你看着手机，看着热搜，看着记者在你家门口蹲守。你拉上了窗帘，关掉了灯，把自己缩在沙发角落里。你听到门口有人在敲门——不是记者，是隔壁卖煎饼的老李，他在门外喊："陈姐，你没事吧？"你没有回答。你听到他的脚步声慢慢远去。你觉得自己像一只被按在砧板上的鸭子，等着被宰。你闭上眼睛，但你睡不着。你睁开眼睛，但你什么都看不见。' },
        { text: '甩锅给供应商', hint: '→ 结局18', meterChange: { reputation: -15 }, nextScene: 'end18', bridge: '<strong>你对记者说："我也是受害者。供应商给我什么我就卖什么，我就是一个摆摊的，我有什么能力去鉴别？"</strong>供应商反告你诽谤。两头不讨好，你彻底翻车了。你失去了最后一点同情，也失去了最后一点尊严。' },

    // AUNTIE ENDINGS
    'end13': { isEnding: true, endingIcon: '🕊️', title: '结局 13：迟到的真相', endingText: '<p>你第一时间完全坦白。很多学生被你的诚恳打动，愿意再给你一次机会。你的摊位重新开张，招牌换成了"鸭腿阿姨"。生意不如以前，但你心里踏实了。晚上睡觉的时候，你不再失眠。</p><p><em>你终于明白了一件事——人这一生，最重的不是犯过什么错，而是有没有勇气承认。你用了八年学会了一个最简单的道理：诚实，才是最好的招牌。你站在新摊位前，看着招牌上"鸭腿"两个字，心里很平静。你失去了"鹅腿阿姨"的名号，但你找回了自己。你终于可以坦然地看着每一个顾客的眼睛，说："这是鸭腿。好吃。你尝尝。"你发现，当你不再撒谎的时候，每一句话都变得很轻，每一口呼吸都变得很深。你用了八年走了一个大圈，最后回到了原点——但这一次，你是走回来的，不是逃回来的。</em></p>', philosophy: '<strong>人生哲理：</strong>真相也许会迟到，但不会缺席。而当你主动说出真相的时候，你不是在失去什么——你是在拿回你丢失的尊严。每一个谎言都需要更多的谎言去维护，每一个真相却只需要一个真相就够了。你用了八年，终于学会了这个道理。但至少，你学会了。' },
    'end14': { isEnding: true, endingIcon: '📖', title: '结局 14：一个普通人的八年', endingText: '<p>在专访中，你讲出了完整的故事——一个底层妇女怎么靠鸭腿冒充鹅腿，供儿子从小学读到大学。你说："我不是在为自己辩解。我只是想说，有些错，不是一个人犯的。"专访发出去后，舆论从愤怒变成了复杂的同情。你没有被原谅，但至少被理解了。</p><p><em>你坐在出租屋里，看着手机上那些评论——有人说"她不容易"，有人说"不容易不代表可以骗人"，有人说"这个社会欠底层人太多"。你看着这些争论，心里很平静。因为你不再需要争论了。你说出了你的故事，剩下的，交给别人去评判。你发现，当你说出真相的那一刻，你就不再是那个被秘密压得喘不过气的人了。秘密就像一个石头，你抱了它八年，终于放下了。</em></p>', philosophy: '<strong>人生哲理：</strong>没有人是一座孤岛。你的选择，你的错误，你的救赎——都是这个社会的一部分。我们评判一个人之前，也许应该先问问：如果换作是我，在凌晨四点的北京，在风雪中推着三轮车，带着一个三岁的孩子，我会怎么做？这不是在为错误开脱——这是在对人性保持敬畏。' },
    'end15': { isEnding: true, endingIcon: '🙏', title: '结局 15：一声道歉', endingText: '<p>你鼓起勇气录制了道歉视频。视频中你泣不成声，很多人被你打动，但也有人觉得"鳄鱼的眼泪"。不管怎样，你说了你该说的话。之后的日子，你不再是"鹅腿阿姨"，你只是一个普通的中年女人，重新开始。</p><p><em>你搬到了北京郊外的一个小镇，租了一个小门面，卖起了早点。豆浆、油条、包子——没有鹅腿，也没有鸭腿。你每天早上三点起来，和面、磨豆浆、蒸包子。有人问你以前是做什么的，你说"以前也是做小吃的"。你没有说更多。但你心里知道，你终于可以不用在"做小吃"前面加任何修饰词了。你只是一个做小吃的人。偶尔，你会在手机上刷到"鹅腿阿姨"的旧新闻，你会停下来看一会儿，然后划过去。你不再逃避那段记忆——你把它放在心里的一个角落，偶尔拿出来看看，提醒自己：诚实，是这世上最便宜也最贵的东西。便宜到不需要任何成本，贵到有人花了一辈子才学会。</em></p>', philosophy: '<strong>人生哲理：</strong>道歉不能改变过去，但能改变未来。不是为别人，是为自己。当你终于说出"对不起"的时候，你原谅的不是你伤害过的人——你原谅的是那个一直活在谎言中的自己。' },
    'end16': { isEnding: true, endingIcon: '🌫️', title: '结局 16：消失的鹅腿阿姨', endingText: '<p>你关了摊，搬了家，换了手机号。你从公众视野中消失了。有人说你回老家了，有人说你在别的城市重新开始。没有人知道真相。你偶尔刷到关于"鹅腿阿姨"的帖子，手指在屏幕上停一下，然后划过去。</p><p><em>你在一个没人认识你的城市里，租了一个小房子，找了一份超市理货员的工作。你不再做腿了。你甚至不再吃腿了。你路过烤鸭店的时候，会加快脚步走过去。你没有道歉，没有坦白，没有面对。你只是逃了。你告诉自己：<strong>"我没有错。我错在哪里？我辛辛苦苦做了八年，我和他爸辛辛苦苦把儿子供到大学，我凌晨四点起床，我在风雪里推着三轮车——我错在哪里？就因为我把鸭腿叫成鹅腿？"</strong>你越想越气，越气越觉得自己没错。你发现，你逃得再远，也逃不出自己。因为每天晚上，你都会梦到那个巷子，梦到那些排队的学生的脸，梦到他们在问你："阿姨，这是鹅腿吗？"你在梦里张开嘴，想说什么，但什么都说不出来。</em></p>', philosophy: '<strong>疯魔独白：</strong>"我没有错。我错在哪里？我比那些坐在办公室里吹空调的人辛苦一万倍！他们有什么资格评判我？他们知道凌晨四点的北京有多冷吗？他们知道一个人推着三轮车在风雪里走是什么感觉吗？他们不知道！他们只会坐在屏幕后面敲键盘！我骗了他们？他们骗了我！他们说我做的腿好吃，他们说阿姨辛苦了，他们说我是北大最温暖的记忆——现在翻脸了？"'},
    'end18': { isEnding: true, endingIcon: '💥', title: '结局 18：推卸责任', endingText: '<p>你甩锅给供应商，说他们给你鸭腿当鹅腿卖。供应商反告你诽谤。两头不讨好，你彻底翻车了。你失去了最后一点同情，也失去了最后一点尊严。</p><p><em>你站在法庭门口，记者围着你，话筒戳到你脸上。你低着头，不敢看任何人。你听到有人在喊"骗子"，有人在喊"活该"。你心里想：<strong>"我只是想活下去。我有什么错？"</strong>你开始相信自己的谎言了。你开始真的觉得自己是被骗的——你忘记了八年前，你是在批发市场亲自挑了鸭腿回来的。你忘记了自己说的"鸭腿便宜，但味道差不多"。你选择性地忘记了一切，只记得自己是受害者。你抬头看着法院的牌子，心里涌起一种奇怪的感觉——你觉得自己很委屈，但你已经分不清，这委屈是真的，还是你编出来骗自己的。</em></p>', philosophy: '<strong>疯魔独白：</strong>"是他们骗了我！是供应商！是这个世界！我陈秀凤这辈子没害过人，我做的腿谁吃了不说好？我凌晨四点起来，我风里来雨里去，我供儿子上大学，我做了什么伤天害理的事？就因为一个名字？就因为我把鸭腿叫成了鹅腿？那你们去查啊！查全北京的摊贩！查全中国的食品行业！我看有几个说的是真话！凭什么只查我？"'},
    'end22': { isEnding: true, endingIcon: '🤲', title: '结局 22：退款和解', endingText: '<p>你做了一个艰难的决定——向所有顾客退款。你算了一笔账，拿出来这些年攒的积蓄，一个一个退。有人说"不用退了"，你坚持退了。退完最后一笔钱，你坐在空荡荡的出租屋里，心里反而踏实了。风波逐渐平息，你重新开始。这次，你卖的是"鸭腿"——明码标价，货真价实。</p><p><em>你发现，诚实虽然来得晚，但总比不来好。你重新开张的那天，来了几个老顾客。他们站在你的新招牌下面，看着"鸭腿阿姨"四个字，笑了。有人说："阿姨，我们等了你三个月。"你说："对不起，让你们等了。"他们说："没关系，我们等的是一个诚实的阿姨，不是鹅腿。"你烤着鸭腿，炭火映着你的脸。你想起八年前第一次出摊的那个晚上——也是这样的炭火，也是这样的风。但那时候你心里揣着一个秘密，现在你心里什么都没有了。你终于明白，<strong>人生最重的负担不是贫穷，不是辛苦，而是秘密。放下秘密的那一瞬间，你才发现，原来你可以站得这么直。</strong></em></p>', philosophy: '<strong>人生哲理：</strong>金钱可以还清债务，但诚实才能还清灵魂的债。你退的不是钱，你退的是你欠这个世界的信任。而信任，一旦开始还，就永远不嫌晚。因为诚实不是一种选择——它是一种能力。而这种能力，你用了八年，终于找回来了。' }
  };
}

function buildSonScenes() {
  return {
    's0': { sceneNum: '第零幕', title: '我知道的秘密', text: '<p><strong>车斗里的童年。</strong>你最早的记忆，是三轮车的车斗。你三岁，妈妈把你放在车斗里，盖上一件旧棉袄，推着车去北大西门。车斗是铁皮做的，冬天冷得像冰窖，夏天烫得像铁板。但你从来不觉得苦——因为妈妈每隔一会儿就会回头看你一眼，那种眼神让你觉得，这个车斗是世界上最安全的地方。</p><p>你七岁那年，第一次在妈妈脸上看到了一种奇怪的表情。那天你在批发市场门口等她，你看到妈妈推着一箱鸭腿出来，箱子上的字是"冷冻鸭腿"。你指着那两个字说"妈妈，这个字念鸭子吗？"妈妈愣了一下，然后说"这是鹅腿，箱子用错了"。你信了。或者说，你选择了相信——因为一个七岁的孩子，最不想做的事就是怀疑自己的妈妈。</p><p><strong>你十二岁那年，彻底确认了真相。</strong>你在妈妈床底下找到了一个账本——上面清清楚楚地写着"鸭腿进货 5元/只"。你看着那两个字，手指在纸上停了很久。你想起妈妈每天早上四点起床，想起她手上的冻疮，想起她推着三轮车在风雪里走的样子。你坐在床边，手里攥着那个账本，哭了。不是因为你被欺骗了——是因为你突然明白，你妈妈这一辈子，到底有多难。她不是想骗人，她只是没有别的办法。你擦掉眼泪，把账本放回原处，走进厨房，帮妈妈洗菜。你心里想：<em>我不在乎。别人怎么想我不管。我只知道，她是我妈。她做的腿，全北京最好吃——不管它是什么腿。我永远不会戳穿她。我永远站在她这一边。</em></p><p>从那天起，你开始帮妈妈撒谎。你学会了用愤怒来保护秘密，学会了用攻击来掩盖心虚。你变成了妈妈的盾牌——但这是一面有裂缝的盾牌。裂缝里透出来的，不是光，是更深的恐惧。你十七岁那年，帮妈妈建了微信群。你把自己的群昵称改成了"鹅腿阿姨儿子兼助手"。你开始享受那种"守护者"的身份带来的快感。但你不知道的是，你每怼回去一次，你妈妈的名声就碎掉一块。你做的每一件"保护"她的事，都在把她推向更深的悬崖。你像一个盲人，以为自己举着火把在前方引路——但实际上，你举着的是一把火，正在烧掉你妈妈用八年搭起来的一切。</p>',
      choices: [
        { text: '走进风暴，面对一切', hint: '情绪值 30', meterChange: {}, nextScene: 'so1', bridge: '<strong>你从车斗里那个数着腿的孩子，变成了群聊里那个怼天怼地的"凉与"。</strong>你用了八年，从一个想保护妈妈的孩子，变成了一个正在伤害妈妈的人。你觉得自己是她的守护者，但你的守护方式，正在把她推向深渊。你站在二十岁的门槛上，回头看——你看到的是一个在车斗里睡着的孩子，一个在批发市场门口不敢问的孩子，一个在作文里哭着写"我妈妈是英雄"的孩子。现在，你即将走进那场风暴。而你，是那个推倒第一块多米诺骨牌的人。' }
      ] },
    'so1': { sceneNum: '第一幕', title: '妈妈的帮手', text: '<p>你跟妈妈说："建个微信群，让学生接龙下单，方便。"妈妈不太会用手机，你帮她建了群，把自己的群昵称改成"鹅腿阿姨儿子兼助手"。你觉得这没什么——你只是帮妈妈做生意。看着群里每天几百条接龙，你心里有点骄傲。你妈的腿，全北京最好吃。</p>',
      choices: [
        { text: '把群管理得井井有条，态度友善', hint: '情绪值 +0', meterChange: {}, nextScene: 'so2', bridge: '<strong>你把群管理得很好——准时发接龙，耐心回复每个问题，</strong>有人催单你会解释"阿姨在做了，稍等"。群里氛围很好，有人说"这个管理员不错"，你看到了心里有点得意。你觉得自己在帮妈妈做一件有意义的事。每天晚上收摊回来，你妈会问你群里怎么样，你说"挺好的，大家都很喜欢"。你妈笑的时候，你觉得一切都值得。但你从来没想过，这个群有一天会变成一场风暴的中心——而你会是那个站在风暴眼的人。' },
        { text: '偶尔不耐烦，但尽量控制', hint: '情绪值 +5', meterChange: { emotion: 5 }, nextScene: 'so2', bridge: '<strong>你有时候会不耐烦——每天几百条消息，很多人问同样的问题。</strong>你偶尔会回得比较冲，但大部分时候还是控制住了。你告诉自己：他们只是顾客，我不需要喜欢他们，我只需要帮妈妈把腿卖出去。但你没有意识到，这些"不耐烦"正在像水一样一滴一滴地积累——总有一天，水会溢出来，浇灭你所有的理智。你内心深处还有一个更隐秘的恐惧：你怕有人问出那个你不敢回答的问题。你怕有人看穿你和你妈精心维护了八年的秘密。' }
      ] },
    'so2': { sceneNum: '第二幕', title: '群里的"守护者"', text: '<p>有人抱怨等待时间太长，语气不太好。你心里不舒服——妈妈每天凌晨四点起来，你们凭什么抱怨？你想起妈妈手上的冻疮，想起她推着三轮车在风雪里的背影。你手指在键盘上悬停，心里有一团火在烧。</p>',
      choices: [
        { text: '耐心解释，让大家理解', hint: '情绪值 +0', meterChange: {}, nextScene: 'so3', bridge: '<strong>你打了一段话："不好意思，阿姨每天凌晨四点开始做，一个人做一百多份，确实需要时间。大家理解一下，谢谢！"</strong>发出去后，有人回复"理解"，有人没说话。你心里还是不舒服——你知道你妈有多辛苦，那些人凭什么抱怨？但你控制住了自己。你把手机放下，去厨房帮你妈洗菜。冷水冲着你的手，你想起小时候你妈也是这样洗菜，手上全是冻疮，裂开的口子里渗着血丝。你跟自己说：为了她，忍一忍。你做到了。但忍一次容易，忍一百次呢？' },
        { text: '冷冷回复"嫌慢就别买"', hint: '情绪值 +10', meterChange: { emotion: 10 }, nextScene: 'so3', bridge: '<strong>你打完"嫌慢就别买"就发了出去。</strong>群里安静了几秒。然后有人说"你什么态度？"你回："我什么态度？你知道我妈几点起来吗？"群里炸了。有人截图发到了微博，标题是"鹅腿阿姨儿子怼顾客"。你妈后来看到了，叹了口气，没说话。你看到她叹气，心里更难受了——但难受之后，你更生气了。你生气的是——为什么你妈辛苦了八年，还要被这些人说三道四？你生气的是——为什么你保护妈妈，反而成了错？你生气的是——你内心隐隐知道，你妈用的确实是鸭腿，但你不愿意承认，所以你用愤怒来掩盖心虚。' }
      ] },
    'so3': { sceneNum: '第三幕', title: '第一次被问"是不是鸭肉"', text: '<p>群里有人发了张照片，问"这个纹理怎么像鸭肉"。你心跳加速。你知道妈妈用的是鸭腿——你从小就知道。但你知道妈妈养你供你读书有多不容易。你告诉自己：他们懂什么？他们只看到一只腿，没看到我妈凌晨四点起来的手。</p>',
      choices: [
        { text: '沉默，不回应，让事情过去', hint: '情绪值 +5', meterChange: { emotion: 5 }, nextScene: 'so4', bridge: '<strong>你没回复那条消息。它被其他消息淹没了。</strong>但你知道，这只是时间问题——迟早会有人再问。你开始失眠，每次看到群里有新消息，你都会紧张地点开看是不是又在质疑。你觉得自己像在守着一个随时会炸的炸弹。你晚上躺在床上，盯着天花板，脑海里反复播放一个画面——一个人指着你妈的腿说"这不是鹅腿"。你终于明白了一件可怕的事：<strong>你保护的这个秘密，连你自己都不相信。</strong>' },
        { text: '强硬回应，转移话题', hint: '情绪值 +15', meterChange: { emotion: 15 }, nextScene: 'so4', bridge: '<strong>你回了一句："你懂什么？你知道鹅腿和鸭腿的区别吗？"</strong>对方说："我就是不知道才问。你到底能不能回答？"你没回答，而是把他踢出了群。群里安静了，但有人在别的群说了这件事。你妈后来知道了，问你怎么把人踢了。你说"他来找茬的"。你妈没再说话，但你看到她坐在沙发上，看着手机屏幕发呆。你突然意识到——你踢的那个人，也许只是一个普通的顾客。他问了一个合理的问题。而你，因为害怕那个问题的答案，选择把他踢出了群。你开始怀疑自己：<em>我到底是守护者，还是暴君？</em>' },
        { text: '私下跟妈妈说，劝她考虑坦诚', hint: '情绪值 +0，家庭关系 +10', meterChange: {}, nextScene: 'so4', bridge: '<strong>那天晚上，你坐在妈妈旁边，说："妈，要不我们改叫鸭腿阿姨吧？"</strong>妈妈没说话。你又说："迟早会被发现的。"妈妈放下手里的活，看着你，眼睛红了。她说："改名字，以前那些老顾客怎么想？"你没再说话。但你知道，你说的是对的。你看着妈妈红了的眼睛，心里像被刀割了一下。你伸出手，握住了妈妈的手——那只粗糙得像老树皮的手。你说："妈，不管怎样，我在。"你妈哭了。你也哭了。你们母子俩，在出租屋的厨房里，抱在一起哭了很久。' }
      ] },
    'so4': { sceneNum: '第四幕', title: '名场面 — 暴怒回怼', text: '<p><strong>国贸CBD群，6月5日。</strong>一个上班族在群里发了一张照片，配文："标的鹅腿，怎么卖的是鸭腿？这不是欺骗吗？"群里瞬间吵开了。你的手机疯狂震动，你看到那条消息，血一下子涌上了头顶。你想起妈妈每天凌晨四点起来，想起那些人每次排队几小时，想起他们一边吃一边说"鹅腿阿姨真好"——现在他们翻脸了。</p><div class="chat-bubble"><div class="chat-name son">顾客</div><div class="chat-msg">"标的鹅腿，怎么卖的是鸭腿？这不是欺骗吗？"</div></div>',
      choices: [
        { text: '"你上了两天班上迷糊了吗？话都说不清楚了？"', hint: '情绪值 +20 — 真实名场面', meterChange: { emotion: 20 }, nextScene: 'so4b', bridge: '<strong>你发出去的那一瞬间，群里安静了三秒。然后——炸了。</strong>有人截图发到了微博，标题是"鹅腿阿姨儿子辱骂顾客"。转发量在半小时内破万。你妈从隔壁房间走过来，问你"怎么了"。你没说话，把手机翻过来扣在桌子上。你妈看到你的表情，她什么都明白了。她什么都没说，只是在你旁边坐了下来，安静地坐了很久。你不敢看她。你盯着桌面上的木纹，假装在研究那些纹路。但你心里知道——你刚才说的那句话，是你这辈子说过的最蠢的话。' },
        { text: '耐心解释正在核实', hint: '情绪值 +0', meterChange: {}, nextScene: 'so5', bridge: '<strong>你打了一段话："感谢大家的反馈，我们正在核实情况，请稍等。"</strong>发出去后，群里暂时安静了。你深吸一口气，意识到如果你早一点用这种方式说话，也许一切都不会发生。你选择了理性沟通——后面的名场面不会触发，但故事仍在继续。' }
      ] },
    'so4b': { sceneNum: '第四幕·续', title: '名场面 — 第二回合', text: '<p>顾客继续追问："欺骗消费者还这么有理，事实就是卖的鸭腿。"群里几百双眼睛都在看着你。你的手指在键盘上发抖——不是害怕，是愤怒。你从小看着妈妈在风雪里推三轮车，现在这些人坐在办公室里吹着空调，敲着键盘，说她在骗人。你不能忍。</p>',
      choices: [
        { text: '"与人为善就是与己为善，没人教过你？"', hint: '情绪值 +20 — 真实名场面', meterChange: { emotion: 20 }, nextScene: 'so4c', bridge: '<strong>这句话被截图传播，有人评论"你一个卖假鹅腿的教别人与人为善？"</strong>讽刺感拉满。你的话被做成了表情包，在各大群聊里疯传。你妈看到了，什么都没说，但你看到她偷偷抹眼泪。你心里像被刀割，但你说不出"对不起"——因为你觉得你没说错。' },
        { text: '"不吃滚出去，给你惯的坏毛病"', hint: '情绪值 +30 — 真实名场面，冲上热搜', meterChange: { emotion: 30 }, nextScene: 'so4c', bridge: '<strong>"不吃滚出去，给你惯的坏毛病。"</strong>——这句话发出去后，你没有立刻意识到它意味着什么。但当你看到微博热搜第一的标题写着"鹅腿阿姨儿子：不吃滚出去"，当你看到全网阅读量突破5亿，当你看到你的名字"凉与"变成了一个网络热梗——你意识到，你再也收不回这句话了。你妈坐在沙发上，手里拿着手机，屏幕上是那条热搜。她没有看你。你突然觉得，你和你妈之间的一切都凝固了。你终于明白——<strong>你不是在保护妈妈。你是在用"保护妈妈"当借口，来满足你自己当一个英雄的幻想。</strong>' },
        { text: '开始冷静，不再回怼', hint: '情绪值 -5', meterChange: { emotion: -5 }, nextScene: 'so4c', bridge: '<strong>你深吸一口气，把手机放在一边。</strong>你意识到，再这样下去，事情只会更糟。你没再回复。群里慢慢安静了。但你不知道，那些已经发出去的话——那些截图——正在以你想象不到的速度传播。你只是暂时停止了，但伤害已经造成了。' }
      ] },
    'so4c': { sceneNum: '第四幕·续', title: '名场面 — 绿色物质追问', text: '<p>顾客又问了："腿肉上怎么有绿色？"群里又是一阵骚动。你看着这个问题，脑子里飞速运转——你知道那是腌制的颜色，但你怎么解释？你之前已经说了太多前后矛盾的话，现在每一个字都要小心。</p>',
      choices: [
        { text: '"绿色是葱叶榨汁腌泡所致，一丝添加剂都没有"', hint: '情绪值 +5 — 真实名场面', meterChange: { emotion: 5 }, nextScene: 'son_ferment', bridge: '<strong>你的三次回应前后矛盾——先说"葱叶榨汁"，又说"不清楚"，最后说"配料保密"。</strong>网友们把这三段对话拼在一起，做成了一张"三连改口"的对比图，在网上疯传。有人评论："这比电视剧还精彩。"你看着这张图，第一次意识到——你不仅没有保护妈妈，你还让事情变得更糟了。你妈在隔壁房间，电视开着，但她没在看。你走过去，想说什么，但张了张嘴，什么都说不出来。' },
        { text: '老实承认自己也不确定，建议等妈妈回复', hint: '情绪值 +0', meterChange: {}, nextScene: 'son_ferment', bridge: '<strong>你诚实地说："这个我不确定，等我妈回来我问问她再回复大家。"</strong>群里有人表示理解。你发现，当你不再试图当"守护者"，而只是一个"助手"的时候，事情反而简单了。' }
      ] },
    'son_ferment': { sceneNum: '网络发酵', title: '被全网围观的儿子', text: '<p>你的名字"凉与"已经变成了一个网络热梗。B站上有人把你的三连改口做成了鬼畜视频，播放量超过五百万。弹幕里全是"你上班上迷糊了""不吃滚出去"——你曾经说过的每一句话，都被放大、被嘲笑、被反复播放。</p><p>你的微信好友申请列表里多了几百条——有来骂你的，有来采访你的，有来看热闹的。你不敢通过任何一条。</p><p>最让你崩溃的是，你发现有人把你的学校、班级、甚至宿舍号都发到了网上。你的室友开始躲着你，你的同学在食堂看到你会把头转过去。你的辅导员找你谈话，说"学校不希望你个人行为影响学校声誉"。</p><p>你坐在宿舍的床上，刷着那些评论，手在发抖。你想起你妈凌晨四点起来腌腿的样子，想起她手上那些冻疮，想起她推着三轮车在风雪里走的样子。<strong>你觉得自己是在保护她——但你现在意识到，你做的每一件事，都在让她的处境变得更糟。你举起的不是盾牌，是火把。你烧掉的不是敌人，是你妈用八年建起来的一切。</strong></p>',
    choices: [
      { text: '删掉所有社交账号，暂时消失', hint: '情绪值-10', meterChange: { emotion: -10 }, nextScene: 'so5' },
      { text: '公开道歉，承认自己态度不好', hint: '情绪值+5', meterChange: { emotion: 5 }, nextScene: 'so5' }
    ] },
    'so5': { sceneNum: '第五幕', title: '事件爆发后的选择', text: '<p>妈妈发了群公告，承认了。记者找到你家门口，你的同学开始在朋友圈转发。你看到有人在学校的群里问"那个\'凉与\'是不是我们学校的？"你的手机屏幕亮了又暗，暗了又亮。你室友看你的眼神变了。你躲进了厕所，看着镜子里的自己——你看起来像一个陌生人。</p>',
      choices: [
        { text: '公开身份，为妈妈辩护', hint: '情绪值 +15', meterChange: { emotion: 15 }, nextScene: 'so6', bridge: '<strong>你在朋友圈发了一段长文，标题是"那是我妈"。</strong>你写了她凌晨四点起床，写了她在风雪里推三轮车，写了她的手因为常年洗菜全是冻疮，写了她在风雪里推着三轮车把你从小学供到大学。你说："你们骂我可以，别骂她。她是我妈。"发出去后，你收到了两种回复。有人说"你是个好儿子"，有人说"你是个帮凶"。你的室友拍了拍你的肩膀，什么都没说。你的手机又震了，是你妈发来的消息："儿子，别替妈说话，影响你。"你看着这条消息，眼泪掉下来了。你擦了擦眼睛，回了一条："妈，我不怕。"' },
        { text: '保持沉默，假装不认识', hint: '情绪值 +0', meterChange: {}, nextScene: 'so6', bridge: '<strong>你没说话。你假装这一切和你无关。</strong>你照常去上课，照常去食堂，照常和室友打游戏。但每次有人提到"鹅腿阿姨"，你都会不自觉地低下头，把手机屏幕翻过来扣在桌上，假装在看书。你的室友可能已经知道了——有一次你看到他们在刷"鹅腿阿姨儿子"的微博热搜，看到你进来，他们立刻把手机翻了过去。但他们没有问，你也没有说。你们之间多了一道透明的墙，谁都不想第一个打破它。你活在一个谎言里——而这个谎言，和妈妈的谎言一样，都是出于恐惧。' },
        { text: '发声明承认错误，替妈妈道歉', hint: '情绪值 -10，家庭关系 +10', meterChange: { emotion: -10 }, nextScene: 'so6', bridge: '<strong>你在朋友圈发了一段话："我是鹅腿阿姨的儿子。我为我之前在群里的言论道歉。我妈妈也很难过，她让我替她跟大家说声对不起。"</strong>发出去后，评论区有人说"至少你知道错"，也有人说"太晚了"。你妈看到你发的这段话，抱着你哭了。你发现，有时候承认错误不是软弱，而是一种勇气。一种你从来没有过的勇气。你以前以为，保护妈妈就是替她挡箭——但你现在知道了，真正的保护，是帮她做对的事。' }
      ] },
    'so6': { sceneNum: '第六幕', title: '接受采访', text: '<p>有记者采访你。网上有人算了一笔账——"鹅腿阿姨年入百万"。你被问到收入问题。你心里清楚，妈妈每天卖500个腿，一个利润5块，一个月五万，根本不可能年入百万。但你怎么说？</p>',
      choices: [
        { text: '"一个鸭腿利润5元，每天500个，月入5万，不可能年入百万"', hint: '真实事件还原', meterChange: { emotion: 5 }, nextScene: 'so7', bridge: '<strong>你的话被多家媒体报道，"月入5万"又成了一个新的热搜。</strong>有人算了一笔账说"月入5万，15年就是900万，你还哭穷？"也有人替你说话："在北京，一家三口月入5万确实不算多。"你发现，无论你说什么，都会被解读成你不想表达的意思。但至少，你说出了事实。你对着记者的镜头，说出了那些数字，那些数字是你妈用双手一个一个赚出来的——每一个数字背后，都是一天凌晨四点的起床，都是双手上的冻疮，都是三轮车在风雪中前行的千米数。你突然觉得，这些数字很重要——不是因为它们证明了你妈赚了多少钱，而是因为它们证明了你妈付出了多少。' },
        { text: '用这个机会向公众道歉', hint: '情绪值 -10', meterChange: { emotion: -10 }, nextScene: 'so7', bridge: '<strong>你对着镜头说："我知道很多人在骂我。我确实说了一些不该说的话。我在这里跟所有顾客道歉——对不起。我说的那些话，不是我妈教的，是我自己的问题。"</strong>这段话发出去后，有人在评论区说"至少他道歉了"。你妈在旁边看着，眼睛红了。你发现，当你不再把自己当成受害者，你反而能说出真心话。你妈在旁边看着你，她的眼睛红红的，但她在笑。你很久没有看到她笑了。你突然觉得，这才是你想要的——不是热搜，不是名场面，不是"凉与"这个网名——是你妈的笑。' }
      ] },
    'so7': { sceneNum: '第七幕', title: '最终结局', text: '<p>情绪值决定了你的结局走向。你站在学校的天台上，看着远处的北京城。你想起了很多事——妈妈第一次推着三轮车来接你放学，你在车斗里写作业；你帮妈妈建群的那天，她说"我儿子真能干"；你在群里骂顾客的时候，心里想的是"我在保护我妈"。现在你知道了——真正的保护，不是替她挡箭，而是帮她做对的事。</p>',
      choices: [
        { text: '说服妈妈公开道歉，陪她一起面对', hint: '→ 结局25', meterChange: {}, nextScene: 'end25' },

    'end25': { isEnding: true, endingIcon: '🤗', title: '结局 25：说服与和解', endingText: '<p>你成功说服妈妈公开道歉。你陪她坐在镜头前，握着她的手。视频发出去后，虽然有人不原谅，但更多的人被打动了——不是因为道歉本身，而是因为你们母子一起面对的姿态。之后的日子，你们的关系比以前更紧密了。</p><p><em>你终于明白了一件事——真正的保护，不是替她挡在全世界前面，而是站在她旁边，和她一起面对全世界。你以前以为，爱就是替她撒谎，替她打架，替她挡住一切。但现在你知道了——爱，是陪她一起承受。你陪她坐在镜头前，她的手在抖，你的手也在抖。但你们的手握在一起的时候，什么话都不用说。你看着她的侧脸，想起了车斗里的那个冬天——她也是这样，迎着风，弓着背，把你护在身后。现在，你终于可以和她并肩了。你终于可以告诉她：妈，不用再一个人扛了。</em></p>', philosophy: '<strong>人生哲理：</strong>世界上最难的事，不是替一个人挡下所有风险——而是陪她一起面对风险。你花了二十年，才学会从"挡在她前面"变成"站在她旁边"。但当你终于站在她旁边的时候，你会发现——你不需要当一个英雄。你只需要当一个儿子。而这，比任何英雄都伟大。' },
    'end26': { isEnding: true, endingIcon: '✍️', title: '结局 26：匿名的心声', endingText: '<p>你注册了一个匿名账号，写了一篇长帖，标题是"我妈妈就是你们骂的鹅腿阿姨"。你没有辩解，没有道歉，只是写了一个故事——一个女人凌晨四点起床，在风雪里推着三轮车，辛辛苦苦把儿子从小学供到大学，把一个谎言守了八年。帖子发出去后，一晚上有了十万阅读。评论区有人说"看哭了"，有人说"不代表她没错"，也有人在猜发帖人是谁。你没有回复任何人。你只是把那些话说了出来，然后关掉了账号。</p><p><em>后来你发现，那篇帖子被转到了你妈妈的手机上——她看了很久，然后把手机放在一边，擦了擦眼睛。你不知道她有没有猜到是你。但那天晚上，她给你盛饭的时候，多夹了一块肉。你看着碗里那块肉，眼泪掉下来了。你突然想起你十二岁那年，你第一次确认真相的那天，你也是坐在这个饭桌前，吃着妈妈做的饭，心里想着：我永远不会戳穿她。十年过去了，你做到了。你没有戳穿她——但你终于用自己的方式，把她的故事讲了出来。</em></p>', philosophy: '<strong>人生哲理：</strong>有些爱，不需要署名。有些话，不需要面对面说。你匿名写下的每一个字，都是你小时候不敢说出口的真心话。你终于学会了表达爱——不是用愤怒，不是用攻击，不是用谎言——是用文字，用故事，用一颗终于安静下来的心。' },
    'end27': { isEnding: true, endingIcon: '🔄', title: '结局 27：退款重生', endingText: '<p>你跟妈妈说："妈，我们把钱退了吧。全部退。"妈妈愣住了——攒了八年的钱，说退就退？你帮她算了一笔账：每个顾客16块，一个月大概五千个顾客，八年下来，扣掉成本，能退的其实没那么多。你帮妈妈在群里发了一条消息："各位顾客，我们决定退款。请私信我交易记录，我们会一一退还。"退款的第一个星期，你每天只睡四个小时。有人不要，有人多要，有人骂你"做样子"。但你坚持退完了最后一个人。</p><p><em>退款结束后，你在群里发了最后一条消息："谢谢大家。以后我们卖鸭腿——明码标价，货真价实。如果你们还愿意来，我们在老地方。"第二天出摊，你看到有人来了。不多，但有人在。你妈看着那些人，笑了。你发现，有时候失去一切，反而能重新开始。你发现，你妈这辈子赚的最值钱的东西，不是那些钱，而是那些愿意回来的人。</em></p>', philosophy: '<strong>人生哲理：</strong>金钱可以还清债务，但诚实才能还清灵魂的债。你退的不是钱，是你们欠这个世界的信任。当你把最后一笔钱退出去的时候，你发现你的手是轻的——不是因为没有钱了，是因为没有秘密了。秘密是这个世界上最重的东西，重到可以压弯一个人的腰，重到可以压垮一个家庭。而放下秘密的那一刻，你才真正理解了什么叫"自由"。' },
    'end23': { isEnding: true, endingIcon: '😤', title: '结局 23：孝子的代价', endingText: '<p>你的情感长文被网友逐段扒出漏洞，你成了"洗白工具人"。你的学业受到影响，社交圈崩塌。你坐在宿舍里，看着手机上那些骂你的评论，第一次问自己：我到底是在保护妈妈，还是在满足自己的英雄幻想？</p><p><em>但你没有答案。或者说，你不敢有答案。因为你一旦承认你是为了满足自己，你就必须承认——你做的这一切，不是为了她，是为了你自己。你不敢承认。所以你继续写，继续发，继续在网上跟人对骂。你告诉自己：<strong>"我是在保护妈妈。你们懂什么？你们有妈妈吗？你们的妈妈会凌晨四点起床给你们做饭吗？"</strong>你越来越疯狂，越来越偏执。你开始相信，全世界都在迫害你和你妈。你忘了——你妈不是被你保护的受害者，你妈是一个需要被理解的普通人。而你，正在用你的"保护"，把她变成一个无法被理解的人。你正在把你妈的人生，变成你的战场。</em></p>', philosophy: '<strong>疯魔独白：</strong>"我是孝子！我是全北京最孝顺的儿子！你们谁敢说比我更爱我妈？你们谁凌晨四点起来帮她洗过菜？你们谁在风雪里帮她推过三轮车？你们谁在群里帮她骂过那些不知好歹的顾客？没有！你们都没有！你们只会坐在屏幕后面敲键盘！你们只会说\'鹅腿是鸭腿\'——你们知道个屁！那是我妈！那是我妈用命换来的腿！"' },
    'end24': { isEnding: true, endingIcon: '🃏', title: '结局 24：编造的故事', endingText: '<p>你帮妈妈编了一套"更好的说法"——什么"特殊品种鸭""学生习惯叫鹅腿""供应商误导"等等。一开始好像有效果，但互联网是有记忆的。有人翻出了你之前所有前后矛盾的发言，做成了一张时间线图。你编的每一句话都变成了新的证据，指向一个更大的谎言。</p><p><em>但你不在乎。你继续编，继续圆，继续在谎言上堆砌谎言。你开始觉得，这不是在撒谎，这是在"创作"。你开始觉得自己是一个天才——一个能用谎言构建现实的天才。你对着镜子里的自己说：<strong>"我在保护我妈。我编的每一个字都是为了她。如果撒谎能保护她，我就撒一辈子谎。如果这个世界想要真相，我就给这个世界一个更好的真相——一个我妈想要的真相，一个对我们有利的真相。"</strong>你妈站在门口，听到了你说的话。她没有进来。她转身走了。你后来才知道，那天晚上，她一个人在厨房里哭了很久。不是因为你撒谎——是因为她发现，她把你变成了一个和她一样的人。一个一辈子都在撒谎的人。而这是她这辈子最害怕的事。</em></p>', philosophy: '<strong>疯魔独白：</strong>"谎言？什么是谎言？法律上有写鸭腿不能叫鹅腿吗？行业标准里有写吗？没有！什么都没有！那凭什么说是谎言？我说它是鹅腿它就是鹅腿！我腌了八年的腿，我的手艺，我的味道，我的招牌——我说它是什么它就是什么！你们管得着吗？你们懂什么？你们连鹅腿和鸭腿都分不清，凭什么来评判我？"' },
    'end28': { isEnding: true, endingIcon: '💔', title: '结局 28：切割', endingText: '<p>你跟妈妈说："妈，我不能再管了。我要读书，我要毕业，我不能让这件事毁了我。"妈妈看着你，眼睛里有你从未见过的表情——不是愤怒，不是失望，是某种更深的、你至今无法描述的东西。她说："好。"你搬回了学校，删掉了所有群聊，在朋友圈屏蔽了所有可能提到"鹅腿阿姨"的人。你照常上课、考试、写论文。一切看起来都很正常。</p><p><em>但你知道，你每天晚上都睡不着。你每天都会偷偷搜索"鹅腿阿姨"的最新消息。你看到妈妈的摊位关了，看到她在记者镜头前的样子，看到有人说她"活该"——你关掉手机，告诉自己这不关你的事。但你知道，这不只是关你的事——这是你的事。是你建的群，是你骂的人，是你推倒的第一块多米诺骨牌。你告诉自己：<strong>"我有什么错？我是她儿子，但我也是一个人。我有我自己的人生，我自己的前途。我不能为了她毁掉一切。"</strong>但你心里知道——你逃了。你从那个在车斗里说"我妈妈是鹅腿阿姨"的孩子，变成了一个连妈妈都不敢认的懦夫。</em></p>', philosophy: '<strong>疯魔独白：</strong>"我走是为了她好！我走了她就不用再为我操心了！我走了她就可以重新开始了！你们凭什么说我抛弃了她？我供她吃供她穿了吗？没有！是她供我！我一个人在外面读书，我容易吗？我每天被同学问\'你妈是不是鹅腿阿姨\'，我每天被老师暗示\'你要注意影响\'——我容易吗？我只是想过正常的生活！我有什么错！我爱她，但我不能为了她毁了我自己！这是理性！这不是抛弃！"' },
    'end29': { isEnding: true, endingIcon: '🔥', title: '结局 29：你的名字被记住', endingText: '<p>"不吃滚出去"成了年度最火网络热梗，你——"凉与"——被做成了表情包、鬼畜视频、甚至被编进了段子。在互联网上，你永远是被嘲笑的对象。没人记得你叫什么，只记得你叫"凉与"。你删掉了所有社交账号，但你无法删除互联网的记忆。多年后，你走在街上，还偶尔会听到有人在你背后说："嘿，那不是那个\'不吃滚出去\'吗？"</p><p><em>但你不在乎。你甚至开始享受这种"出名"的感觉。你开始觉得——<strong>"被记住就是赢。不管是以什么方式被记住。你们骂我？骂我就是给我流量。你们嘲笑我？嘲笑我就是给我热度。你们做表情包？表情包就是我的广告。你们以为你们在惩罚我？不，你们在成就我。我是\'凉与\'——全中国最火的网红儿子。"</strong>你开始在网上发视频，用"凉与"这个身份做直播。你赚了钱，但你妈不再接你电话了。你失去了她，但你告诉自己——你赢了。你对着镜头笑，但你的笑，没有到达你的眼睛。你的眼睛是空的。像一个无底洞，什么都填不满。</em></p>', philosophy: '<strong>疯魔独白：</strong>"我是凉与。记住这个名字。你们可以不记得鹅腿阿姨，可以不记得鸭腿，可以不记得那个群——但你们要记住我。记住那句话——\'不吃滚出去\'。那是我的名言，我的品牌，我的商标。你们每用一次那个表情包，就是给我打一次广告。你们每天都在给我免费宣传。谢谢你们。谢谢你们把我捧上神坛。"' },
    'end30': { isEnding: true, endingIcon: '🌱', title: '结局 30：母子的新开始', endingText: '<p>你全程控制住了情绪——没有骂人，没有怼人，每次想发火的时候你都深吸一口气，把手机翻过来扣在桌上。你帮妈妈做了三件事：改招牌、道歉、退款。风波过后，你们在一条安静的街上重新开了一个小门面，招牌上写着"鸭腿妈妈"。你不再是"凉与"，你是那个帮你妈妈重新站起来的儿子。</p><p><em>你发现，保护好一个家，比保护一个秘密重要得多。你以前以为，家就是妈妈和你，你们两个人对抗全世界。但现在你知道了——家，不是一个需要对抗的地方。家，是一个可以不设防的地方。你妈妈在店里烤腿，你在旁边帮忙。你看着她，她看着你，你们不需要说话，但你们什么都知道。有一天，一个老顾客来了，问："阿姨，这真的是鸭腿吗？"你妈还没开口，你就在旁边说："是。鸭腿。我们自己腌的。你尝尝。"那个顾客买了，吃了，说："嗯，比鹅腿好吃。"你妈笑了。你也笑了。你突然觉得，你的人生在这一刻，终于完整了。你不再是那个愤怒的少年，不再是那个偏执的守护者，不再是那个被热搜定义的"凉与"。你只是一个儿子，在帮妈妈卖腿。而这，就是你这辈子最骄傲的身份。</em></p>', philosophy: '<strong>人生哲理：</strong>成长不是学会如何保护别人，而是学会如何保护自己。你以前以为，保护妈妈就是跟全世界对抗。现在你知道了，保护妈妈，就是帮她成为一个更好的人。诚实，是你能给她最好的保护。因为当你不再需要用谎言来维护谎言的时候，你和她，才能真正自由。而自由——才是最好的保护。' }
  };
}

        { text: '继续沉默，不参与', hint: '利益值 +0', meterChange: {}, nextScene: 'v3', bridge: '<strong>你什么都没做。你告诉自己：这不关我的事。</strong>但事情没有因为你沉默而停止——别人引爆了它。你发现自己成了一个旁观者，看着一场大火烧起来，而你手里有灭火器但选择了不用。你站在自己的摊位前，看着她那边围满了记者，看着她儿子在镜头前语无伦次，看着她低着头被市监局的人带走。你告诉自己这不关你的事——但你知道，这只是一个借口。你知道真相，你选择了沉默，而沉默本身也是一种选择。' },
        { text: '匿名给国贸群里的人透露消息', hint: '利益值 +20', meterChange: { profit: 20 }, nextScene: 'v3', bridge: '<strong>你注册了一个小号，在国贸群里发了一条消息："有人知道鹅腿阿姨的腿其实不是鹅腿吗？"</strong>发完你立刻退出，心跳加速。两天后，你看到群里开始讨论这件事——你点燃了导火索。但你不知道的是，这把火不仅会烧到她，也可能烧到你。' },
        { text: '直接找她，提出"合作"', hint: '利益值 +15', meterChange: { profit: 15 }, nextScene: 'v3', bridge: '<strong>收摊后，你找到她，说："姐，我知道你的腿是鸭腿。我帮你保守秘密，但你要帮我——把你的老顾客介绍给我，或者给我分成。"</strong>她看着你，眼神从惊讶变成了恐惧，然后变成了愤怒。"你威胁我？"她问。你说："这不是威胁，是合作。"' }
      ] },
    'v3': { sceneNum: '第四幕', title: '全线崩塌', text: '<p>国贸群炸了。她儿子那句"不吃滚出去"上了热搜。她发了群公告承认。记者来了，市监局来了。现在，整条街都在被关注。你知道，下一个可能就是你了。你该怎么办？</p>',
      choices: [
        { text: '置身事外，不接受任何采访', hint: '利益值 +0', meterChange: {}, nextScene: 'v_ferment', bridge: '<strong>你拒绝了所有采访。"我不认识她，我什么都不知道。"</strong>你对着记者说完，关上了摊位的窗户。但你知道，你关了窗户，关不了心里的那扇门。' },
        { text: '接受记者采访，暗示"大家都这么做"', hint: '利益值 +15，高风险', meterChange: { profit: 15 }, nextScene: 'v_ferment', bridge: '<strong>你对记者说："我跟她不是一路人。但说实话，这条街上，谁没有点不能说的事？"</strong>第二天，新闻标题变成了"鹅腿阿姨同行摊贩：大家都这么做"。你的一句话引发了行业大地震——市监局开始查整条街。你本来只想转移注意力，结果把自己也卷了进去。' },
        { text: '公开曝光她，同时宣传自己的诚信经营', hint: '利益值 +25', meterChange: { profit: 25 }, nextScene: 'v_ferment', bridge: '<strong>你接受了采访，说："我卖了八年烤冷面，从来没有骗过顾客。她这样是砸我们整条街的招牌。我做的是诚信生意。"</strong>第二天，你的摊位前排起了长队——都是看了新闻来的。你成了"诚信摊贩"的代表。但你也知道，你手里有她八年的秘密，你却选择了公开踩她上位。每天收摊的时候，你看着空荡荡的她的摊位，心里说不上是什么滋味。' }
      ] },
    'v_ferment': { sceneNum: '网络发酵', title: '风暴中的同行', text: '<p>鹅腿阿姨的事已经成了全网最大的热点。你每天刷手机，都能看到新的进展——今天有人扒出她的进货单，明天有人采访她的邻居，后天有人做了她的"专题纪录片"。</p><p>但最让你意外的是，舆论的风暴也开始波及到你了。有人扒出了你的摊位——因为你是鹅腿阿姨最近的同行摊贩，有人怀疑你就是那个"在国贸群里引爆质疑的匿名顾客"。你的摊位开始被人拍照，你的微信开始被人加好友。</p><p>更让你震惊的是，有记者找到了你，想采访你"作为鹅腿阿姨的同行，你怎么看这件事"。你犹豫了——你确实知道一些内情，你确实有一些想法。但你说出来，会不会引火烧身？</p><p>与此同时，你看到周边的摊贩们开始躁动了。有人偷偷换了自己的招牌，把"鹅腿"改成了"鸭腿"；有人开始主动给顾客看进货单；还有人在摊位上贴了"假一赔十"的告示。<strong>一只鹅腿引发的风暴，正在改变整个街头小吃的生态。你站在风暴的边缘，看着这一切——你发现，这不是鹅腿阿姨一个人的事，这是整个行业的事。</strong></p>',
    choices: [
      { text: '接受采访，说出你知道的事', hint: '利益值+5', meterChange: { profit: 5 }, nextScene: 'v4' },
      { text: '拒绝采访，先观望', hint: '利益值不变', meterChange: {}, nextScene: 'v4' }
    ] },
    'v4': { sceneNum: '第五幕', title: '趁火打劫还是雪中送炭', text: '<p>她的摊位关了，微信群也安静了。你面前摆着两条路。一条是继续踩着她往上爬，一条是拉她一把。你心里清楚，你和她其实是一样的人——都是在这条街上讨生活的普通人。只是她运气好（或者说运气差），被推到了风口浪尖。而你，现在还站在阴影里。</p>',
      choices: [
        { text: '私下联系她，提出帮她度过危机，换取客户资源', hint: '利益值 +20', meterChange: { profit: 20 }, nextScene: 'end35', bridge: '<strong>你给她打了电话，说："姐，我帮你。你的老顾客我来接，你教我怎么做那个酱汁，咱们五五分。"</strong>她在电话那头沉默了很久。最后她说："行。"你们的合作开始了——但这段关系建立在利益之上，随时可能崩塌。你每天跟她一起进货，一起腌制，你发现她的手艺确实好。但你也知道，她看你的时候，眼睛里有一道你跨不过去的墙。' },
        { text: '借机宣传自己的诚信经营，抢占她的市场', hint: '利益值 +30', meterChange: { profit: 30 }, nextScene: 'end32', bridge: '<strong>你在摊位上挂了横幅："诚信经营八年，宁愿少卖也不骗人。"</strong>记者又来采访你了，你成了"网红诚信摊贩"。你的生意翻了三倍，你甚至开始考虑开分店。但每天晚上收摊的时候，你路过她空荡荡的摊位，你会不自觉地加快脚步。有一天，你看到她在远处看着你的摊位，然后转身走了。你告诉自己：这就是生意。但你的良心在说：这是你欠她的。' },
        { text: '主动帮她说话，证明她虽然用料不对但不是坏人', hint: '利益值 -10', meterChange: { profit: -10 }, nextScene: 'end37', bridge: '<strong>你接受了采访，说："她确实用错了料，但她是好人。我认识她八年，她每天凌晨四点起来，辛辛苦苦把儿子供到大学。你们骂她可以，但请记住她也是一个人。"</strong>这段话发出去后，有人骂你"同流合污"，也有人被你的话打动。她后来给你发了条消息，只有两个字："谢谢。"你看着这条消息，觉得这两个字比你赚过的所有钱都沉。' }
      ] },
    // VENDOR ENDINGS
    'end31': { isEnding: true, endingIcon: '😶', title: '结局 31：沉默的同行', endingText: '<p>你什么都没说，什么都没做。风波过后，一切照旧，你继续卖你的烤冷面。她的摊位空了，你的摊位还在。但你每天收摊的时候，路过那个空位，你都会放慢脚步。你和她做了八年邻居，你从未说过"你好"，也从未说过"再见"。</p><p><em>有些关系，近在咫尺，却远在天涯。你们共用了八年的同一片屋檐，呼吸了八年的同一条街的空气，见证了彼此八年的人生——但你从未真正认识过她。你只知道她叫"鹅腿阿姨"，你知道她有一个儿子，你知道她凌晨四点起床。但你不知道她叫什么名字，不知道她从哪里来，不知道她为什么每天凌晨四点就要起来。你从来没有问过。你忙着做自己的生意，忙着算计自己的利润，忙着和她竞争。你忘了，她不是你的竞争对手——她是你的邻居。邻居，是在你摔倒的时候扶你一把的人。但你从来没有扶过她，她也没有机会扶你。你们只是并排站了八年，像两根电线杆——靠得很近，但永远没有交集。</em></p>', philosophy: '<strong>核心哲理：</strong>距离不是用米来量的，是用心来量的。你可以和一个人面对面站了八年，你们之间的距离依然是零——不是零距离，是零深度。你从来没有真正看见过她。你看见的只是她的生意、她的顾客、她的利润。你忘了，她是一个活生生的人，有喜怒哀乐，有恐惧，有秘密。街上的人来了又走，而你和她，站了八年，却从未真正相遇。' },
    'end32': { isEnding: true, endingIcon: '🏆', title: '结局 32：诚信商人', endingText: '<p>你抓住机会建立了诚信品牌，生意越来越好。你证明了"老实人不吃亏"。有一天，你看到她在你摊位前排队，买了一份你的烤冷面。她看到你，笑了笑。你发现，有些东西比利益更重要——比如，你每天晚上能睡踏实觉。</p><p><em>踏实，是这世上最被低估的奢侈品。你不需要提心吊胆地担心被人发现，不需要在顾客问"这是什么肉"的时候含糊其辞，不需要在睡觉前回想今天有没有说漏嘴。你只需要做好你的烤冷面，收钱，说谢谢。就这么简单。你用了半辈子才明白——诚实不是一种美德，是一种省钱的方式。你省下了撒谎的精力，省下了圆谎的时间，省下了害怕被揭穿的心理负担。你把这些省下来的东西，全部投入到了你的烤冷面里。所以你的烤冷面比别人好吃——因为你的心是轻松的。轻松的心，做出来的东西，带着轻松的味道。</em></p>', philosophy: '<strong>核心哲理：</strong>老实人不吃亏，吃亏的是那些以为自己很聪明的人。你以为撒谎能赚更多，但撒谎的隐形成本——焦虑、失眠、心虚、应对检查、编造故事——这些加起来，比你赚的差价多得多。你选择了诚实，不是因为你是圣人，是因为你算了一笔账。你发现，诚实是最经济的选择。它不需要维护成本，不需要更新版本，不需要担心崩溃。你做了一个老实的商人，这是你做过的最聪明的生意。' },
    'end33': { isEnding: true, endingIcon: '🌪️', title: '结局 33：行业大地震', endingText: '<p>你在采访中暗示"大家都这么做"，本意是想说不是她一个人的问题。但你的话被媒体放大——第二天，市监局出现在了整条街上。你的摊位被查了，隔壁卖煎饼的老李被查了，连卖水果的大姐都被查了。一周之内，半条街的摊位都关了。你成了同行眼中的"罪人"——有人在你摊位上泼了油漆，有人当面骂你"叛徒"。</p><p><em>你本来只是想转移一下火力，但你没想到你点燃的是一场烧遍整条街的大火。你站在空荡荡的街道上，发现你不仅失去了邻居，还失去了在这条街上八年的立足之地。你终于明白，有些话一旦说出口，就像泼出去的水——收不回来，而且会淹死很多人。你发现，真正的智慧不是知道该说什么，而是知道不该说什么。不是所有的事实都需要被说出来，不是所有的真相都适合成为新闻标题。沉默有时候是一种保护——保护别人，也保护自己。你学会了，但代价是半条街的摊位。这个代价，太贵了。</em></p>', philosophy: '<strong>核心哲理：</strong>说话是有重量的。一句话可以轻如鸿毛，也可以重如泰山——取决于你什么时候说、对谁说、怎么说。你以为你在说"事实"，但你不知道事实有时候是一把刀——你握着刀柄，刀尖却对着别人。你以为你在为自己解围，但你的解围方式，是把所有人都拖下水。' },
    'end34': { isEnding: true, endingIcon: '🎭', title: '结局 34：双面人', endingText: '<p>你踩着别人上位，但有人挖出了你的问题——你用的油也有问题，你的卫生许可证快过期了。舆论反转，你从"诚信摊贩"变成了"双面人"。</p><p><em>你终于明白，在互联网时代，没有谁是可以永远站在高处的——尤其是当你脚下踩着别人。你踩着她往上爬的时候，忘了往脚下看一眼。你忘了，你自己站的也不是平地——你站的是薄冰。冰裂的时候，你和她一起掉进了水里。你本来想当英雄，但最后你发现，你和她一样，都是普通人。普通人，就会有缺点，就会有把柄，就会有经不起细看的地方。你以为你能逃过一劫，是因为你比她聪明。但互联网不关心谁聪明——互联网只关心谁能被扒。你被扒了。你发现，你和她之间唯一的区别是：她承认了，你没有。她没有自称"诚信"，你自称了。所以她的倒下令人心生同情，而你的倒下，只让人想说：活该。</em></p>', philosophy: '<strong>核心哲理：</strong>站得越高，摔得越重。尤其是当你站的不是自己的高度，而是踩着别人的肩膀爬上去的时候。你踩的不是肩膀，是炸药。总有一天，炸药会炸。你选择了利用别人的错误来抬高自己，但你忘了——你的错误也在等着被发现。这世上没有完美的人，只有还没被发现的缺点。如果你想站在高处，先确保你的脚是干净的。' },
    'end35': { isEnding: true, endingIcon: '🤝', title: '结局 35：各取所需', endingText: '<p>你和她达成了交易——你把老顾客资源分享给她，她教你酱汁配方。你们的合作在一开始很顺利，生意也不错。但信任这种东西，一旦建立在利益之上，就像建在沙滩上的房子。两个月后，你发现她偷偷留了一手——最好的那款酱汁的配方，她没有给你。你质问她，她说"你也没有把你所有的老顾客介绍给我"。你们在出租屋里吵了一架，八年的邻居情谊在十分钟内碎成了渣。</p><p><em>合作破裂后，你的生意回到了原点，她也不再信任你。你坐在空荡荡的摊位前，想起你爸说的"做生意要讲良心"。你终于明白，你爸说的对——但他没告诉你的是，良心这东西，丢了就很难再找回来。你和她之间的合作，从一开始就是错的。不是因为合作本身错了，是因为你们合作的基础是"利益"。今天利益一致，你们是朋友；明天利益冲突，你们就是敌人。真正的合作，需要信任；而信任，需要时间。你们跳过了时间，直接进入了利益——这就好比跳过地基，直接盖楼。楼盖得越高，塌得越快。你们盖了两个月，塌了十分钟。</em></p>', philosophy: '<strong>核心哲理：</strong>信任是这世上最慢的作物——它需要几年甚至几十年才能长成，但摧毁它只需要一句话、一个动作、一个瞬间。你和她用了八年种下了一棵树，然后用两个月砍掉了它。你发现，砍树永远比种树容易。但树砍了，那片阴凉就再也没有了。你们之间的那棵叫"八年邻居"的树，倒了。' },
    'end36': { isEnding: true, endingIcon: '💣', title: '结局 36：黑料战争', endingText: '<p>当她拒绝你的合作提议后，你怒了。你把她八年来用鸭腿冒充鹅腿的所有证据——进货单、聊天记录、对比照片——一股脑发给了媒体。你甚至接受了一家自媒体长达四十分钟的采访，详细讲述"我知道的鹅腿阿姨"。报道发出去后，她彻底垮了。</p><p><em>但你没有赢得掌声——有人开始调查你，发现你不仅在举报她，你还曾经暗示过"大家都这么做"来为自己开脱。你的形象从"吹哨人"变成了"公报私仇的小人"。更糟糕的是，你的儿子在学校被人说"你爸就是那个举报鹅腿阿姨的人"。你儿子回家问你："爸，你为什么要这样做？"你张了张嘴，发现自己说不出一个让他信服的理由。你赢了战争，但你失去了儿子看你的眼神——那种眼神，比任何热搜都更让你难受。你发现，你举报她，不是因为正义，是因为愤怒。因为她拒绝了你，所以你毁了她。你告诉自己这是"揭露真相"，但你心里清楚——如果她当初接受了你的合作提议，你什么都不会说。你不是在追求真相，你是在追求报复。</em></p>', philosophy: '<strong>核心哲理：</strong>有些战争，赢了就是输了。你赢了对手，输给了自己；你赢了舆论，输给了家人。你以为你在追求正义，但其实你只是在追求赢。你想要赢，所以你用了一切手段。但手段是有代价的，代价是你变成了你不想成为的人。你儿子问你的那三个字——"为什么"——是你这辈子被问过的最难的问题。因为你答不出来。' },
    'end37': { isEnding: true, endingIcon: '❤️', title: '结局 37：真正的朋友', endingText: '<p>你主动帮她说话，证明她是好人。后来你们联手经营，她的酱汁加上你的管理，生意比以前更好。她跟你说："老周，谢谢你。"你说："谢什么，咱们是邻居。"</p><p><em>后来有一天，你发现她的招牌上，加了一行小字——"老周推荐"。你看着那行字，笑了很久。真正的朋友，不是在顺境中锦上添花，而是在逆境中雪中送炭。你选择了雪中送炭。你选择了在她最冷的时候，给她递了一件衣服。这件衣服，不是什么贵重的礼物——只是你的一句实话，你的一次站出来，你的一次"我认识她，她是好人"。但这句话，在那个所有人都想踩她一脚的时刻，是唯一往上托的力量。你托住了她。她没有倒。她站起来了，你也是。你们俩，从"同一条街的摊贩"变成了"真正的朋友"。从"竞争对手"变成了"合作伙伴"。你发现，你失去了一些利润，但你得到了一些更贵的东西——一个朋友。一个能在你危难时刻站出来的朋友。一个在你招牌上写"老周推荐"的朋友。你看着那行字，笑了很久。不是因为那行字能给你带来多少生意——是因为那行字告诉你：你是一个值得被推荐的人。你是一个好人。这比赚多少钱都重要。</em></p>', philosophy: '<strong>核心哲理：</strong>朋友这两个字，是你这辈子做过的最好的生意。你投入了真诚，收获了信任；你投入了帮助，收获了友谊；你投入了雪中送炭，收获了患难与共。这不是一笔交易——这是一笔投资。你投资的是人性，回报的是人心。人心，是这世上回报率最高的资产，也是风险最低的资产。因为人心不会贬值，不会崩盘，不会背叛。你得到了她的心，她得到了你的心。你们俩，在这条街上，做了八年的邻居，最后做了朋友。这是你人生中，最划算的一笔投资。' }
  };
}
