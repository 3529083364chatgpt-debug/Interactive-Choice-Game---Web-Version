<script>
// ═══════════════════════════════════════════════
// AUDIO SYSTEM — Dark atmospheric ambient
// Layered: low drone + tension pulse + distant noise + subtle dish clatter
// ═══════════════════════════════════════════════
let audioCtx = null;
let audioPlaying = false;
let audioNodes = [];
let audioGains = {};

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function createNoiseBuffer(duration) {
  const sampleRate = audioCtx.sampleRate;
  const length = sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, length, sampleRate);
  const data = buffer.getChannelData(0);
  let lastOut = 0;
  for (let i = 0; i < length; i++) {
    const white = Math.random() * 2 - 1;
    lastOut = (lastOut + (0.02 * white)) / 1.02;
    data[i] = lastOut * 3.5;
  }
  return buffer;
}

function startMusic() {
  if (!audioCtx) initAudio();
  if (audioPlaying) return;
  audioPlaying = true;
  const now = audioCtx.currentTime;

  // Master chain: compressor -> master gain -> destination
  const compressor = audioCtx.createDynamicsCompressor();
  compressor.threshold.value = -24;
  compressor.knee.value = 30;
  compressor.ratio.value = 12;
  compressor.attack.value = 0.003;
  compressor.release.value = 0.25;

  const masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.gain.linearRampToValueAtTime(0.05, now + 2.5);
  compressor.connect(masterGain);
  masterGain.connect(audioCtx.destination);
  audioNodes.push(compressor, masterGain);
  audioGains.master = masterGain;

  // Layer 1: Low drone (C2, ominous)
  const droneOsc = audioCtx.createOscillator();
  droneOsc.type = 'sine';
  droneOsc.frequency.value = 65.41; // C2
  const droneGain = audioCtx.createGain();
  droneGain.gain.value = 0;
  droneGain.gain.linearRampToValueAtTime(0.25, now + 2);
  droneOsc.connect(droneGain).connect(compressor);
  droneOsc.start(now);
  audioNodes.push(droneOsc, droneGain);
  audioGains.drone = droneGain;

  // Drone LFO for slow pulse
  const droneLfo = audioCtx.createOscillator();
  droneLfo.type = 'sine';
  droneLfo.frequency.value = 0.08;
  const droneLfoGain = audioCtx.createGain();
  droneLfoGain.gain.value = 0.1;
  droneLfo.connect(droneLfoGain).connect(droneGain.gain);
  droneLfo.start(now);
  audioNodes.push(droneLfo, droneLfoGain);

  // Layer 2: Tension pulse (G2, triangle)
  const tensionOsc = audioCtx.createOscillator();
  tensionOsc.type = 'triangle';
  tensionOsc.frequency.value = 98.00; // G2
  const tensionGain = audioCtx.createGain();
  tensionGain.gain.value = 0;
  tensionGain.gain.linearRampToValueAtTime(0.08, now + 3);
  tensionOsc.connect(tensionGain).connect(compressor);
  tensionOsc.start(now);
  audioNodes.push(tensionOsc, tensionGain);
  audioGains.tension = tensionGain;

  // Layer 3: Brown noise filtered (ambient room tone)
  const noiseBuffer = createNoiseBuffer(2);
  const noiseSrc = audioCtx.createBufferSource();
  noiseSrc.buffer = noiseBuffer;
  noiseSrc.loop = true;
  const noiseFilter = audioCtx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 120;
  noiseFilter.Q.value = 0.5;
  const noiseGain = audioCtx.createGain();
  noiseGain.gain.value = 0;
  noiseGain.gain.linearRampToValueAtTime(0.01, now + 5);
  noiseSrc.connect(noiseFilter).connect(noiseGain).connect(compressor);
  noiseSrc.start(now);
  audioNodes.push(noiseSrc, noiseFilter, noiseGain);
  audioGains.noise = noiseGain;

  // Layer 4: High-pass subtle hiss (cafeteria/indoor feel)
  const hissBuffer = createNoiseBuffer(2);
  const hissSrc = audioCtx.createBufferSource();
  hissSrc.buffer = hissBuffer;
  hissSrc.loop = true;
  const hissFilter = audioCtx.createBiquadFilter();
  hissFilter.type = 'highpass';
  hissFilter.frequency.value = 600;
  hissFilter.Q.value = 0.3;
  const hissGain = audioCtx.createGain();
  hissGain.gain.value = 0;
  hissGain.gain.linearRampToValueAtTime(0.006, now + 6);
  hissSrc.connect(hissFilter).connect(hissGain).connect(compressor);
  hissSrc.start(now);
  audioNodes.push(hissSrc, hissFilter, hissGain);
  audioGains.hiss = hissGain;

  // Layer 5: Deep sub-bass (C1, earth feel)
  const subOsc = audioCtx.createOscillator();
  subOsc.type = 'sine';
  subOsc.frequency.value = 32.70; // C1
  const subGain = audioCtx.createGain();
  subGain.gain.value = 0;
  subGain.gain.linearRampToValueAtTime(0.06, now + 3);
  subOsc.connect(subGain).connect(compressor);
  subOsc.start(now);
  audioNodes.push(subOsc, subGain);
  audioGains.sub = subGain;

  document.getElementById('audioBtn').classList.remove('muted');
}

function stopMusic() {
  audioPlaying = false;
  audioNodes.forEach(n => { try { n.stop?.(); n.disconnect?.(); } catch(e){} });
  audioNodes = [];
  audioGains = {};
  document.getElementById('audioBtn').classList.add('muted');
}

function toggleMusic() {
  if (audioPlaying) stopMusic();
  else startMusic();
}

document.getElementById('audioBtn').addEventListener('click', toggleMusic);

// Start music on first user interaction
document.addEventListener('click', function startOnce() {
  if (!audioPlaying) startMusic();
}, { once: true });

// ═══════════════════════════════════════════════
// GAME ENGINE
// ═══════════════════════════════════════════════
const app = document.getElementById('app');
let currentPerspective = null;
let currentScene = null;
let meters = {};

function setMeter(name, val) {
  meters[name] = Math.max(0, Math.min(100, val));
  setTimeout(function() {
    var meterItems = document.querySelectorAll('.meter-item');
    meterItems.forEach(function(item) {
      var valEl = item.querySelector('.meter-val');
      if (valEl && valEl.textContent === String(val)) {
        valEl.classList.add('meter-pulse');
        setTimeout(function() { valEl.classList.remove('meter-pulse'); }, 400);
      }
    });
  }, 50);
}

function renderMeters() {
  if (!currentPerspective || !currentPerspective.meters) return '';
  const names = { truth: '\u771f\u76f8\u503c', courage: '\u52c7\u6c14\u503c', integrity: '\u5ec9\u6d01\u503c', pressure: '\u538b\u529b\u503c', honesty: '\u8bda\u4fe1\u503c', survival: '\u751f\u5b58\u503c', influence: '\u5f71\u54cd\u529b', justice: '\u6b63\u4e49\u503c' };
  const fills = { truth: 'trust', courage: 'trust', integrity: 'authority', pressure: 'greed', honesty: 'trust', survival: 'greed', influence: 'authority', justice: 'justice' };
  return '<div class="meters">' + Object.entries(currentPerspective.meters).map(([k, v]) => {
    const pct = ((meters[k] || v) / 100 * 100);
    return '<div class="meter-item"><span class="meter-name">' + (names[k]||k) + '</span><span class="meter-val">' + (meters[k]||v) + '</span><div class="meter-bar"><div class="meter-fill ' + (fills[k]||'') + '" style="width:' + pct + '%"></div></div></div>';
  }).join('') + '</div>';
}

// SAVE / LOAD SYSTEM
// ═══════════════════════════════════════════════
function saveGame() {
  if (!currentPerspective || !currentScene) return;
  var saveData = {
    perspId: currentPerspective.id,
    sceneId: Object.keys(currentPerspective.scenes).find(function(k) { return currentPerspective.scenes[k] === currentScene; }),
    meters: Object.assign({}, meters),
    timestamp: Date.now()
  };
  localStorage.setItem('rat_head_save', JSON.stringify(saveData));
  var status = document.getElementById('saveStatus');
  if (status) { status.textContent = '\u2713 \u5df2\u4fdd\u5b58'; status.classList.add('show');
    setTimeout(function() { status.classList.remove('show'); }, 2000); }
}

function loadGame() {
  var saved = localStorage.getItem('rat_head_save');
  if (!saved) { alert('\u6ca1\u6709\u627e\u5230\u5b58\u6863'); return; }
  var data = JSON.parse(saved);
  var perspectives = {
    student: { id:'student',name:'\u666e\u901a\u5b66\u751f',icon:'\ud83c\udf93',meters:{truth:50,courage:40},scenes:buildStudentScenes()},
    director: { id:'director',name:'\u6c5f\u5c40\u957f\u00b7\u5e02\u76d1\u5c40',icon:'\ud83d\udc54',meters:{integrity:50,pressure:20},scenes:buildDirectorScenes()},
    cook: { id:'cook',name:'\u98df\u5802\u6321\u53e3\u00b7\u6731\u8001\u677f',icon:'\ud83c\udf73',meters:{honesty:40,survival:50},scenes:buildCookScenes()},
    netizen: { id:'netizen',name:'\u7f51\u53cb/\u5a92\u4f53\u4eba',icon:'\ud83d\udcf1',meters:{influence:20,justice:60},scenes:buildNetizenScenes()}
  };
  currentPerspective = perspectives[data.perspId];
  if (!currentPerspective) return;
  meters = data.meters;
  goToScene(data.sceneId);
}

function deleteSave() {
  localStorage.removeItem('rat_head_save');
  var status = document.getElementById('saveStatus');
  if (status) { status.textContent = '\u2717 \u5b58\u6863\u5df2\u5220\u9664'; status.classList.add('show');
    setTimeout(function() { status.classList.remove('show'); }, 2000); }
}

function renderSaveBar() {
  if (!currentPerspective) return '';
  return '<div class="save-bar">' +
    '<button class="save-btn" onclick="saveGame()">\ud83d\udcbe \u4fdd\u5b58\u8fdb\u5ea6</button>' +
    '<button class="save-btn" onclick="loadGame()">\ud83d\udcc2 \u8bfb\u53d6\u5b58\u6863</button>' +
    '<button class="save-btn" onclick="deleteSave()">\ud83d\uddd1 \u5220\u9664\u5b58\u6863</button>' +
    '<span class="save-status" id="saveStatus"></span>' +
  '</div>';
}

function renderProgress() {
  if (!currentPerspective) return '';
  var sceneCounts = { student: 10, director: 10, cook: 10, netizen: 10 };
  var total = sceneCounts[currentPerspective.id] || 10;
  var currentKey = Object.keys(currentPerspective.scenes).find(function(k) { return currentPerspective.scenes[k] === currentScene; });
  var sceneNum = parseInt((currentKey || '').replace(/[^0-9]/g, '')) || 0;
  var isEnding = currentScene && currentScene.isEnding;
  var pct = isEnding ? 100 : Math.min(95, Math.max(5, (sceneNum / total) * 100));
  return '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
}

function renderGame(scene) {
  currentScene = scene;
  const isEnding = scene.isEnding;
  let html =
    '<div class="game-header">' +
      '<span class="persp-label">' + currentPerspective.icon + ' ' + currentPerspective.name + '</span>' +
      '<button class="back-btn" onclick="renderMenu()">\u2190 \u8fd4\u56de\u4e3b\u83dc\u5355</button>' +
    '</div>' +
    renderMeters() +
    renderSaveBar() +
    renderProgress() +
    '<div class="scene-box fade-in">';

  if (isEnding) {
    html +=
      '<div class="ending-box">' +
        '<div class="ending-label">\u2726 \u7ed3\u5c40 \u2726</div>' +
        '<div class="ending-icon">' + (scene.endingIcon || '\ud83d\udc2d') + '</div>' +
        '<div class="ending-title">' + scene.title + '</div>' +
        '<div class="ending-text">' + (scene.endingText || scene.text) + '</div>' +
        (scene.philosophy ? '<div class="ending-philosophy">' + scene.philosophy + '</div>' : '') +
      '</div>' +
      '<button class="restart-btn" onclick="startGame(\'' + currentPerspective.id + '\')">\ud83d\udd04 \u91cd\u65b0\u5f00\u59cb</button>' +
      '<button class="restart-btn" style="background:var(--card);color:var(--ink);border:1px solid var(--rule);margin-left:0.5rem;" onclick="renderMenu()">\ud83c\udfe0 \u8fd4\u56de\u4e3b\u83dc\u5355</button>';
  } else {
    html +=
      '<div class="scene-header">' +
        '<div class="scene-title">' + (scene.sceneNum || '') + '</div>' +
        '<div class="scene-name">' + scene.title + '</div>' +
      '</div>' +
      '<div class="scene-text">' + scene.text + '</div>' +
      (scene.image ? '<div class="scene-image"><img src="' + scene.image + '" alt="' + (scene.imageCaption || '') + '">' + (scene.imageCaption ? '<div class="img-caption">' + scene.imageCaption + '</div>' : '') + '</div>' : '');

    if (scene.bridge) {
      html += '<div class="narr-bridge">' + scene.bridge + '</div>';
    }

    if (scene.choices && scene.choices.length > 0) {
      html += '<div class="choices-box">';
      scene.choices.forEach(function(c, i) {
        var letter = String.fromCharCode(65 + i);
        var isBad = c.meterChange && Object.values(c.meterChange).some(function(v) { return v < 0; });
        html += '<button class="choice-btn" onclick="makeChoice(' + i + ')">' +
          '<span class="letter' + (isBad ? ' bad' : '') + '">' + letter + '</span>' +
          '<span class="choice-body">' + c.text +
            (c.hint ? '<span class="choice-val">' + c.hint + '</span>' : '') +
          '</span>' +
        '</button>';
      });
      html += '</div>';
    } else if (scene.bridge && scene._nextScene) {
      html += '<div class="choices-box"></div>';
    }
  }

  html += '</div>';
  app.innerHTML = html;
  setTimeout(function() {
    app.scrollTop = 0;
    window.scrollTo(0, 0);
  }, 50);
}

function makeChoice(idx) {
  if (!currentScene || !currentScene.choices) return;
  var choice = currentScene.choices[idx];
  if (!choice) return;

  // Apply meter changes
  if (choice.meterChange) {
    Object.entries(choice.meterChange).forEach(function(entry) {
      setMeter(entry[0], (meters[entry[0]] || 0) + entry[1]);
    });
  }

  // Show bridge if exists
  if (choice.bridge) {
    currentScene.bridge = choice.bridge;
    currentScene.choices = [];
    currentScene._nextScene = choice.nextScene;
    renderGame(currentScene);
    // Add continue button
    setTimeout(function() {
      var box = document.querySelector('.choices-box');
      if (box) {
        box.innerHTML = '<button class="choice-btn" onclick="continueFromBridge()"><span class="letter">\u25b6</span><span class="choice-body">\u7ee7\u7eed</span></button>';
      }
    }, 100);
    return;
  }

  goToScene(choice.nextScene);
}

function continueFromBridge() {
  if (currentScene && currentScene._nextScene) {
    goToScene(currentScene._nextScene);
  }
}

function goToScene(sceneId) {
  if (!currentPerspective) return;
  var scene = currentPerspective.scenes[sceneId];
  if (!scene) { console.error('Scene not found:', sceneId); return; }

  // Check meter-gated scenes
  if (scene.requireMeter) {
    var min = scene.requireMeter[1];
    var key = scene.requireMeter[0];
    if ((meters[key] || 0) < min) {
      if (scene.fallback) {
        return goToScene(scene.fallback);
      }
    }
  }

  // Scene transition
  var overlay = document.getElementById('transitionOverlay');
  if (overlay) {
    overlay.classList.add('active');
    setTimeout(function() {
      renderGame(scene);
      overlay.classList.remove('active');
    }, 150);
  } else {
    renderGame(scene);
  }
}

function startGame(perspId) {
  var perspectives = {
    student: {
      id: 'student', name: '\u666e\u901a\u5b66\u751f', icon: '\ud83c\udf93',
      meters: { truth: 50, courage: 40 },
      scenes: buildStudentScenes()
    },
    director: {
      id: 'director', name: '\u6c5f\u5c40\u957f\u00b7\u5e02\u76d1\u5c40', icon: '\ud83d\udc54',
      meters: { integrity: 50, pressure: 20 },
      scenes: buildDirectorScenes()
    },
    cook: {
      id: 'cook', name: '\u98df\u5802\u6321\u53e3\u00b7\u6731\u8001\u677f', icon: '\ud83c\udf73',
      meters: { honesty: 40, survival: 50 },
      scenes: buildCookScenes()
    },
    netizen: {
      id: 'netizen', name: '\u7f51\u53cb/\u5a92\u4f53\u4eba', icon: '\ud83d\udcf1',
      meters: { influence: 20, justice: 60 },
      scenes: buildNetizenScenes()
    }
  };

  currentPerspective = perspectives[perspId];
  if (!currentPerspective) return;
  meters = {};
  Object.entries(currentPerspective.meters).forEach(function(entry) {
    setMeter(entry[0], entry[1]);
  });
  // Auto-load save if exists for this perspective
  if (localStorage.getItem('rat_head_save')) {
    var saved = JSON.parse(localStorage.getItem('rat_head_save'));
    if (saved.perspId === perspId) {
      meters = saved.meters || meters;
      return goToScene(saved.sceneId);
    }
  }
  goToScene('s0');
}

      ] },
    'c5': { sceneNum: '第五幕', title: '学校开条件',
      text: '<p>学校拿出了最后的筹码：保研名额，加全额奖学金，再加优秀毕业生推荐。条件只有一个——<strong>改口，说那是鸭脖</strong>。</p><p>你坐在会议室里，手里捏着那份承诺书。你知道这不是白纸黑字——这是你人生的跳板。对于一个普通专科生来说，保研意味着什么，你比谁都清楚。你的室友、你的同学，他们都要去找工作，去工厂，去送外卖。而你，可以继续读书，可以有一个不一样的未来。</p><p>但你需要付出的代价是——<strong>说一句谎话</strong>。就一句。</p><p>你看着窗外。操场上，有人在跑步，有人在打球，有人在谈恋爱。他们的生活一切正常——因为他们不知道食堂里发生了什么。因为他们没吃到那颗鼠头。因为他们不是你。</p>',
      choices: [
        { text: '坚决拒绝，不要任何好处', hint: '真相值+15, 勇气值+20', meterChange: { truth: 15, courage: 20 }, nextScene: 'c7', bridge: '<strong>你把承诺书推了回去。</strong>你说："我不要这些。我只要真相。我只要学校告诉所有人——食堂里有老鼠，我们吃了老鼠。就这么简单。"你站起来，走了出去。你不知道等待你的是什么，但你知道——你终于可以做你自己了。' },
        { text: '接受条件，但提出食品安全改革要求', hint: '真相值+5, 勇气值+10', meterChange: { truth: 5, courage: 10 }, nextScene: 'c6', bridge: '<strong>你犹豫了很久，最后说："我可以改口，但学校必须承诺——彻底整改食堂，杜绝类似事件。"</strong>你觉得自己找到了一个折中方案。但你也知道——你改口的那一刻，你就已经不是那个站在食堂里、端着餐盘、浑身发抖的学生了。' },
        { text: '接受全部条件，放弃追究', hint: '真相值-20, 勇气值-15', meterChange: { truth: -20, courage: -15 }, nextScene: 'c6', bridge: '<strong>你签了字。</strong>你看着那份承诺书，上面写着"保研""奖学金""优秀毕业生"。你告诉自己：这是你应得的。你经历了那么多，你受了那么多委屈，学校应该补偿你。但你心里还有一个声音，很小，很轻——它在说：你出卖了真相。' }
      ] },
    'c6': { sceneNum: '第六幕', title: '学校官方通报',
      text: '<p>6月3日，学校发布官方通报：<strong>"经当事人确认，视频中异物为鸭脖，并非老鼠头。学校已对涉事档口进行整改。"</strong></p><p>你看到这条通报的时候，愣住了。通报里说"经当事人确认"——但你没有确认任何东西。学校拿了你的名字，用你的名义，替他们说了谎。</p><p>你的视频被限流了。你的账号被举报了。你的朋友圈被截图发给辅导员。你感到一张无形的网，正在慢慢收紧。</p><p>但奇怪的是——网上的热度不仅没有降，反而更高了。你被限流的视频，被人截图、录屏、转发到各个平台。微博热搜上出现了新的话题——<strong>#指鼠为鸭#</strong>。网友们不买账。他们用放大镜看你的照片，一帧一帧地分析。有人找出了鼠类专家，有人做了3D建模对比，有人翻出了学校食堂的卫生记录。</p><p>你突然发现——<strong>你不是一个人在战斗</strong>。全网的网友，都在帮你寻找真相。</p>',
      image: 'assets/press_conference.jpg', imageCaption: '图：学校官方发布通报，称异物为鸭脖，引发更大争议',
      choices: [
        { text: '站出来，否认学校通报', hint: '真相值+20, 勇气值+20', meterChange: { truth: 20, courage: 20 }, nextScene: 'c7', bridge: '<strong>你发了一条新的声明。</strong>你说："我从来没有确认那是鸭脖。学校通报中的'经当事人确认'，不属实。"这条声明发出去的那一刻，你知道——你回不了头了。但你不在乎。因为你说的是真话。' },
        { text: '保持沉默，但暗中配合调查', hint: '真相值+10, 勇气值+5', meterChange: { truth: 10, courage: 5 }, nextScene: 'c7', bridge: '<strong>你没有公开回应。</strong>但当一个自称是"省调查组工作人员"的人联系你时，你把所有证据都给了他。你说："我不管你们怎么处理，但请你告诉他们——那不是鸭脖。"' },
        { text: '接受学校通报，配合改口', hint: '真相值-15, 勇气值-10', meterChange: { truth: -15, courage: -10 }, nextScene: 'end_s3', bridge: '<strong>你保持了沉默。</strong>你告诉自己：算了，学校已经给了承诺，再过几个月你就能保研了。你删掉了手机上所有的证据，假装什么都没发生。但你不知道——你删掉的，不只是照片，还有你自己的良心。' }
      ] },
    'c7': { sceneNum: '第七幕', title: '网络发酵——指鼠为鸭',
      text: '<p>6月5日到6月15日，这十天，你见证了什么叫"全网狂欢"。</p><p><strong>微博热搜</strong>："爆！指鼠为鸭"连续霸榜三天。阅读量突破<strong>120亿</strong>。评论区里，各种段子、表情包、恶搞图满天飞。有人把"鸭脖"和"鼠头"做成了对比图，有人把校领导的头像P成了老鼠，有人把"指鼠为鸭"写成了打油诗。</p><p><strong>知乎热榜</strong>："如何评价江西某高校食堂'指鼠为鸭'事件？"三千多条回答，从食品安全、高校管理、到基层治理，讨论得热火朝天。最高赞的回答写道："<em>这不仅仅是一颗鼠头的问题。这是当权者用谎言掩盖真相的问题。当他们可以对着镜头说一颗鼠头是鸭脖的时候，他们还有什么谎不敢说？</em>"</p><p><strong>B站</strong>：UP主们做了各种分析视频——从动物学角度鉴定"到底是鼠还是鸭"，从法律角度分析"学校是否涉嫌伪造证据"，从社会学角度讨论"一个小谎言如何演变成公共危机"。弹幕里，满屏都是"指鼠为鸭"四个字。</p><p><strong>抖音</strong>：话题#指鼠为鸭#下的视频播放量超过<strong>200亿</strong>。有人翻唱了《老鼠爱大米》，把歌词改成了"老鼠爱鸭脖"。有人模仿江局长的语气，做成了搞笑配音。有人把整个事件做成了<strong>表情包合集</strong>——"我信你个鬼""鸭脖の凝视""鼠鼠我呀"。</p><p>你看着这些，不知道该哭还是该笑。你的遭遇，变成了全网的段子。但你知道——在这些段子的背后，是无数人对于真相的渴望，对于谎言的愤怒。</p>',
      image: 'assets/netizen_climax.jpg', imageCaption: '图：指鼠为鸭事件在全网发酵，各种表情包、段子、分析视频铺天盖地',
      choices: [
        { text: '公开接受采访，说出全部真相', hint: '真相值+15, 勇气值+15', meterChange: { truth: 15, courage: 15 }, nextScene: 'c8', bridge: '<strong>你接受了一家媒体的专访。</strong>你坐在镜头前，把从6月1日到现在的所有经历，原原本本地讲了一遍。你说的时候很平静，但说到学校领导让你改口的时候，你的声音颤抖了。' },
        { text: '保持低调，但把证据交给调查组', hint: '真相值+10, 勇气值+5', meterChange: { truth: 10, courage: 5 }, nextScene: 'c8', bridge: '<strong>你没有公开露面。</strong>但你把所有证据——照片、聊天记录、录音——都交给了省调查组。你说："我不需要名气，我只需要真相。"' },
        { text: '利用热度，成为网红', hint: '真相值-5, 勇气值+10', meterChange: { truth: -5, courage: 10 }, nextScene: 'c8', bridge: '<strong>你开始频繁出现在各大平台上。</strong>你开直播，接受打赏，接广告。有人骂你"消费苦难"，有人说你"合理维权"。你自己也分不清——你是在追求真相，还是在追求流量？' }
      ] },
    'c8': { sceneNum: '第八幕', title: '省调查组介入',
      text: '<p>6月17日，江西省成立联合调查组，进驻学校。调查组由省教育厅、省市场监管局、省卫健委联合组成。他们调取了食堂的监控录像，封存了涉事档口的食品样本，约谈了学校领导和食堂承包商。</p><p>调查组找到了你。你坐在会议室里，对面是三个穿着制服的工作人员。他们看起来和学校领导不一样——他们的眼神里，没有"捂盖子"的意思。</p><p>"同学，请你如实告诉我们——6月1日那天，你在食堂吃到的，到底是什么？"</p><p>你看着他们，深吸了一口气。</p>',
      choices: [
        { text: '如实说出——那就是鼠头', hint: '真相值+20, 勇气值+20', meterChange: { truth: 20, courage: 20 }, nextScene: 'c9', bridge: '<strong>你说出来了。</strong>你把所有的细节——那颗头的形状、颜色、毛发、牙齿、耳朵——都描述了一遍。你说了学校领导怎么让你改口，说了辅导员怎么暗示你，说了那份承诺书。你说完之后，会议室里安静了很久。然后，调查组组长说了一句话："谢谢你。我们会调查清楚的。"' },
        { text: '继续改口，说那是鸭脖', hint: '真相值-20, 勇气值-15', meterChange: { truth: -20, courage: -15 }, nextScene: 'end_s3', bridge: '<strong>你犹豫了很久，最后还是说："我……我也不确定。可能是鸭脖吧。"</strong>你说完这句话，看到调查组的人交换了一个眼神。你心里一沉——你又一次，背叛了真相。' },
        { text: '要求调查组保护你的安全', hint: '真相值+10, 勇气值-5', meterChange: { truth: 10, courage: -5 }, nextScene: 'c9', bridge: '<strong>你说出了真相，但你也说出了你的恐惧。</strong>你说："我害怕学校的报复。我害怕我不能毕业。我害怕我的人生被毁掉。"调查组组长看着你，认真地说："你放心。我们在这里，就是为了保护像你这样的人。"' }
      ] },
    'c9': { sceneNum: '第九幕', title: '6月17日——真相大白',
      text: '<p>2023年6月17日，江西省联合调查组发布通报：<strong>经调查确认，学生在食堂吃到的异物，确认为老鼠头部，而非鸭脖。</strong></p><p>通报详细列出了调查过程：食品样本鉴定、监控录像分析、证人证言比对——每一项证据都指向同一个结论：<strong>那不是鸭脖，是鼠头</strong>。</p><p>学校被责令整改。食堂承包商被吊销许可证。涉事档口被查封。学校相关领导被约谈问责。江局长被免职。</p><p>你看到通报的那一刻，眼泪掉了下来。你等了十六天，从6月1日到6月17日，从食堂到会议室，从被质疑到被相信——你终于等到了。不是因为你多强大，而是因为——<strong>真相，终究是真相</strong>。</p><p>你走出宿舍，阳光很好。操场上，有人在跑步，有人在打球，有人在谈恋爱。一切都没变。但一切都变了。因为从今天起，你知道——<strong>你说真话，是对的</strong>。</p>',
      image: 'assets/press_conference.jpg', imageCaption: '图：省调查组发布通报，确认异物为鼠头，事件真相大白',
      choices: [
        { text: '接受结果，回归正常生活', hint: '真相值+10, 勇气值+5', meterChange: { truth: 10, courage: 5 }, nextScene: 'end_s1', bridge: '<strong>你关掉了手机，走出了宿舍。</strong>你不需要再说什么了。真相已经大白，你的坚持没有白费。你只想回到教室，回到课本，回到那个普通学生的生活。' },
        { text: '继续发声，推动食品安全改革', hint: '真相值+15, 勇气值+15', meterChange: { truth: 15, courage: 15 }, nextScene: 'end_s2', bridge: '<strong>你没有停下来。</strong>你接受了更多媒体的采访，你参与了食品安全论坛，你甚至在省政协的座谈会上发了言。你说："我不希望任何一个学生，再吃到鼠头。"' },
        { text: '反思这段经历，写下自己的故事', hint: '真相值+5, 勇气值+10', meterChange: { truth: 5, courage: 10 }, nextScene: 'end_s4', bridge: '<strong>你打开电脑，写下了这一切。</strong>从6月1日到6月17日，每一天，每一个细节。你写的时候，眼泪不停地掉。但你坚持写完了。因为你相信——这个故事，值得被记住。' }
      ] },
    // ── Endings ──
    'end_s1': { isEnding: true, endingIcon: '\ud83c\udf93', title: '平静的回归',
      endingText: '<p>真相大白了。你回到了正常的生活。</p><p>你毕业了，找了一份普通的工作。有时候同事会问起你——"那个指鼠为鸭的，是不是你？"你笑笑，说："是。"他们露出惊讶的表情，然后竖起大拇指。</p><p>你没有成为网红，你没有拿到保研，你只是一个普普通通的毕业生。但你知道——你做了这辈子最正确的一件事。你说了真话，你坚持了十六天，你等到了真相。</p><p>每当你路过食堂，你都会想起那颗鼠头。不是恶心，是骄傲。因为那颗鼠头，让你成为了一个勇敢的人。</p>',
      philosophy: '<strong>哲学反思：</strong>不是每个人都能成为英雄，但每个人都可以选择说真话。说真话的代价可能很大——但不说真话的代价，更大。' },
    'end_s2': { isEnding: true, endingIcon: '\ud83d\udee1\ufe0f', title: '吹哨人',
      endingText: '<p>你没有停下来。你成为了校园食品安全的倡导者。</p><p>你受邀参加了省教育厅的座谈会，你坐在台上，面对着一排领导。你说："食堂不是小事。每一个学生吃的每一顿饭，都关系到他们的健康、他们的家人、他们的未来。我们不能等到出了事才整改——我们必须在出事之前，就做好。"</p><p>你的发言被写进了会议纪要。三个月后，江西省出台了《高校食堂食品安全管理十条措施》，要求所有高校食堂必须安装明厨亮灶监控，必须定期接受第三方检测，必须建立学生监督委员会。</p><p>你看着那些文件，心里涌起一股暖意。你知道——你一个人的经历，变成了所有人的保护。你不需要成为名人，你只需要做成这件事。</p>',
      philosophy: '<strong>哲学反思：</strong>真正的英雄，不是打倒恶龙的人，而是让恶龙永远不会再出现的人。一个人的勇气，可以改变千千万万人的命运。' },
    'end_s3': { isEnding: true, endingIcon: '\ud83d\ude36', title: '帮凶',
      endingText: '<p>你改了口。学校兑现了承诺——保研、奖学金、优秀毕业生。你看起来拥有了一个光明的前途。</p><p>但你知道，你失去了什么。每次你走过食堂，你都会低着头。每次你看到同学在吃饭，你都会想——他们吃的是不是也有问题？每次你看到"指鼠为鸭"的段子，你都会感到一阵刺痛。</p><p>你保研了，但你的导师在面试时问了你一句："听说你改过口？"你愣住了。你发现——你的选择，变成了你的标签。你逃不掉。</p><p>后来，你在深夜刷到了一条评论："那个学生才是最大的受害者——他被逼着说了谎，然后一辈子活在谎言里。"你盯着那条评论，看了很久。然后你哭了。</p>',
      philosophy: '<strong>哲学反思：</strong>谎言是一笔高利贷。你今天借了它，明天它就会连本带利地找你要回来。说真话很难——但说假话的代价，是终身的。' },
    'end_s4': { isEnding: true, endingIcon: '\u270d\ufe0f', title: '记录者',
      endingText: '<p>你写下了你的故事。从6月1日到6月17日，每一天，每一个细节，每一个选择，每一次动摇。</p><p>你的文章被一家媒体发表了。标题是<strong>《我在食堂吃到了鼠头，学校让我说是鸭脖》</strong>。文章发出去的第一天，阅读量就破了百万。评论区里，无数人给你留言——</p><p>"谢谢你坚持了真相。"</p><p>"你是这个时代的良心。"</p><p>"作为学生家长，我感谢你。"</p><p>你看着那些留言，心里很平静。你不是为了出名，你只是想让更多人知道——真相，值得被说出来。哪怕要等十六天，哪怕要面对无数压力——真相，永远值得。</p>',
      philosophy: '<strong>哲学反思：</strong>故事的力量，在于它能让一个人的经历，变成所有人的经历。当你写下你的故事，你就把真相传递了出去——而真相，是永远不会死的。' },
    'end_s5': { isEnding: true, endingIcon: '\ud83d\udca1', title: '聪明的生存者',
      endingText: '<p>你做了最聪明的选择——你表面上答应了学校，但暗中保留了所有证据。你拿到了保研名额，同时你把证据交给了调查组。</p><p>调查组通报的那天，你收到了学校的道歉信。学校说："我们理解你的处境。你做得对。"你笑了——你不需要他们的理解，你只需要你的良心。</p><p>后来，有人问起你的选择。你说："我没有做英雄，我也没有做帮凶。我做了我该做的事——保护自己，也保护真相。在这个世界上，有时候，最勇敢的事不是对抗，而是<strong>在夹缝中生存，同时不放弃你的底线</strong>。"</p><p>你毕业了，你保研了，你拿到了奖学金。你看起来和其他毕业生没什么不同。但你知道——你不一样。因为你在最黑暗的时候，仍然守住了一束光。</p>',
      philosophy: '<strong>哲学反思：</strong>不是每个人都能成为殉道者。有时候，最聪明的勇敢，是在不放弃底线的同时，保护自己。生存和真相，不是非此即彼的选择。' },
    'end_s6': { isEnding: true, endingIcon: '\ud83c\udf1f', title: '沉默者的代价',
      endingText: '<p>你选择了沉默。学校给了你承诺，你删了视频，你改了说法。你告诉自己——你只是想过正常的生活。</p><p>但正常的生活，从来没有回来。你走在校园里，有人在背后指指点点。你听到有人小声说："就是那个吃出鼠头的……后来改口了。"你假装没听见，但你的耳朵不聋。</p><p>你毕业了，找了一份工作。面试的时候，HR看了你的简历，愣了一下："你是那个……"你没有回答。你只是笑了笑，说："过去的就过去了。"但你知道——过去的，从来没有过去。</p><p>你一辈子都活在那个选择题里——你选择了沉默，但沉默选择了你。你没法忘记，你没法释怀，你没法原谅自己。</p>',

    // ── Endings ──
    'end_d1': { isEnding: true, endingIcon: '\ud83d\udcd6', title: '二十年后的反思',
      endingText: '<p>你被免职了。你回到了家，开始反思你的一生。</p><p>你做了二十年公务员，处理过无数食品安全事件。你曾经是一个好干部——你查封过黑作坊，你处罚过不良商家，你保护过消费者的权益。但这一次，你失败了。你为了保住自己的位置，说了一句谎话。一句谎话，毁了二十年。</p><p>你开始写回忆录。你把你做过的每一个决定，遇到的每一次选择，都写了下来。你写到你为什么选择了说谎——因为你怕。你怕失去副局长位置，你怕得罪老领导，你怕影响你的家庭。但你现在明白了——<strong>你怕的那些东西，和你失去的良心相比，一文不值</strong>。</p><p>你的女儿读了你的回忆录。她看完之后，抱着你，说："爸爸，你犯了一个错误。但你承认了。这比什么都重要。"</p>',

      endingText: '<p>你被免职了。你成了这件事的"替罪羊"。学校领导没事，食堂承包商交了罚款继续营业，只有你——被免职了。</p><p>你坐在家里，看着新闻。新闻里说："江某某被免职，体现了我们坚决整治不正之风的决心。"你笑了——不是开心，是苦笑。你只是这个系统里的一颗螺丝钉——他们需要你的时候，把你拧紧；他们不需要你的时候，把你拧下来。</p><p>你想起在发布会上——如果你当时说了真话，结果会不会不一样？但你知道，没有如果。你只是替罪羊——一个替整个系统背锅的人。</p>',

    'end_d3': { isEnding: true, endingIcon: '\ud83c\udf31', title: '重新开始',

      philosophy: '<strong>哲学反思：</strong>有时候，失去意味着获得。当你失去了权力，你获得了自由；当你失去了谎言，你获得了真相；当你失去了职位，你获得了自己。' },
    'end_d4': { isEnding: true, endingIcon: '\ud83d\udee1\ufe0f', title: '将功补过',
      endingText: '<p>你被免职之后，没有消沉。你主动联系了调查组，把你知道的所有内幕——学校怎么施压、老领导怎么打招呼、系统里怎么"捂盖子"——全都说了出来。</p><p>你的供述，推动了整个事件的调查。不仅学校被处罚了，那些在幕后打招呼的人，也被约谈了。你的信息，帮助调查组挖出了更多的食品安全隐患。</p><p>有人骂你"叛徒"，有人说你"将功补过"。你不在乎——你只知道，你终于做了一件正确的事。虽然晚了，但至少——你做了。</p><p>后来，你被邀请去给基层干部做培训。你站在台上，说："我犯过一个错误——我对着镜头说了一句谎话。我花了二十年才明白——说真话，不需要任何代价。但不说真话，代价是你的一生。"</p>',

    'end_d6': { isEnding: true, endingIcon: '\ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67\u200d\ud83d\udc66', title: '家人的港湾',
      endingText: '<p>你被免职之后，你女儿从学校回来，抱着你哭了。她说："爸爸，同学们都在笑话我。他们说你撒谎。"你抱着她，不知道该怎么解释。</p><p>你妻子走过来，把你的脑袋按在她的肩膀上，说："没关系。我们重新开始。"你听着她的话，眼泪掉了下来。你做了二十年的公务员，你从来没有觉得自己需要被原谅——但这一刻，你需要。</p><p>你开始重新学习做一个诚实的人。你对你女儿说真话，你对你妻子说真话，你对你邻居说真话。你发现——说真话，其实没有那么难。难的，是第一次说真话。</p><p>后来，你女儿在作文里写："我爸爸犯过一个错误，但他承认了。他是我心中的英雄。"你看着那篇作文，哭了很久。不是因为难过——是因为，你终于被原谅了。</p>',

    'end_d7': { isEnding: true, endingIcon: '\ud83d\udcdd', title: '公开道歉信',
      endingText: '<p>你写了一封公开道歉信，发在了网上。信中你写道：</p><p>"我叫江某某，我是那个在发布会上说'确认为鸭脖'的人。我错了。我看了照片，我知道那不是鸭脖。但我没有坚持我的判断。我选择了相信学校的说法，我选择了保护自己的位置。我辜负了公众的信任，我辜负了这身制服。我向所有人道歉——向那个学生，向所有关注这件事的网友，向所有被我的谎言伤害的人。对不起。"</p><p>你的道歉信被转发了上百万次。评论区里，有人骂你，有人原谅你，有人说"早干嘛去了"。你看着那些评论，心里很平静。因为你知道——你终于说出了真相。虽然晚了，但至少——你说了。</p>',

    'end_d8': { isEnding: true, endingIcon: '\ud83c\udf0d', title: '制度反思者',
      endingText: '<p>你被免职之后，你没有消沉。你开始研究——为什么一个做了二十年食品安全工作的人，会对着镜头说一句谎话？</p><p>你发现，这不是你一个人的问题。你的行为，是体制的产物——上级施压，下级服从，中间层揣摩上意，基层执行。没有人想撒谎，但没有人敢说真话。因为说真话的代价，太大了。</p><p>你写了一篇文章：《从"指鼠为鸭"看基层干部的说谎困境》。文章发表后，引起了巨大反响。有学者引用你的文章，有官员私下联系你，有人说你"说出了我们的心声"。</p><p>你发现——你一个人的错误，变成了整个系统的反思。你不需要成为英雄，你只需要成为那个敢于承认错误的人。</p>',

      ] },
    'c2': { sceneNum: '第二幕', title: '学校经理施压',
      text: '<p>事情闹大了。学校食堂经理找到了你，把你拉到了办公室。</p><p>"老朱，你这次，麻烦大了。"经理的脸色很难看。"学校领导已经知道了。上面说了——这件事，<strong>就说是鸭脖</strong>。你不要乱说，学校不会亏待你。"</p><p>你看着经理。你认识他三年了，他平时对你不错。但此刻，他看你的眼神，像在看一个麻烦——一个需要被处理的麻烦。</p><p>"如果我说是鼠头呢？"你问。经理的脸色变了："那你就是自找的。你的档口会被封，你的押金会被扣，你还可能被起诉。你想想——你赔得起吗？"</p><p>你坐在那里，手心全是汗。你想起你的老婆、你的孩子、你的房贷。你只是一个档口老板——你拿什么跟学校对抗？</p>',
      choices: [
        { text: '坚持说真话，拒绝改口', hint: '诚信值+20, 生存值-15', meterChange: { honesty: 20, survival: -15 }, nextScene: 'c3', bridge: '<strong>你站起来，看着经理。</strong>你说："经理，我做了三年生意，从来没有让学生吃出过问题。但这一次，我错了。我不会说那颗鼠头是鸭脖。我宁愿档口被封，也不愿意再骗人。"经理看着你，眼神复杂。' },
        { text: '答应改口，配合学校', hint: '诚信值-20, 生存值+10', meterChange: { honesty: -20, survival: 10 }, nextScene: 'c3', bridge: '<strong>你低下了头。</strong>你说："好。我配合。那就是鸭脖。"你说完之后，经理拍了拍你的肩膀："老朱，你是个聪明人。放心，学校不会亏待你。"但你心里知道——你亏待了你自己。' }
      ] },
    'c3': { sceneNum: '第三幕', title: '试图私了',
      text: '<p>你找到了那个学生。你想私下解决——给他钱，让他删视频，让他改口。你觉得自己在做一件"正确"的事——保护自己的生意，保护自己的家庭。</p><p>你坐在学生对面，拿出一个信封，里面是两千块钱。你说："同学，这次是我们的问题。这点钱，你先拿着。你把视频删了，我们当什么都没发生，好不好？"</p><p>学生看着你，眼神很复杂。他张了张嘴，最后说："老板，我不是要钱。我只是想知道——我吃到的，到底是什么？"</p><p>你看着他，你看到了他眼睛里的恐惧——不是对老鼠的恐惧，是对谎言的恐惧。你突然觉得——你手里的信封，很沉。</p>',
      choices: [
        { text: '说实话——那是鼠头', hint: '诚信值+15, 生存值-10', meterChange: { honesty: 15, survival: -10 }, nextScene: 'c4', bridge: '<strong>你放下了信封。</strong>你说："同学，对不起。那不是鸭脖，那是鼠头。后厨闹老鼠，我没有处理好。我向你道歉。"学生看着你，沉默了很久。然后他说："谢谢你说实话。"' },
        { text: '继续撒谎，坚持是鸭脖', hint: '诚信值-15, 生存值+5', meterChange: { honesty: -15, survival: 5 }, nextScene: 'c4', bridge: '<strong>你咬着牙说："就是鸭脖。你信也好，不信也好，就是鸭脖。"</strong>学生看着你，眼神从期待变成了失望。他站起来，说："我知道了。"然后他走了。你看着他的背影，知道自己失去了什么——不是生意，是信誉。' }
      ] },
    'c4': { sceneNum: '第四幕', title: '生意一落千丈',
      text: '<p>视频在网上疯了。你的档口，成了全校的"景点"。每天都有学生来你的档口前拍照、拍视频、指指点点。有人对着你的档口喊"鸭脖！鸭脖！"，有人把"指鼠为鸭"打印出来贴在档口门口。</p><p>你的生意从每天两百份，降到了每天不到十份。你的员工走了一半——他们觉得丢人，也觉得不安全。你每天开门，面对的都是空荡荡的座位和窃窃私语。</p><p>你站在档口后面，看着那些空着的座位，心里像被刀割一样。你做了三年，从早忙到晚，从来没有这么惨过。你想起你刚接手这个档口的时候——你发誓，要做食堂里最好吃的鸭脖饭。现在，你成了全校的笑话。</p>',
      image: 'assets/kitchen_rats.jpg', imageCaption: '图：事件曝光后，朱老板的档口生意一落千丈，每天只有寥寥几个顾客',
      choices: [
        { text: '公开道歉，承诺整改', hint: '诚信值+15, 生存值+5', meterChange: { honesty: 15, survival: 5 }, nextScene: 'c5', bridge: '<strong>你站在档口前，对着所有路过的学生大声说："我错了！从今天起，我的档口全面整改！欢迎大家监督！"</strong>你说完之后，有人鼓掌，有人拍照，有人冷笑。但至少——你说了实话。' },
        { text: '关门躲风头', hint: '诚信值-5, 生存值-10', meterChange: { honesty: -5, survival: -10 }, nextScene: 'c5', bridge: '<strong>你关了档口，躲在出租屋里。</strong>你不敢出门，不敢接电话，不敢看手机。你告诉自己：等风头过了，再重新开业。但你不知道——风头，永远不会过。因为你的名字，已经和"指鼠为鸭"绑在了一起。' }
      ] },
    'c5': { sceneNum: '第五幕', title: '网络发酵——全网声讨',
      text: '<p>你的档口，成了全网声讨的对象。你的名字被扒了出来——"朱某某，江西工业职业技术学院第一食堂鸭脖饭档口老板"。你的照片被发到了网上，你的电话被曝光，你的家庭住址被人肉。</p><p><strong>微博热搜</strong>：\u201c鸭脖饭老板\u201d\u201c指鼠为鸭档口\u201d\u201c朱老板的鸭脖\u201d——这些话题下面，全是骂声。有人要你出来道歉，有人要你赔偿学生，有人要你去坐牢。</p><p><strong>抖音</strong>：有人去你的档口拍了视频，配文\u201c指鼠为鸭的现场\u201d。有人把你的头像P到了老鼠身上，配乐《老鼠爱大米》。你的手机响了——不是订单，是骚扰电话。你接了，对方不说话，只是笑。</p><p>你坐在出租屋里，关着灯，不敢开。你老婆打电话来，声音颤抖："你知不知道网上都在骂你？你知不知道儿子在学校被同学笑话了？"你挂了电话，一个人坐在黑暗里。</p>',
      image: 'assets/kitchen_rats.jpg', imageCaption: '图：朱老板被全网人肉，电话被曝光，遭遇网络暴力',
      choices: [
        { text: '公开道歉，接受处罚', hint: '诚信值+20, 生存值-15', meterChange: { honesty: 20, survival: -15 }, nextScene: 'c6', bridge: '<strong>你录制了一段视频。</strong>你对着镜头说："我是朱某某。我错了。后厨闹老鼠，我没有处理好，让一个学生吃到了鼠头。我还撒谎说那是鸭脖。我向那个学生道歉，向所有在我档口吃过饭的同学道歉，向所有关注这件事的人道歉。我愿意接受一切处罚。"' },
        { text: '继续隐瞒，推卸责任', hint: '诚信值-20, 生存值+5', meterChange: { honesty: -20, survival: 5 }, nextScene: 'c6', bridge: '<strong>你发了一条声明。</strong>你说："我的档口一直严格按照卫生标准操作。所谓鼠头，是学生恶意捏造。我已经报警。"你发完之后，评论区炸了——"你再说一遍？""报警？你报啊！""不撞南墙不回头！"你看着那些评论，手在抖。' }
      ] },
    'c6': { sceneNum: '第六幕', title: '学校让背锅',
      text: '<p>6月10日，学校找到了你。不是来帮你的——是来让你背锅的。</p><p>"老朱，你的事，影响太坏了。"学校领导说，"现在学校被推到了风口浪尖。上面说了——这件事，需要有人负责。你明白我的意思吗？"</p><p>你明白了。学校的意思是——<strong>你一个人把锅背了，学校就没事了</strong>。你的档口会被封，你的押金会被扣，你可能还会被罚款。但学校——学校会继续运营，学校领导会继续当官，一切都会恢复原样。</p><p>你看着他们。你想起三年前，你签合同的时候，他们拍着你的肩膀说："老朱，好好干，学校不会亏待你。"现在，他们拍着你的肩膀，说："老朱，你体谅一下学校的难处。"</p>',
      choices: [
        { text: '拒绝背锅，揭露学校责任', hint: '诚信值+15, 生存值-20', meterChange: { honesty: 15, survival: -20 }, nextScene: 'c7', bridge: '<strong>你站起来，说："我不背这个锅。后厨闹老鼠，不是一天两天了。我反映过很多次，学校没有处理。你们让我说假话，让我改口——现在出了事，你们让我一个人扛？"</strong>学校领导的脸，一下子黑了。' },
        { text: '认命，背下所有责任', hint: '诚信值-10, 生存值-15', meterChange: { honesty: -10, survival: -15 }, nextScene: 'c7', bridge: '<strong>你低下了头。</strong>你说："好。我负责。档口关了，押金不要了，罚款我认。"你说完之后，感到一阵空虚。你做了三年的生意，最后剩下的，只有一纸处罚通知。' }
      ] },
    'c7': { sceneNum: '第七幕', title: '调查组调查',
      text: '<p>省调查组进驻了。他们找到了你，问了你三个小时。你把你所知道的——后厨的老鼠问题、学校的施压、经理的暗示——全说了。</p><p>调查组的人记录了你的每一句话。他们看起来很专业，很认真。你第一次觉得——有人真的想搞清楚这件事。</p><p>调查组组长问你："你最后悔的是什么？"你想了想，说："我最后悔的，不是后厨闹了老鼠——那个我控制不了。我最后悔的，是当那个学生指着鼠头问我'这是什么'的时候，我撒了谎。我说那是鸭脖。那句话，是我这辈子说的最蠢的话。"</p>',
      choices: [
        { text: '全力配合调查，如实交代', hint: '诚信值+20, 生存值-10', meterChange: { honesty: 20, survival: -10 }, nextScene: 'c8', bridge: '<strong>你把所有证据都交了出来。</strong>进货单、消毒记录、灭鼠记录、与学校经理的聊天记录——你保留了三年。你说："我知道这一天迟早会来。所以我准备了这些。"调查组的人看了看那些材料，点了点头。' },
        { text: '有所保留，保护自己', hint: '诚信值-10, 生存值+5', meterChange: { honesty: -10, survival: 5 }, nextScene: 'c8', bridge: '<strong>你只说了一半。</strong>你说了后厨的老鼠问题，但你没有说学校让你改口。你说了你撒了谎，但你没有说学校给你施压。你告诉自己：我只是在保护自己。但调查组的人，显然看出来了你的保留。' }
      ] },
    'c8': { sceneNum: '第八幕', title: '被处罚',
      text: '<p>6月17日，调查结果公布。你的档口被查封，你的食品经营许可证被吊销，你被罚款五万元。学校的处罚更重——食堂承包商被吊销许可证，学校被责令整改。</p><p>你站在被封的档口前，看着那张封条。三年的心血，变成了一张纸。你想起你第一天开业的时候——你站在这个位置，对着镜子整理围裙，告诉自己："老朱，好好干，要对得起每一个来吃饭的学生。"</p><p>你做到了吗？你没有。你让一个学生吃了鼠头，你还说那是鸭脖。你对不起他，你也对不起你自己。</p><p>你转身，走出了食堂。阳光很好，照在你脸上。你深吸了一口气——这是你三年来，第一次觉得自己是自由的。因为从今天起，你不需要再说谎了。</p>',
      choices: [
        { text: '接受处罚，重新开始', hint: '诚信值+10, 生存值-10', meterChange: { honesty: 10, survival: -10 }, nextScene: 'end_c1', bridge: '<strong>你接受了处罚。你告诉自己：这是你应得的。你犯了错，你撒了谎，你伤害了别人。现在，你该承受后果了。你收拾了东西，走出了食堂。你不知道未来会怎样——但你知道，你不会再说谎了。' },
        { text: '不服处罚，继续申诉', hint: '诚信值-5, 生存值+5', meterChange: { honesty: -5, survival: 5 }, nextScene: 'end_c2', bridge: '<strong>你觉得处罚太重了。</strong>你找了律师，提起了申诉。你说："学校也有责任，为什么只处罚我？"你的申诉引起了媒体的关注——有人支持你，有人骂你死不悔改。' }
      ] },
    // ── Endings ──
    'end_c1': { isEnding: true, endingIcon: '\ud83c\udf73', title: '重新开始',
      endingText: '<p>你离开了学校食堂。你回到了老家，开了一家小吃店。不大，只有几张桌子，但每一样食材都是你亲自挑选的，每一个角落都是你亲自打扫的。</p><p>你在店门口挂了一块牌子：<strong>"本店绝不卖鸭脖。"</strong>有人看了笑，有人看了问，有人看了竖起大拇指。你笑笑，不说原因。</p><p>后来，有以前的学生来你的店里吃饭。他认出了你，愣了一下。你认出了他——就是那个吃出鼠头的学生。他站在你面前，你们对视了很久。然后他说："老板，来一份你拿手的。"你点了点头，转身进了厨房。你做了你最好的菜，端到他面前。他吃了一口，说："好吃。"</p><p>你笑了。不是因为生意好——是因为，你终于得到了原谅。</p>',
      philosophy: '<strong>哲学反思：</strong>认错不可怕，可怕的是不敢认错。当你承认了错误，你才有机会重新开始。而重新开始，什么时候都不晚。' },
    'end_c2': { isEnding: true, endingIcon: '\u2696\ufe0f', title: '申诉之路',
      endingText: '<p>你提起了申诉。你说学校也有责任——后厨的老鼠问题，你反映过很多次，学校没有处理。学校让你改口，让你撒谎，让你背锅。</p><p>你的申诉引起了媒体的关注。有记者采访了你，你的故事被更多人知道了。有人支持你，说你"不应该一个人扛"；有人骂你，说你"推卸责任"。</p><p>最终，你的处罚被减轻了——罚款从五万降到了两万，但你的经营许可证，还是被吊销了。你不能再做餐饮了。</p><p>你站在法院门口，看着判决书。你赢了部分，但输掉了全部。你发现——在这个系统里，小的个体，永远斗不过大的机构。你的申诉，只是让你死得慢一点。</p>',
      philosophy: '<strong>哲学反思：</strong>在系统面前，个体是渺小的。但渺小不等于放弃。当你为你的权利而斗争，你不仅在为自己斗争——你也在为所有像你一样的人斗争。' },
    'end_c3': { isEnding: true, endingIcon: '\ud83d\ude14', title: '一蹶不振',
      endingText: '<p>你被处罚之后，你老婆跟你离了婚。她说："我受不了了。每天接到骚扰电话，每天被人指指点点，每天活在恐惧里。我受不了了。"</p><p>你看着她收拾东西，你看着你的孩子被她带走。你站在空荡荡的房间里，觉得整个世界都塌了。</p><p>你开始酗酒。你每天坐在出租屋里，一瓶一瓶地喝。你不想出门，不想见人，不想活。你想起你撒谎的那一刻——"这就是鸭脖。"如果当时你说了实话，结果会不会不一样？但你知道，没有如果。</p><p>你只是一个档口老板，你撒了一个谎，然后你失去了一切。</p>',
      philosophy: '<strong>哲学反思：</strong>一个谎言，可以毁掉一个人的一生。不是因为谎言本身有多严重——而是因为谎言让你失去了最宝贵的东西：信任。当别人不再信任你，你就什么都没有了。' },
    'end_c4': { isEnding: true, endingIcon: '\ud83c\udfea', title: '东山再起',
      endingText: '<p>你被处罚之后，你没有消沉。你用剩下的积蓄，在另一个城市开了一家新店。你换了一个名字，换了一个菜单，换了一个经营模式。你引进了最严格的食品安全标准——明厨亮灶、全程监控、第三方检测。你的店里，每个角落都一尘不染。你的食材，每一批都有检测报告。</p><p>你的新店火了。不是因为炒作——是因为你的食品真的安全。有人从很远的地方来，就为了吃你的一碗面。你的故事被媒体报道了——"从指鼠为鸭的档口老板，到食品安全标杆。"</p><p>你看着那些报道，心里很平静。你知道——你不是在洗白，你是在赎罪。你用你的新店，向所有人证明——<strong>人可以犯错，但人也可以改</strong>。</p>',
      philosophy: '<strong>哲学反思：</strong>最好的道歉，不是嘴上说"对不起"，而是用行动证明"我改了"。当你用行动去弥补你的错误，你就已经不再是那个犯错的人了。' },
    'end_c5': { isEnding: true, endingIcon: '\ud83d\udcdd', title: '举报信',
      endingText: '<p>你写了一封举报信，详细描述了学校如何让你改口、如何让你背锅、如何掩盖真相。你把信寄给了省教育厅、省市场监管局、省纪委。</p><p>你的举报信，被调查组看到了。他们根据你的信，挖出了更多的问题——学校领导的违规操作、食堂承包商的利益输送、系统里的"捂盖子"文化。</p><p>几个学校领导被约谈了。食堂承包商被追究了责任。你的举报，推动了对整个学校食品安全体系的彻查。</p><p>有人骂你"叛徒"，有人说你"狗急跳墙"。你不在乎——你只是做了你早就该做的事：说真话。</p>',
      philosophy: '<strong>哲学反思：</strong>举报不是背叛，是救赎。当你揭发了一个不公正的系统，你不仅是在保护自己——你是在保护所有可能被这个系统伤害的人。' },
    'end_c6': { isEnding: true, endingIcon: '\ud83d\udc64', title: '隐形人',
      endingText: '<p>你被处罚之后，你选择了消失。你搬到了另一个城市，换了一个名字，找了一份普通的工作——在工厂里做流水线。你不再做餐饮，不再提过去，不再跟任何人联系。</p><p>你每天十二个小时，站在流水线旁边，重复着同一个动作。你的手，从拿菜刀变成了拿螺丝刀。你的眼睛，从看菜谱变成了看示波器。你不再想起"指鼠为鸭"，不再想起那个学生，不再想起那个档口。你只是在活着。</p><p>但有时候，夜深人静的时候，你会梦到那个档口。梦到你在做鸭脖饭，梦到那个学生端着餐盘走过来，梦到你自己说："这就是鸭脖。"然后你醒了，发现自己在一个陌生的城市，一个陌生的房间里。</p>',

      text: '<p>6月14日，你看到了一条新闻——<strong>江西省成立联合调查组，进驻学校彻查</strong>。你看着这条新闻，心里涌起一股暖意——你的努力，你们所有人的努力，起作用了。</p><p>你想起你第一次刷到那个视频的时候——你只是觉得恶心，愤怒，然后转发。你没有想过，你的转发，和千千万万其他人的转发一起，会变成一股推动调查的力量。</p><p>你开始反思——<strong>网络舆论，到底是什么？</strong>它是一种武器，可以伤害无辜的人——就像那些被人肉的人。但它也是一种力量，可以推动真相，可以改变制度，可以让沉默的人不敢再沉默。</p><p>你发现——网络舆论，是一把双刃剑。你用得好，它可以让正义提前到来；你用不好，它可以让暴力代替正义。</p>',

        { text: '继续推动舆论，关注调查进展', hint: '影响力+15, 正义值+10', meterChange: { influence: 15, justice: 10 }, nextScene: 'c7', bridge: '<strong>你开始持续关注调查进展。</strong>你每天刷新新闻，关注每一个细节。你发现——调查组的每一步，都有人在网上讨论。你加入了讨论，你提出了问题，你推动了思考。' },
        { text: '反思舆论的边界，开始思考更深问题', hint: '影响力+5, 正义值+15', meterChange: { influence: 5, justice: 15 }, nextScene: 'c7', bridge: '<strong>你开始写一篇文章。</strong>标题是《从指鼠为鸭看网络舆论的双刃剑》。你分析了网络舆论如何推动真相，也分析了网络舆论如何制造暴力。你提出了一个问题——<strong>我们如何在追求正义的同时，不变成另一种形式的暴力？</strong>' }
      ] },
    'c7': { sceneNum: '第七幕', title: '省调查组',
      text: '<p>6月17日，调查结果公布：异物确认为鼠头。学校被责令整改，食堂承包商被吊销许可证，江局长被免职。你看到这条新闻的时候，心里涌起了一种复杂的感觉——不是开心，不是愤怒，是一种说不清的感慨。</p><p>你想起这十六天——从你刷到视频的那一刻，到今天调查结果公布。你转发了多少次，评论了多少次，制作了多少内容。你不是一个人在战斗——全网的网友，都是你的战友。你们用一条条转发、一个个评论、一张张表情包，推动了一场调查，改变了一个结果。</p><p>你打开朋友圈，看到有人发了一条状态："<strong>指鼠为鸭，终于真相大白。谢谢每一个转发的你。</strong>"你点了一个赞。然后你靠在椅背上，长出了一口气。</p>',
      choices: [
        { text: '功成身退，回归正常生活', hint: '影响力不变, 正义值+10', meterChange: { influence: 0, justice: 10 }, nextScene: 'end_n1', bridge: '<strong>你关掉了微博，退出了话题。</strong>你告诉自己：你做了你该做的事。现在，事情解决了，你可以回归正常生活了。你打开了一本书，那是你十六天前读到一半的。你翻到了那一页，继续读。' },
        { text: '继续监督，防止问题反弹', hint: '影响力+10, 正义值+15', meterChange: { influence: 10, justice: 15 }, nextScene: 'end_n2', bridge: '<strong>你没有停下来。</strong>你开始关注后续——学校整改了吗？食堂真的变好了吗？江局长真的被免职了吗？你发现——真相大白，只是第一步。持续监督，才是真正的正义。' },
        { text: '从网络到现实，参与制度改进', hint: '影响力+10, 正义值+20', meterChange: { influence: 10, justice: 20 }, nextScene: 'end_n3', bridge: '<strong>你做了一个决定——你不能只做键盘侠。</strong>你开始关注你所在城市的食品安全问题，你参与了社区的食品安全监督工作，你甚至报名参加了食品安全志愿者。' }
      ] },
    // ── Endings ──
    'end_n1': { isEnding: true, endingIcon: '\ud83d\udcf1', title: '吃瓜群众',
      endingText: '<p>真相大白了。你退出了话题，回归了正常生活。你继续刷短视频——美妆教程、搞笑段子、宠物猫狗。偶尔，你会刷到"指鼠为鸭"的后续报道，你点进去看一眼，然后划走。</p><p>有人问你："你参与了那个热搜吗？"你说："我就转了几条微博，做了几个表情包。"你觉得自己只是吃了个瓜——但你知道，你不仅仅是在吃瓜。你是在参与历史。</p><p>后来，有人写了关于"指鼠为鸭"的书。你买了一本，翻了翻——里面提到了网友的力量。你笑了。你知道，你也是那股力量的一部分。虽然很小，但不可或缺。</p>',
      philosophy: '<strong>哲学反思：</strong>在这个时代，每个人都是历史的参与者。你的一次转发、一条评论、一个表情包——都可能成为推动历史的力量。不要小看自己——你就是那个改变世界的人。' },
    'end_n2': { isEnding: true, endingIcon: '\ud83d\udd0d', title: '持续监督者',
      endingText: '<p>你没有停下来。真相大白之后，你开始关注后续——学校真的整改了吗？食堂真的变好了吗？江局长真的被免职了？</p><p>你发现——整改，是一个漫长的过程。学校换了食堂承包商，但新的承包商，会不会也有问题？江局长被免职了，但系统里的"捂盖子"文化，会不会还在？</p><p>你开始持续发声。你发微博、写文章、参与讨论。你发现——<strong>正义，不是一次性的消费品。它需要持续的维护，需要不间断的关注，需要每一个人都不放弃。</strong></p><p>后来，有人给你发私信："谢谢你一直在关注。因为有你们这样的人，我们才敢相信——正义，不会迟到。"你看着那条私信，笑了。</p>',
      philosophy: '<strong>哲学反思：</strong>正义不是一次性的事件——它是一场持续的战斗。当你以为正义已经到来的时候，它可能正在悄悄溜走。只有持续关注，持续监督，持续发声——正义，才能真正落地。' },
    'end_n3': { isEnding: true, endingIcon: '\ud83c\udf0d', title: '从键盘到行动',
      endingText: '<p>"指鼠为鸭"事件之后，你做了一个决定——你不能只做键盘侠。你开始关注你所在城市的食品安全问题，你加入了社区的食品安全监督志愿者队伍，你甚至考取了食品安全监督员的证书。</p><p>你每周去一次菜市场，检查摊贩的卫生状况。你每月去一次学校食堂，看看孩子们的饭菜。你发现——<strong>真实世界的改变，比网络世界慢得多</strong>。在网络上，你可以用一条转发改变舆论；但在现实中，你需要用一个月、一年、甚至一辈子的时间，去改变一个系统。</p><p>但你没有放弃。因为你记得——你曾经因为一条视频，参与了一场改变。你知道——每一个人的力量，都很小。但当你把力量用在正确的地方，它就可以改变世界。</p>',
      philosophy: '<strong>哲学反思：</strong>键盘侠和行动者之间，只差一步——从线上到线下。当你把键盘上的愤怒，转化为现实中的行动，你就从一个旁观者，变成了一个改变者。' },
    'end_n4': { isEnding: true, endingIcon: '\u270d\ufe0f', title: '记录者',
      endingText: '<p>你开始写"指鼠为鸭"事件的完整记录。你搜集了所有能找到的资料——视频、照片、通报、发布会录像、调查结果。你采访了当事人——那个学生、那个食堂老板、那个被免职的局长。你花了三个月，写了十万字。</p><p>你的文章发表后，引起了巨大反响。有人称你为"数字时代的司马迁"，有人说你"记录了一个时代的荒诞"。你不在乎这些称号——你只是觉得，这个故事，值得被完整地记录下来。</p><p>后来，有人把你的文章改编成了剧本。你看了样片——镜头里，那个学生端着餐盘站在食堂里，浑身发抖。你看着那个画面，想起了你第一次刷到视频的那一刻。你发现——<strong>记录，就是让历史不被遗忘。</strong></p>',
      philosophy: '<strong>哲学反思：</strong>记录，是抵抗遗忘最有力的武器。当你把一件事完整地记录下来，你就让这件事，成为了历史的一部分。而历史，会告诉未来——我们曾经犯过什么错误，我们又曾经如何改正。' },
    'end_n5': { isEnding: true, endingIcon: '\ud83d\udcbb', title: '流量猎手',
      endingText: '<p>你发现"指鼠为鸭"是一个巨大的流量池。你开始疯狂蹭热度——你做了各种表情包、搞笑视频、分析文章。你的粉丝从几百涨到了几十万。你开始接广告，开始做直播，开始赚流量带来的钱。</p><p>但你也发现——<strong>流量是一把双刃剑</strong>。你越追流量，流量就越控制你。你开始为了流量做你不想做的事——你开始夸大其词，你开始挑拨情绪，你开始制造对立。你不再关心真相——你只关心流量。</p><p>有一天，你看着镜子里的自己，你发现——你变成了你最讨厌的那种人。你曾经嘲笑过那些蹭热度的网红——现在，你成了他们。</p>',
      philosophy: '<strong>哲学反思：</strong>流量是毒药，也是解药。当你为了流量追逐真相，你就失去了真相；当你为了真相放弃流量，你就得到了真相。选择权，在你手里。' },
    'end_n6': { isEnding: true, endingIcon: '\ud83e\udd14', title: '沉默的转发者',
      endingText: '<p>你转发了视频，写了几条评论，然后就没有然后了。你看着事情一天天发展——学校发通报，江局长开发布会，调查组介入，真相大白。你一直没有再参与——你只是看着。</p><p>后来，有人问你："你参与了那个热搜吗？"你说："我转发了。但不知道有没有用。"你觉得自己只是大海里的一滴水——但你知道，大海，就是由无数滴水组成的。</p><p>你看着"指鼠为鸭"的结局——学校被整改，江局长被免职，食堂被查封。你心里涌起一种奇怪的感觉——<strong>你也是这个结局的一部分</strong>。虽然你只是转发了一下，但你的转发，和千千万万其他人的转发一起，推动了这一切。</p>',
      philosophy: '<strong>哲学反思：</strong>不要低估你的力量。你的一次转发，可能只是大海里的一滴水——但大海，就是由无数滴水组成的。每一滴水，都有它的价值。' },
    'end_n7': { isEnding: true, endingIcon: '\ud83d\udc65', title: '互联网时代的公民',
      endingText: '<p>"指鼠为鸭"事件之后，你变了。你不再只是一个刷短视频的网民——你成了一个有意识的公民。你开始关注公共事务，你开始参与社会讨论，你开始用你的声音去推动改变。</p><p>你发现——<strong>互联网，不仅是一个娱乐工具，它是一个民主工具</strong>。当你用互联网去关注公共事务，去参与社会讨论，去推动制度改进——你就不再只是一个网民，你是一个公民。</p><p>后来，你参与了更多的公共事件——食品安全、教育公平、环境保护。你发现——每当你参与，事情就会变好一点。虽然只是一点，但很多人的一点，加起来，就是很多点。</p><p>你看着镜子里的自己，你笑了。因为你发现——<strong>你找到了你的位置</strong>。不是旁观者，不是参与者，而是——<strong>公民</strong>。</p>',
      philosophy: '<strong>哲学反思：</strong>互联网时代，每个人都可以是公民。当你用你的声音去关注公共事务，去推动社会进步，你就从一个消费者，变成了一个公民。而公民，是这个时代最宝贵的身份。' },
    'end_n8': { isEnding: true, endingIcon: '\ud83c\udfad', title: '段子手的良知',
      endingText: '<p>你做了很多"指鼠为鸭"的表情包和段子。你的作品被转发了上百万次，你成了"网红段子手"。有人找你做商业合作，有人请你做品牌代言，有人让你开直播。</p><p>但你拒绝了。你说："我做的段子，不是为了赚钱。是为了让更多人知道真相。如果把真相变成生意，那真相就死了。"</p><p>你继续做你的段子——但你的段子，总是在说真话。你发现——<strong>幽默，是传播真相最好的方式</strong>。当人们笑了，他们就记住了。当他们记住了，他们就会去追问。当人们追问了，真相就藏不住了。</p><p>后来，有人问起你："你觉得自己是段子手还是媒体人？"你说："都不是。我只是一个用段子说真话的人。"</p>',
      philosophy: '<strong>哲学反思：</strong>幽默，是抵抗荒谬最有力的武器。当你用笑声去拆穿谎言，当你用段子去传播真相——你就在做一件伟大的事：让真相，变得不可忽视。' }
  };
